<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none" aria-hidden="true" focusable="false">
  <!-- Shield outline -->
  <path d="M40 6 L66 14 V40 C66 57 54 70 40 74 C26 70 14 57 14 40 V14 Z"
        fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  <!-- Inner ring -->
  <path d="M40 12 L60 18 V40 C60 54 50 65 40 68 C30 65 20 54 20 40 V18 Z"
        fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.4" stroke-linejoin="round"/>
  <!-- 8-pointed star (Islamic geometric pattern) -->
  <path d="M40 20 L43.5 32.5 L56 32.5 L46 40 L50 52.5 L40 45 L30 52.5 L34 40 L24 32.5 L36.5 32.5 Z"
        fill="currentColor" fill-opacity="0.9"/>
  <!-- Inner star highlight -->
  <circle cx="40" cy="40" r="2.5" fill="currentColor"/>
</svg>
