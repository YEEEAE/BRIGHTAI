<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none" aria-hidden="true" focusable="false">
  <!-- Outer circle (globe) -->
  <circle cx="40" cy="40" r="30" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Equator -->
  <ellipse cx="40" cy="40" rx="30" ry="12" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <!-- Meridian (vertical) -->
  <ellipse cx="40" cy="40" rx="12" ry="30" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <!-- Center cross -->
  <line x1="10" y1="40" x2="70" y2="40" stroke="currentColor" stroke-width="1" stroke-opacity="0.35"/>
  <line x1="40" y1="10" x2="40" y2="70" stroke="currentColor" stroke-width="1" stroke-opacity="0.35"/>
</svg>
