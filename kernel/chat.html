<body class="h-screen flex flex-col font-sans text-white overflow-hidden bright-page--kernel" data-bright-page-type="kernel">

  <!-- Main layout -->
  <main id="chat-main" role="main" tabindex="-1" class="flex flex-1 overflow-hidden relative focus:outline-none">

    <!-- Chat column -->
    <div class="flex-1 flex flex-col min-w-0">

      <!-- Chat area -->

        <!-- Welcome message -->

          <div class="whitespace-pre-wrap">مرحباً! أنا نواة BrightAI. يمكنني تحليل طلباتك والتحقق من توافقها مع سياسات الامتثال المحددة.

جرّب إرسال رسالة لبدء التحليل.</div>
        </div>
      </div>

      <!-- Input area -->
      <div class="shrink-0 border-t border-white/10 bg-ink-900/60 backdrop-blur-xl p-4">
        <!-- Pack pills -->
        <div class="flex flex-wrap gap-2 mb-3" role="group" aria-label="اختر حزمة الامتثال">
          <button class="pack-pill px-3 py-1 rounded-full text-xs font-medium transition-colors bg-brand-500 text-white" data-pack="general" aria-pressed="true" onclick="setPack('general')">عام</button>
          <button class="pack-pill px-3 py-1 rounded-full text-xs font-medium transition-colors bg-ink-800 text-gray-400 border border-white/10" data-pack="pdpl" aria-pressed="false" onclick="setPack('pdpl')">PDPL</button>
          <button class="pack-pill px-3 py-1 rounded-full text-xs font-medium transition-colors bg-ink-800 text-gray-400 border border-white/10" data-pack="nca_ecc" aria-pressed="false" onclick="setPack('nca_ecc')">NCA ECC</button>
          <button class="pack-pill px-3 py-1 rounded-full text-xs font-medium transition-colors bg-ink-800 text-gray-400 border border-white/10" data-pack="sfda" aria-pressed="false" onclick="setPack('sfda')">SFDA</button>
          <button class="pack-pill px-3 py-1 rounded-full text-xs font-medium transition-colors bg-ink-800 text-gray-400 border border-white/10" data-pack="procurement" aria-pressed="false" onclick="setPack('procurement')">المشتريات</button>
          <button class="pack-pill px-3 py-1 rounded-full text-xs font-medium transition-colors bg-ink-800 text-gray-400 border border-white/10" data-pack="healthcare" aria-pressed="false" onclick="setPack('healthcare')">الرعاية الصحية</button>
        </div>
        <!-- Input row -->
        <div class="flex gap-2">
          <input id="message-input" type="text" placeholder="اكتب رسالتك هنا..." aria-label="رسالتك للنواة" class="flex-1 bg-ink-800 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-brand-500/50 focus:ring-1 focus:ring-brand-500/30 transition-colors text-sm">
          <button onclick="sendMessage()" class="px-5 py-3 rounded-xl bg-gradient-to-l from-brand-500 to-purple-500 text-white font-medium text-sm hover:opacity-90 transition-opacity shrink-0" aria-label="إرسال الرسالة">
            <i class="fas fa-paper-plane ml-1" aria-hidden="true"></i>
            إرسال
          </button>
        </div>
      </div>
    </div>

    <!-- Sidebar overlay (mobile) -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-20 hidden lg:hidden" onclick="closeSidebar()"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="absolute lg:relative inset-y-0 right-0 w-72 bg-ink-900/80 backdrop-blur-xl border-l border-white/10 z-20 flex flex-col p-5 gap-5 overflow-y-auto transition-transform duration-300 sidebar-closed lg:sidebar-open">
      <div class="flex items-center justify-between lg:hidden">
        <h2 class="text-sm font-bold">الإعدادات</h2>
        <button onclick="closeSidebar()" class="w-8 h-8 rounded-lg bg-ink-800 border border-white/10 flex items-center justify-center text-gray-400 hover:text-white transition-colors" aria-label="إغلاق إعدادات المحادثة">

        </button>

      <!-- Kernel status -->

        <h3 class="text-xs font-bold text-gray-400 mb-3 uppercase tracking-wider">حالة النواة</h3>
        <div class="flex items-center gap-2">
          <span id="kernel-status-dot" class="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></span>
          <span id="kernel-status-text" class="text-sm text-green-400">متصل</span>
        </div>
      </div>

          <option value="general">عام — General</option>
          <option value="pdpl">PDPL — حماية البيانات</option>
          <option value="nca_ecc">NCA ECC — الأمن السيبراني</option>
          <option value="sfda">SFDA — الغذاء والدواء</option>
          <option value="procurement">المشتريات — Procurement</option>
          <option value="healthcare">الرعاية الصحية — Healthcare</option>
        </select>
      </div>

      <!-- User ID -->
      <div class="bg-ink-900/60 backdrop-blur-xl border border-white/10 rounded-2xl p-4">
        <h3 class="text-xs font-bold text-gray-400 mb-3 uppercase tracking-wider">معرّف المستخدم</h3>
        <input id="user-id-input" aria-label="معرّف المستخدم" type="text" value="demo-user" class="w-full bg-ink-800 border border-white/10 rounded-xl px-3 py-2.5 text-white text-sm focus:outline-none focus:border-brand-500/50" oninput="userId = this.value">
      </div>

      <!-- Session info -->
      <div class="bg-ink-900/60 backdrop-blur-xl border border-white/10 rounded-2xl p-4">
        <h3 class="text-xs font-bold text-gray-400 mb-3 uppercase tracking-wider">معلومات الجلسة</h3>
        <div class="space-y-2 text-xs text-gray-400">
          <div class="flex justify-between"><span>الرسائل</span><span id="msg-count" class="text-white">0</span></div>
          <div class="flex justify-between"><span>المحظورة</span><span id="blocked-count" class="text-red-400">0</span></div>
          <div class="flex justify-between"><span>بانتظار الموافقة</span><span id="pending-count" class="text-yellow-400">0</span></div>
          <div class="flex justify-between"><span>الحزمة الحالية</span><span id="current-pack-label" class="text-brand-400">عام</span></div>
        </div>
    </aside>

  <div id="chat-live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <script>
    // State
    const chatArea = document.getElementById('chat-area');
    const messageInput = document.getElementById('message-input');
    let currentPack = 'general';
    let userId = 'demo-user';
    let msgCount = 0;
    let blockedCount = 0;
    let pendingCount = 0;

    const packLabels = {
      general: 'عام',
      pdpl: 'PDPL',
      nca_ecc: 'NCA ECC',
      sfda: 'SFDA',
      procurement: 'المشتريات',
      healthcare: 'الرعاية الصحية'
    };

    // Sidebar toggle
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebar-overlay');
    const sidebarToggle = document.getElementById('sidebar-toggle');

    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.remove('sidebar-closed');
      sidebar.classList.add('sidebar-open');
      sidebarOverlay.classList.remove('hidden');
    });

    function closeSidebar() {
      sidebar.classList.remove('sidebar-open');
      sidebar.classList.add('sidebar-closed');
      sidebarOverlay.classList.add('hidden');
    }

    function announceToScreenReader(msg) {
      const region = document.getElementById('chat-live-region');
      if (region) {
        region.textContent = '';
        setTimeout(() => { region.textContent = msg; }, 50);
      }
    }

    // Send message
    async function sendMessage() {
      const msg = messageInput.value.trim();
      if (!msg) return;

      addMessage(msg, 'user');
      messageInput.value = '';
      msgCount++;
      updateStats();
      announceToScreenReader("تم إرسال رسالتك، جاري التحليل من قبل النواة...");

      const loadingEl = addMessage('جاري التحليل...', 'loading');

      try {
        const res = await fetch('/api/kernel/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Kernel-User-Id': userId },
          body: JSON.stringify({ message: msg, compliancePack: currentPack })
        });
        const data = await res.json();

        loadingEl.remove();

        if (data.status === 'blocked') {
          blockedCount++;
          updateStats();
          addMessage('\u{1F6AB} ' + data.reason, 'blocked', data);
          announceToScreenReader("تنبيه: تم حظر الرسالة من قبل النواة. السبب: " + data.reason);
        } else if (data.status === 'pending_approval') {
          pendingCount++;
          updateStats();
          addMessage('⏳ بانتظار الموافقة (مخاطر: ' + data.riskScore + ')', 'pending', data);
          announceToScreenReader("تنبيه: الرسالة قيد المراجعة البشرية لوجود مخاطر بدرجة: " + data.riskScore);
        } else {
          addMessage(data.response, 'ai', data);
          announceToScreenReader("استجابة جديدة من النواة: " + data.response);
        }
      } catch(e) {
        loadingEl.remove();
        addMessage('خطأ في الاتصال بالنواة', 'error');
        announceToScreenReader("خطأ: تعذر الاتصال بنواة BrightAI حالياً.");
      }
    }

    function addMessage(text, type, kernelData) {
      const div = document.createElement('div');

      if (type === 'user') {
        div.className = 'max-w-[75%] mr-auto bg-brand-500/20 border border-brand-500/30 rounded-2xl rounded-bl-sm p-4 text-white';
        div.textContent = text;
      } else if (type === 'ai') {
        div.className = 'max-w-[80%] ml-auto bg-ink-800/80 border border-white/10 rounded-2xl rounded-br-sm p-4 text-white';
        div.innerHTML = '<div class="whitespace-pre-wrap">' + escapeHtml(text) + '</div>';
        if (kernelData?.kernel) {
          div.innerHTML += '<details class="mt-3 text-xs text-gray-400 cursor-pointer"><summary class="text-brand-300">تفاصيل النواة</summary><pre class="mt-2 p-2 bg-ink-900 rounded-lg overflow-auto text-left" dir="ltr">' + escapeHtml(JSON.stringify(kernelData.kernel, null, 2)) + '</pre></details>';
        }
      } else if (type === 'blocked') {
        div.className = 'max-w-[80%] ml-auto bg-red-500/20 border border-red-500/30 rounded-2xl p-4 text-red-200';
        div.innerHTML = '<div>' + escapeHtml(text) + '</div>';
        if (kernelData?.kernel) {
          div.innerHTML += '<details class="mt-3 text-xs text-gray-400 cursor-pointer"><summary class="text-red-300">تفاصيل الحظر</summary><pre class="mt-2 p-2 bg-ink-900 rounded-lg overflow-auto text-left" dir="ltr">' + escapeHtml(JSON.stringify(kernelData.kernel, null, 2)) + '</pre></details>';
        }
      } else if (type === 'pending') {
        div.className = 'max-w-[80%] ml-auto bg-yellow-500/20 border border-yellow-500/30 rounded-2xl p-4 text-yellow-200';
        div.innerHTML = '<div>' + escapeHtml(text) + '</div><div class="text-xs mt-2">رقم التفاعل: ' + (kernelData?.interactionId || '') + '</div>';
      } else if (type === 'loading') {
        div.className = 'max-w-[80%] ml-auto bg-ink-800/80 border border-white/10 rounded-2xl p-4 text-gray-400';
        div.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + escapeHtml(text);
      } else {
        div.className = 'max-w-[80%] ml-auto bg-ink-800/80 border border-white/10 rounded-2xl p-4 text-red-300';
        div.textContent = text;
      }

      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
      return div;
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function setPack(pack) {
      currentPack = pack;
      document.querySelectorAll('.pack-pill').forEach(p => {
        const isActive = p.dataset.pack === pack;
        p.classList.toggle('bg-brand-500', isActive);
        p.classList.toggle('text-white', isActive);
        p.classList.toggle('bg-ink-800', !isActive);
        p.classList.toggle('text-gray-400', !isActive);
        p.classList.toggle('border', !isActive);
        p.classList.toggle('border-white/10', !isActive);
        p.setAttribute('aria-pressed', isActive ? 'true' : 'false');
      });
      document.getElementById('sidebar-pack-select').value = pack;
      document.getElementById('current-pack-label').textContent = packLabels[pack] || pack;
      announceToScreenReader("تم تغيير حزمة الامتثال النشطة إلى " + (packLabels[pack] || pack));
    }

    function updateStats() {
      document.getElementById('msg-count').textContent = msgCount;
      document.getElementById('blocked-count').textContent = blockedCount;
      document.getElementById('pending-count').textContent = pendingCount;
    }

    // Send on Enter
    messageInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
  </script>
