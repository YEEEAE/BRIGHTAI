        <!-- Compliance Pack -->

        <!-- Approval Status -->
        <div class="min-w-[150px]">

            class="w-full bg-ink-800 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-brand-500/50 transition-colors">
            <option value="">الكل</option>
            <option value="auto_approved">مقبول تلقائي</option>
            <option value="approved">مقبول</option>
            <option value="pending">معلق</option>
            <option value="blocked">محظور</option>
            <option value="rejected">مرفوض</option>

        </div>
        <!-- Search Button -->
        <div>
          <button onclick="applyFilters()"
            class="bg-brand-500 hover:bg-brand-600 text-ink-900 font-bold rounded-xl px-6 py-2.5 text-sm transition-colors flex items-center gap-2">
            <i class="fa-solid fa-magnifying-glass text-xs"></i>

  <!-- Detail Modal -->
  <div id="detail-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4">

          class="text-white/40 hover:text-white transition-colors">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>
      <!-- Modal Body -->
      <div id="detail-content" class="p-5 overflow-auto flex-1">
      </div>

      <div class="p-5 border-t border-white/10 flex items-center justify-between">

        </button>
        <button id="evidence-btn"
          class="bg-brand-500 hover:bg-brand-600 text-ink-900 font-bold rounded-xl px-5 py-2.5 text-sm transition-colors flex items-center gap-2">

  <!-- Footer -->

    &copy; 2026 BrightAI Kernel
  </footer>

  <script>
    let filters = { limit: 20, offset: 0 };
    let currentEntries = [];

    async function loadAudit() {
      const params = new URLSearchParams();
      if (filters.search) params.set('search', filters.search);
      if (filters.riskLevel) params.set('riskLevel', filters.riskLevel);
      if (filters.compliancePack) params.set('compliancePack', filters.compliancePack);
      if (filters.approvalStatus) params.set('approvalStatus', filters.approvalStatus);
      params.set('limit', filters.limit);
      params.set('offset', filters.offset);

      try {
        const res = await fetch('/api/kernel/audit?' + params.toString());
        const data = await res.json();
        currentEntries = data.entries || [];
        renderTable();
        renderPagination(data.total || 0);
      } catch(e) {
        document.getElementById('audit-table-body').innerHTML = `<tr><td colspan="7" class="text-center text-red-400 py-8">خطأ في تحميل البيانات</td></tr>`;
      }
    }

    function renderTable() {
      const tbody = document.getElementById('audit-table-body');
      if (currentEntries.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-gray-500 py-8">لا توجد سجلات</td></tr>`;
        return;
      }
      tbody.innerHTML = currentEntries.map((e, i) => `
        <tr class="border-b border-white/5 hover:bg-white/5 cursor-pointer" onclick="showDetail('${e.id}')">
          <td class="p-3 text-gray-400">${filters.offset + i + 1}</td>
          <td class="p-3 text-gray-300 text-sm">${new Date(e.created_at).toLocaleString('ar-SA')}</td>
          <td class="p-3"><span class="px-2 py-1 rounded-full text-xs font-bold ${riskBadgeClass(e.risk_level)}">${e.risk_score} - ${e.risk_level}</span></td>
          <td class="p-3"><span class="px-2 py-1 rounded-full text-xs ${statusBadgeClass(e.approval_status)}">${statusLabel(e.approval_status)}</span></td>
          <td class="p-3 text-brand-300 text-sm">${e.compliance_pack}</td>
          <td class="p-3 text-gray-400 text-sm max-w-[200px] truncate">${(e.masked_message || e.request_message || '').substring(0, 60)}...</td>
          <td class="p-3"><button class="text-brand-300 hover:text-brand-100 text-sm" onclick="event.stopPropagation(); showDetail('${e.id}')"><i class="fas fa-eye"></i></button></td>
        </tr>
      `).join('');
    }

    function riskBadgeClass(level) {
      const m = { low:'bg-green-500/20 text-green-300', medium:'bg-yellow-500/20 text-yellow-300', high:'bg-orange-500/20 text-orange-300', critical:'bg-red-500/20 text-red-300' };
      return m[level] || 'bg-gray-500/20 text-gray-300';
    }

    function statusBadgeClass(status) {
      const m = { auto_approved:'bg-green-500/20 text-green-300', approved:'bg-blue-500/20 text-blue-300', pending:'bg-yellow-500/20 text-yellow-300', blocked:'bg-red-500/20 text-red-300', rejected:'bg-gray-500/20 text-gray-300' };
      return m[status] || 'bg-gray-500/20 text-gray-300';
    }

    function statusLabel(s) {
      const m = { auto_approved:'مقبول تلقائي', approved:'مقبول', pending:'معلق', blocked:'محظور', rejected:'مرفوض' };
      return m[s] || s;
    }

    async function showDetail(id) {
      try {
        const res = await fetch('/api/kernel/audit/' + id);
        const entry = await res.json();
        document.getElementById('detail-modal').classList.remove('hidden');
        document.getElementById('detail-content').innerHTML = `<pre class="text-xs text-gray-300 overflow-auto max-h-[60vh] whitespace-pre-wrap">${JSON.stringify(entry, null, 2)}</pre>`;
        document.getElementById('detail-id').textContent = id;
        document.getElementById('evidence-btn').onclick = () => generateEvidence(id);
      } catch(e) { alert('خطأ في تحميل التفاصيل'); }
    }

    async function generateEvidence(id) {
      try {
        const res = await fetch('/api/kernel/evidence/' + id, { method: 'POST' });
        const evidence = await res.json();
        document.getElementById('detail-content').innerHTML = `<pre class="text-xs text-brand-300 overflow-auto max-h-[60vh] whitespace-pre-wrap">${JSON.stringify(evidence, null, 2)}</pre>`;
      } catch(e) { alert('خطأ في إنشاء ملف الدليل'); }
    }

    function applyFilters() {
      filters.search = document.getElementById('filter-search').value;
      filters.riskLevel = document.getElementById('filter-risk').value;
      filters.compliancePack = document.getElementById('filter-pack').value;
      filters.approvalStatus = document.getElementById('filter-status').value;
      filters.offset = 0;
      loadAudit();
    }

    function renderPagination(total) {
      const el = document.getElementById('pagination');
      const from = filters.offset + 1;
      const to = Math.min(filters.offset + filters.limit, total);
      el.innerHTML = `<span class="text-gray-400 text-sm">${from}-${to} من ${total}</span>
        <div class="flex gap-2">
          <button onclick="filters.offset=Math.max(0,filters.offset-filters.limit);loadAudit()" class="px-4 py-2 bg-ink-800 rounded-lg text-brand-300 hover:bg-ink-700 transition-colors" ${filters.offset===0?'disabled':''}>السابق</button>
          <button onclick="filters.offset+=filters.limit;loadAudit()" class="px-4 py-2 bg-ink-800 rounded-lg text-brand-300 hover:bg-ink-700 transition-colors" ${to>=total?'disabled':''}>التالي</button>
        </div>`;
    }

    loadAudit();
  </script>
