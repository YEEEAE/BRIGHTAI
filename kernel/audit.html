<body>
  
  <div id="brightai-unified-header"></div>
  <a href="#audit-main" class="skip-link">تخطي إلى سجل التدقيق</a>
  <script>
    (function () {
      var script = document.createElement('script');
      script.src = window.location.protocol === 'file:' ? 'kernel-nav.js' : '/kernel/kernel-nav.js';

  <main id="audit-main" class="page-wrap">

    <div style="margin-bottom:1.5rem;" class="fade-up">
      <h1 class="section-title">سجل التدقيق — سلسلة الأثر الدائمة</h1>
      <p class="section-sub">كل طلب، كل قرار، كل موافقة يُسجل هنا برقم فريد وبصمة مشفرة. لا يمكن تعديل أو حذف السجل، مما يوفر دليل امتثال كامل يقبله المدققون والسلطات الرسمية.</p>
    </div>

    <!-- Filters -->
    <div class="glass" style="padding:1.25rem;margin-bottom:1.25rem;" role="search" aria-label="فلاتر البحث">
      <div class="filters-bar">
        <div class="filter-item wide">
          <label class="form-label" for="f-search">بحث في السجلات</label>
          <input id="f-search" class="form-input" type="search" placeholder="بحث...">
        </div>
        <div class="filter-item">
          <label class="form-label" for="f-risk">مستوى المخاطر</label>
          <select id="f-risk" class="form-select">
            <option value="">الكل</option>
            <option value="low">منخفض</option>
            <option value="medium">متوسط</option>
            <option value="high">مرتفع</option>
            <option value="critical">حرج</option>
          </select>
        </div>
        <div class="filter-item">
          <label class="form-label" for="f-pack">حزمة الامتثال</label>
          <select id="f-pack" class="form-select">
            <option value="">الكل</option>
            <option value="pdpl">PDPL</option>
            <option value="nca_ecc">NCA ECC</option>
            <option value="sfda">SFDA</option>
            <option value="procurement">procurement</option>
            <option value="healthcare">healthcare</option>
            <option value="general">general</option>
          </select>
        </div>
        <div class="filter-item">
          <label class="form-label" for="f-status">حالة الموافقة</label>
          <select id="f-status" class="form-select">
            <option value="">الكل</option>
            <option value="auto_approved">مقبول تلقائي</option>
            <option value="approved">مقبول</option>
            <option value="pending">معلق</option>
            <option value="blocked">محظور</option>
            <option value="rejected">مرفوض</option>
          </select>
        </div>
        <div class="filter-item">
          <label class="form-label" for="f-from">من تاريخ</label>
          <input id="f-from" class="form-input" type="date">
        </div>
        <div class="filter-item">
          <label class="form-label" for="f-to">إلى تاريخ</label>
          <input id="f-to" class="form-input" type="date">
        </div>
        <div class="filter-actions">
          <button class="btn btn-primary" onclick="applyFilters()">
            <i class="fas fa-magnifying-glass" aria-hidden="true"></i> بحث
          </button>
          <button class="btn btn-ghost" onclick="resetFilters()">مسح</button>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="glass fade-up d2" style="overflow:hidden;">

  <!-- Detail Modal -->
  <div id="detail-modal" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="modal-ttl">
    <div class="modal-backdrop" onclick="closeModal()">
      <div class="modal-box" onclick="event.stopPropagation()">
        <div class="modal-header">
          <div style="display:flex;align-items:center;gap:0.75rem;">
            <i class="fas fa-shield-halved" style="color:var(--brand);" aria-hidden="true"></i>
            <h2 id="modal-ttl" style="font-size:1rem;font-weight:700;">تفاصيل السجل</h2>
            <span id="modal-id" style="font-size:0.7rem;color:var(--text-dim);font-family:monospace;"></span>
          </div>
          <button onclick="closeModal()" class="btn btn-ghost btn-sm" aria-label="إغلاق">
            <i class="fas fa-xmark" aria-hidden="true"></i>
          </button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer">
          <button onclick="closeModal()" class="btn btn-ghost">إغلاق</button>
          <button id="evidence-btn" class="btn btn-primary">
            <i class="fas fa-file-shield" aria-hidden="true"></i> إنشاء ملف دليل
          </button>
        </div>
      </div>
    </div>
  </div>

  <footer class="kernel-footer">&copy; 2026 BrightAI Kernel</footer>

  <script>
    let filters = { limit: 20, offset: 0 };

    async function loadAudit() {
      const p = new URLSearchParams();
      if (filters.search) p.set('search', filters.search);
      if (filters.riskLevel) p.set('riskLevel', filters.riskLevel);
      if (filters.compliancePack) p.set('compliancePack', filters.compliancePack);
      if (filters.approvalStatus) p.set('approvalStatus', filters.approvalStatus);
      if (filters.dateFrom) p.set('dateFrom', filters.dateFrom);
      if (filters.dateTo) p.set('dateTo', filters.dateTo);
      p.set('limit', filters.limit);
      p.set('offset', filters.offset);

      const tbody = document.getElementById('audit-tbody');
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:2rem;"><span class="spinner"></span></td></tr>';

      try {
        const res = await fetch('/api/kernel/audit?' + p);
        const data = await res.json();
        renderTable(data.entries || [], data.total || 0);
      } catch(e) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#f87171;padding:2rem;">خطأ في تحميل البيانات</td></tr>';
      }
    }

    function renderTable(entries, total) {
      const tbody = document.getElementById('audit-tbody');
      if (!entries.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:3rem;">لا توجد سجلات</td></tr>';
        renderPagination(0);
        return;
      }
      tbody.innerHTML = entries.map((e, i) => `
        <tr class="cursor-row" onclick="showDetail('${e.id}')" tabindex="0" onkeydown="if(event.key==='Enter')showDetail('${e.id}')">
          <td style="color:var(--text-muted)">${filters.offset + i + 1}</td>
          <td style="font-size:0.8rem;white-space:nowrap">${new Date(e.created_at).toLocaleString('ar-SA')}</td>
          <td><span class="badge badge-${e.risk_level}">${e.risk_score ?? 0} — ${riskLabel(e.risk_level)}</span></td>
          <td><span class="badge badge-${e.approval_status}">${statusLabel(e.approval_status)}</span></td>
          <td style="color:var(--brand);font-size:0.8rem;">${e.compliance_pack || '—'}</td>
          <td class="truncate-cell" style="color:var(--text-muted);font-size:0.8rem;">${(e.masked_message || e.request_message || '').substring(0, 60)}…</td>
          <td>
            <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();showDetail('${e.id}')" aria-label="عرض تفاصيل السجل">
              <i class="fas fa-eye" aria-hidden="true"></i>
            </button>
          </td>
        </tr>
      `).join('');
      renderPagination(total);
    }

    function renderPagination(total) {
      const el = document.getElementById('pagination');
      const from = filters.offset + 1;
      const to   = Math.min(filters.offset + filters.limit, total);
      el.innerHTML = `
        <span class="info">${from}–${to} من ${total}</span>
        <div class="pag-btns">
          <button class="btn btn-ghost btn-sm" onclick="filters.offset=Math.max(0,filters.offset-filters.limit);loadAudit()" ${filters.offset===0?'disabled':''}>
            <i class="fas fa-chevron-right" aria-hidden="true"></i> السابق
          </button>
          <button class="btn btn-ghost btn-sm" onclick="filters.offset+=filters.limit;loadAudit()" ${to>=total?'disabled':''}>
            التالي <i class="fas fa-chevron-left" aria-hidden="true"></i>
          </button>
        </div>`;
    }

    async function showDetail(id) {
      document.getElementById('detail-modal').style.display = 'flex';
      document.getElementById('modal-id').textContent = id;
      document.getElementById('modal-body').innerHTML = '<div style="text-align:center;padding:2rem;"><span class="spinner"></span></div>';
      document.getElementById('evidence-btn').onclick = () => generateEvidence(id);

      try {
        const res = await fetch('/api/kernel/audit/' + id);
        const e   = await res.json();
        document.getElementById('modal-body').innerHTML = renderDetail(e);
      } catch(_) {
        document.getElementById('modal-body').innerHTML = '<p style="color:#f87171">خطأ في تحميل التفاصيل</p>';
      }
    }

    function renderDetail(e) {
      const fields = [
        ['معرّف التفاعل', `<code style="color:var(--brand);font-size:0.75rem;">${esc(e.id || '—')}</code>`],
        ['التاريخ والوقت', e.created_at ? new Date(e.created_at).toLocaleString('ar-SA') : '—'],
        ['معرّف المستخدم', `<code>${esc(e.user_id || '—')}</code>`],
        ['الدور الوظيفي', e.user_role || '—'],
      ];
      
      let html = `
        <div style="margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border);">
          <h3 style="font-size: 0.9rem; font-weight: 700; margin-bottom: 1rem; color: var(--text);">معلومات الطلب</h3>
          <div class="detail-grid">
            ${fields.map(([l,v]) => `<div class="detail-field"><div class="lbl">${l}</div><div class="val">${v}</div></div>`).join('')}
          </div>
        </div>

        <div style="margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border);">
          <h3 style="font-size: 0.9rem; font-weight: 700; margin-bottom: 1rem; color: var(--text);">تحليل الأمان والمخاطر</h3>
          <div class="detail-grid">
            <div class="detail-field"><div class="lbl">حالة التقييم</div><div class="val"><span class="badge badge-${e.approval_status}">${statusLabel(e.approval_status)}</span></div></div>
            <div class="detail-field"><div class="lbl">درجة المخاطر</div><div class="val"><span class="badge badge-${e.risk_level}">${e.risk_score ?? 0}/100 — ${riskLabel(e.risk_level)}</span></div></div>
            <div class="detail-field"><div class="lbl">حزمة الامتثال</div><div class="val">${e.compliance_pack || '—'}</div></div>
            <div class="detail-field"><div class="lbl">النموذج المستخدم</div><div class="val">${e.model_used || '—'}</div></div>
          </div>
        </div>

        ${e.pii_detected?.length ? `
        <div style="margin-bottom: 1.5rem; padding: 1rem; background: rgba(251,146,60,0.1); border: 1px solid rgba(251,146,60,0.2); border-radius: 0.75rem; border-right: 3px solid #fb923c;">
          <h3 style="font-size: 0.9rem; font-weight: 700; margin-bottom: 0.5rem; color: #fb923c;">⚠ بيانات شخصية مكتشفة</h3>
          <ul style="padding-right: 1.25rem; font-size: 0.8rem; color: var(--text-muted); line-height: 1.8; margin: 0;">
            ${e.pii_detected.map(p => `<li>${esc(p)}</li>`).join('')}
          </ul>
        </div>
        ` : ''}

        ${e.risk_reasons?.length ? `
        <div style="margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border);">
          <h3 style="font-size: 0.9rem; font-weight: 700; margin-bottom: 0.75rem; color: var(--text);">أسباب تقييم المخاطر</h3>
          <ul style="padding-right: 1.25rem; font-size: 0.8rem; color: var(--text-muted); line-height: 1.8;">
            ${e.risk_reasons.map(r => `<li>${esc(r)}</li>`).join('')}
          </ul>
        </div>
        ` : ''}

        ${e.request_message ? `<div style="margin-bottom: 1rem;"><div class="form-label">الطلب الأصلي</div><div class="detail-pre">${esc(e.request_message)}</div></div>` : ''}
        ${e.masked_message ? `<div style="margin-bottom: 1rem;"><div class="form-label">الطلب بعد إخفاء البيانات</div><div class="detail-pre">${esc(e.masked_message)}</div></div>` : ''}

        <div style="margin-bottom: 1rem; padding: 1rem; background: var(--ink-800); border: 1px solid var(--border); border-radius: 0.75rem;">
          <div class="form-label" style="margin-bottom: 0.5rem;">بصمة التدقيق (SHA-256)</div>
          <code style="direction: ltr; font-size: 0.7rem; word-break: break-all; display: block; color: var(--brand);">${esc(e.chain_hash || '—')}</code>
        </div>

        <details style="cursor: pointer;">
          <summary style="font-size: 0.8rem; color: var(--brand); font-weight: 600; padding: 0.5rem 0; cursor: pointer;">عرض البيانات التقنية الكاملة</summary>
          <pre class="detail-pre" style="margin-top: 0.75rem;">${esc(JSON.stringify(e, null, 2))}</pre>
        </details>
      `;
      return html;
    }

    async function generateEvidence(id) {
      document.getElementById('evidence-btn').textContent = 'جاري الإنشاء...';
      try {
        const res = await fetch('/api/kernel/evidence/' + id, { method: 'POST' });
        const ev = await res.json();
        document.getElementById('modal-body').innerHTML = '<div class="form-label" style="color:var(--brand);margin-bottom:0.5rem;">ملف الدليل</div><pre class="detail-pre">' + esc(JSON.stringify(ev,null,2)) + '</pre>';
      } catch(_) { alert('خطأ في إنشاء ملف الدليل'); }
      document.getElementById('evidence-btn').innerHTML = '<i class="fas fa-file-shield"></i> إنشاء ملف دليل';
    }

    function closeModal() { document.getElementById('detail-modal').style.display = 'none'; }

    function applyFilters() {
      filters.search        = document.getElementById('f-search').value;
      filters.riskLevel     = document.getElementById('f-risk').value;
      filters.compliancePack= document.getElementById('f-pack').value;
      filters.approvalStatus= document.getElementById('f-status').value;
      filters.dateFrom      = document.getElementById('f-from').value;
      filters.dateTo        = document.getElementById('f-to').value;
      filters.offset        = 0;
      loadAudit();
    }

    function resetFilters() {
      ['f-search','f-risk','f-pack','f-status','f-from','f-to'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
      filters = { limit: 20, offset: 0 };
      loadAudit();
    }

    function riskLabel(l)   { return { low:'منخفض', medium:'متوسط', high:'مرتفع', critical:'حرج' }[l] || l; }
    function statusLabel(s) { return { auto_approved:'مقبول تلقائي', approved:'مقبول', pending:'معلق', blocked:'محظور', rejected:'مرفوض' }[s] || s; }
    function esc(s) { if (typeof s !== 'string') s = String(s); const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    loadAudit();
  </script>
