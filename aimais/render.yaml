services:
  - type: web
    name: aimais-dashboard
    runtime: node
    rootDir: aimais
    buildCommand: pip install -r requirements.txt && echo "Python ready"
    startCommand: npm start
    nodeVersion: "22.11.0"
    healthCheckPath: /health
    envVars:
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
