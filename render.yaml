    routes:
      # تمرير واجهات الـ API من نفس الدومين إلى خدمة الـ backend لتفادي CORS والاعتماد على دومين خارجي خاطئ.
      - type: rewrite
        source: /api/*
        destination: https://brightai-api.onrender.com/api/*
      - type: rewrite
        source: /ws/*
        destination: https://brightai-api.onrender.com/ws/*

      # فرض الدومين الأساسي حتى لا تظهر إشارات canonical أو Coverage على نسخ متعددة.
      - type: redirect
        source: http://brightai.site/:splat
        destination: https://brightai.site/:splat
        status: 301
      - type: redirect
        source: https://www.brightai.site/:splat
        destination: https://brightai.site/:splat
        status: 301
      # ملاحظة تشغيلية: بعد أي Sync/Deploy يغيّر قواعد routes في Render،
      # امسح Cloudflare Cache حتى لا تستمر استجابات 404 أو 301 القديمة على الدومين.
      # منع Render من تقديم صفحة 404 كملف حقيقي بحالة 200 عند طلب /404 مباشرة.
      - type: redirect
        source: /404
        destination: /404.html
        status: 301
      - type: redirect
        source: /404/
        destination: /404.html
        status: 301

      # توحيد نسخ index.html مع المسار المعياري لمنع تعارضات canonical و hreflang.
      - type: redirect
        source: /index.html
        destination: /
        status: 301
      - type: redirect
        source: /:slug/index.html
        destination: /:slug/
        status: 301
      - type: redirect
        source: /:section/:slug/index.html
        destination: /:section/:slug/
        status: 301
      - type: redirect
        source: /:section/:subsection/:slug/index.html
