# BrightAI Render Blueprint — Astro site (static + Node server functions)
# KERNEL-AI-2026-07-14: switched from `runtime: static` to `runtime: node`
# to enable the /api/ai/chat and /api/lead serverless functions on Render.
# Astro builds produce:
#   - dist/client/   (190 prerendered HTML pages + assets)
#   - dist/server/   (Node standalone server with API routes)
# The Node server serves both static files and API routes from one process.

services:
  - type: web
    runtime: node
    name: brightai-site
    buildCommand: pip3 install fonttools brotli && pnpm install && pnpm run build
    preDeployCommand: pnpm run verify:deployment-surface
    startCommand: node ./dist/server/entry.mjs
    # KERNEL-AUDIT-2026-07-15-BATCH-10 / EXEC-17: hit a real SSR endpoint
    # (not just / static HTML) so Render detects actual Node outages.
    healthCheckPath: /api/health/
    # ──────────────────────────────────────────────────────────────────
    # BAI-IDX-02 (2026-07-25) — DOCUMENTATION ONLY.
    # The `headers:` block below is NOT applied to runtime responses on
    # Render Web Services (Node runtime). Render's `headers:` directive
    # only works for Render Static Sites. On the current Node service,
    # the actual production security header posture is enforced by:
    #
    #   1. src/middleware.ts — applies RESPONSE_SECURITY_HEADERS as
    #      HTTP response headers on every SSR route (/api/*).
    #   2. injectSecurityMeta() Astro integration in astro.config.mjs —
    #      injects <meta http-equiv="..."> in every prerendered HTML
    #      file in dist/client/.
    #   3. Cloudflare edge Transform Rule — applies HSTS on static
    #      pages (HSTS does NOT work in meta). See
    #      docs/cloudflare-deployment-headers.md for the manual setup.
    #
    # The block below is kept in sync with the canonical posture in
    # scripts/security-headers.mjs for documentation + drift detection.
    # If you change a value here, also update scripts/security-headers.mjs
    # and the post-deploy check (npm run verify:live:headers) will fail
    # until they re-sync. Do NOT remove this block — it is the single
    # line of defence for any future migration to a static-only host.
    # ──────────────────────────────────────────────────────────────────
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      # CHAT-SESSION-2026-07-15: Redis-backed conversation context store for
      # /api/ai/chat/. Stores the last 8 messages per sessionId in a Redis
      # LIST with 10-minute TTL. Required for multi-turn context (kernel
      # AI assistant). Set in Render dashboard as a sync from a Redis Cloud
      # / Upstash / Render Key Value instance reachable from the Node
      # service. If unset, the endpoint gracefully degrades to single-turn
      # mode (no context) — see src/lib/redis.ts for the fallback contract.
      - key: REDIS_URL
        sync: false
      # GROQ_API_KEY and GEMINI_API_KEY are set in Render dashboard env
      # (NOT in this file — they are server secrets).
      # LEAD_WEBHOOK_URL + LEAD_WEBHOOK_SECRET (KRN-004 / EXEC-04) also
      # set in Render dashboard env. Without LEAD_WEBHOOK_URL configured,
      # leads are queued in-memory only (cap 100). Recommended webhook
      # providers: Resend / SendGrid / HubSpot / Zapier / n8n.
      # BRIGHTAI_CHAT_KEY (KRN-003-FULL-2026-07-15 / EXEC-03) — optional
      # shared-secret API key for /api/ai/chat/. The endpoint accepts
      # requests from the BrightAI origin (browser) OR from any client
      # sending a valid `x-brightai-chat-key: <key>` header. Set in Render
      # dashboard to enable the API-key auth path for non-browser clients
      # (curl/Postman/server-to-server). When unset, only the Origin
      # allowlist is enforced (current production default). Generate with:
      #   openssl rand -hex 32
      # The value is read at function scope (process.env) at request time
      # so it is never inlined into the SSR bundle.
      # TRUSTED_PROXY_COUNT (KRN-013 / EXEC-13) — controls XFF trust depth
      # for client-IP extraction in src/lib/ip.ts. Render fronts the Node
      # service with exactly one reverse proxy, so the default value (1)
      # is correct for production. The helper trusts the rightmost N
      # entries of x-forwarded-for (where N = TRUSTED_PROXY_COUNT); the
      # leftmost entry is client-controlled and ignored. Set to 0 if you
      # switch to a proxy that strips XFF and only sets x-real-ip. Default
      # when unset is 1 (Render).
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains; preload"
      - path: /*
        name: X-Frame-Options
        value: "SAMEORIGIN"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: X-Robots-Tag
        value: "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://www.clarity.ms https://*.clarity.ms https://js.hs-scripts.com https://bat.bing.com https://cdn.mxpnl.com https://api.mixpanel.com https://*.mixpanel.com; script-src-elem 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://www.clarity.ms https://*.clarity.ms https://js.hs-scripts.com https://bat.bing.com https://cdn.mxpnl.com https://api.mixpanel.com https://*.mixpanel.com; script-src-attr 'none'; style-src 'self'; style-src-elem 'self' 'unsafe-inline' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://analytics.google.com https://www.google.com https://stats.g.doubleclick.net https://www.clarity.ms https://*.clarity.ms https://js.hs-scripts.com https://bat.bing.com https://cdn.mxpnl.com https://api.mixpanel.com https://*.mixpanel.com https://api.groq.com https://generativelanguage.googleapis.com; frame-src 'self' https://www.google.com; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' data: blob: https:; upgrade-insecure-requests; report-uri /api/csp-report"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://www.clarity.ms https://*.clarity.ms https://js.hs-scripts.com https://bat.bing.com https://cdn.mxpnl.com https://api.mixpanel.com https://*.mixpanel.com; script-src-elem 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://www.clarity.ms https://*.clarity.ms https://js.hs-scripts.com https://bat.bing.com https://cdn.mxpnl.com https://api.mixpanel.com https://*.mixpanel.com; script-src-attr 'none'; style-src 'self'; style-src-elem 'self' 'unsafe-inline' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://analytics.google.com https://www.google.com https://stats.g.doubleclick.net https://www.clarity.ms https://*.clarity.ms https://js.hs-scripts.com https://bat.bing.com https://cdn.mxpnl.com https://api.mixpanel.com https://*.mixpanel.com; frame-src 'self' https://www.google.com; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' data: blob: https:; upgrade-insecure-requests; report-uri /api/csp-report"
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /sw.js
        name: Cache-Control
        value: no-store, no-cache, must-revalidate, max-age=0
      - path: /service-worker.js
        name: Cache-Control
        value: no-store, no-cache, must-revalidate, max-age=0
      - path: /*.css
        name: Cache-Control
        value: public, max-age=86400
      - path: /**/*.css
        name: Cache-Control
        value: public, max-age=86400
      - path: /*.js
        name: Cache-Control
        value: public, max-age=86400
      - path: /**/*.js
        name: Cache-Control
        value: public, max-age=86400
      - path: /*.v*.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /**/*.v*.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.v*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /**/*.v*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.woff
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /**/*.woff
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.woff2
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /**/*.woff2
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.ttf
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /**/*.ttf
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.otf
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /**/*.otf
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.png
        name: Cache-Control
        value: public, max-age=7776000, stale-while-revalidate=2592000
      - path: /**/*.png
        name: Cache-Control
        value: public, max-age=7776000, stale-while-revalidate=2592000
      - path: /*.jpg
        name: Cache-Control
        value: public, max-age=7776000, stale-while-revalidate=2592000
      - path: /**/*.jpg
        name: Cache-Control
        value: public, max-age=7776000, stale-while-revalidate=2592000
      - path: /*.jpeg
        name: Cache-Control
        value: public, max-age=7776000, stale-while-revalidate=2592000
      - path: /**/*.jpeg
        name: Cache-Control
        value: public, max-age=7776000, stale-while-revalidate=2592000
      - path: /*.webp
        name: Cache-Control
        value: public, max-age=7776000, stale-while-revalidate=2592000
      - path: /**/*.webp
        name: Cache-Control
        value: public, max-age=7776000, stale-while-revalidate=2592000
      - path: /*.avif
        name: Cache-Control
        value: public, max-age=7776000, stale-while-revalidate=2592000
      - path: /**/*.avif
        name: Cache-Control
        value: public, max-age=7776000, stale-while-revalidate=2592000
      - path: /*.svg
        name: Cache-Control
        value: public, max-age=7776000, stale-while-revalidate=2592000
      - path: /**/*.svg
        name: Cache-Control
        value: public, max-age=7776000, stale-while-revalidate=2592000
      - path: /*.ico
        name: Cache-Control
        value: public, max-age=7776000, stale-while-revalidate=2592000
      - path: /**/*.ico
        name: Cache-Control
        value: public, max-age=7776000, stale-while-revalidate=2592000
      - path: /llms.txt
        name: Content-Type
        value: text/plain; charset=utf-8
      - path: /llms-full.txt
        name: Content-Type
        value: text/plain; charset=utf-8
      - path: /robots.txt
        name: Content-Type
        value: text/plain; charset=utf-8
      - path: /sitemap*.xml
        name: Content-Type
        value: application/xml; charset=utf-8
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json; charset=utf-8
