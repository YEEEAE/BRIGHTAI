# BrightAI Render Blueprint — existing isolated Node SSR candidate.
# npm start applies redirects.json before static files via scripts/server.mjs;
# src/middleware.ts also resolves aliases that reach Astro.

services:
  - type: web
    runtime: node
    # Reuse the already provisioned candidate service, never create a third one.
    name: brightai-r51-audit
    plan: free
    region: ohio
    autoDeployTrigger: off
    # The committed lockfile is package-lock.json; no pnpm lockfile is present.
    buildCommand: npm ci && npm run build
    # Operator: attach the domain to this Node web service, not dist/client.
    # Forward /app/* and /app/api/* unchanged; bypass every CDN cache for /app/*.
    # Keep the current static origin (srv-d7m5bcjbc2fs73826v20) as the rollback
    # target until P15; this Blueprint never changes DNS or the static service.
    startCommand: npm start
    # Fail closed: the platform probe is readiness, so traffic is not routed
    # until dependencies are ready. /healthz/ stays the separate liveness probe
    # for a dead process; both spellings are answered without a redirect.
    healthCheckPath: /readyz/
    envVars:
      - key: NODE_VERSION
        value: 22.23.5
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      # Enable only after the owner authorizes exposing the portal on this Node service.
      - key: AIGAS_APP_ENABLED
        value: "false"
      # Readiness probes the auth JWKS host (2s timeout, 15s cache). It is the
      # only readiness check that leaves the service; disable it only if the
      # deployment cannot reach the auth host at all.
      - key: AIGAS_HEALTH_AUTH_PROBE
        value: "true"
      # Runtime secret names required for a working service. Values are set in
      # the Render dashboard only, never in this file:
      #   DATABASE_URL, NEON_AUTH_BASE_URL, NEON_AUTH_JWKS_URL.
      # This candidate uses only an isolated synthetic Neon branch and a
      # least-privilege runtime role; never point it at production data.
      - key: AIGAS_REQUIRE_RLS
        value: "true"
      - key: AIGAS_DB_RUNTIME_ROLE
        value: aigas_runtime
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      # Traceability: RENDER_SERVICE_ID / RENDER_SERVICE_NAME / RENDER_GIT_COMMIT
      # are injected by Render; AIGAS_DEPLOY_ID and AIGAS_IMAGE_DIGEST are
      # optional operator/CI values that /readyz/ reports when present.
      - key: DATABASE_URL
        sync: false
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: NEON_AUTH_JWKS_URL
        sync: false
      # Preserved for existing dashboard compatibility; the current site has no chat API.
      - key: REDIS_URL
        sync: false
    # Operator runbook: docs/APP-PORTAL-RUNTIME-HANDOFF.md
    # Data/secret handling and rotation: docs/DATA-PRIVACY-AND-SECURITY.md
    # Branch protection, backup/restore and rollback: docs/NEON-BRANCH-PROTECTION-RUNBOOK.md
    # DATABASE_URL must be a least-privilege runtime role before the portal is enabled;
    # never paste a secret value into this file or any tracked file.
    # Static-site header rules do not belong to this Node web service.
    # src/middleware.ts sets baseline headers (framing, referrer, permissions,
    # HSTS on HTTPS) and private /app/* no-store/noindex headers.
    # Keep TLS termination at the operator-managed edge; do not downgrade to HTTP.
