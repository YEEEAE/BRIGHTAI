# BrightAI Render Blueprint — Astro static site only
# Generated after removing the frontend/ Express backend service and all
# related routes. The site is now pure static (output: 'static').

services:
  - type: web
    runtime: static
    name: brightai-site
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://js.sentry-cdn.com https://www.clarity.ms https://*.clarity.ms https://cdnjs.cloudflare.com; script-src-elem 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://js.sentry-cdn.com https://www.clarity.ms https://*.clarity.ms https://cdnjs.cloudflare.com; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://region1.google-analytics.com https://stats.g.doubleclick.net https://o4510966719840256.ingest.us.sentry.io https://*.sentry.io https://www.clarity.ms https://*.clarity.ms https://c.bing.com; frame-src 'self' https://www.googletagmanager.com; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' data: blob: https:; upgrade-insecure-requests"
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /sw.js
        name: Cache-Control
        value: no-store, no-cache, must-revalidate, max-age=0
      - path: /service-worker.js
        name: Cache-Control
        value: no-store, no-cache, must-revalidate, max-age=0
      - path: /*.css
        name: Cache-Control
        value: public, max-age=86400
      - path: /**/*.css
        name: Cache-Control
        value: public, max-age=86400
      - path: /*.js
        name: Cache-Control
        value: public, max-age=86400
      - path: /**/*.js
        name: Cache-Control
        value: public, max-age=86400
      - path: /*.v*.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /**/*.v*.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.v*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /**/*.v*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.woff
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /**/*.woff
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.woff2
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /**/*.woff2
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.ttf
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /**/*.ttf
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.otf
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /**/*.otf
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.png
        name: Cache-Control
        value: public, max-age=7776000, stale-while-revalidate=2592000
      - path: /**/*.png
        name: Cache-Control
        value: public, max-age=7776000, stale-while-revalidate=2592000
      - path: /*.jpg
        name: Cache-Control
        value: public, max-age=7776000, stale-while-revalidate=2592000
      - path: /**/*.jpg
        name: Cache-Control
        value: public, max-age=7776000, stale-while-revalidate=2592000
      - path: /*.jpeg
