services:
  - type: web
    runtime: node
    name: brightai-api
    rootDir: backend
    buildCommand: npm ci --include=dev --no-audit --no-fund
    startCommand: npm start
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: NVIDIA_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GA4_MEASUREMENT_ID
        sync: false
      - key: GA4_API_SECRET
        sync: false
      - key: ANALYTICS_WEBHOOK_KEY
        sync: false

  - type: web
    runtime: static
    name: brightai-site
    buildCommand: |
      npm ci --include=dev --no-audit --no-fund
      npm run assets:minify
      npm run assets:replace-refs
      npm run production:fixes
      npm run sitemap:all
      rm -f frontend/js/index-theme.js frontend/js/services-page.js frontend/js/vendor/gsap.min.js
      bash scripts/seo-hreflang-dirs.sh
      rm -rf .render-static
      mkdir -p .render-static
      rsync -a --delete --exclude='.git' --exclude='node_modules' --exclude='.render-static' --exclude='.agents' --exclude='plugins' --exclude='reports' --exclude='tmp' --exclude='backend' --exclude='app' --exclude='components' --exclude='lib' --exclude='scripts' --exclude='ai-reject-dashboard' --exclude='next.config.*' --exclude='next-env.d.ts' --exclude='tsconfig*.json' --exclude='package*.json' --exclude='render.yaml' --exclude='*.md' ./ .render-static/
      node <<'NODE'
      const fs = require("fs");
      const path = require("path");

      const root = path.join(process.cwd(), ".render-static");
      const blog = path.join(root, "blog");

      const legacyArabicBlog = new Map([
        ["أتمتة-الذكاء-الاصطناعي-حلول-مخصصة-لتحليل-المشاريع-وتحسين-محركات-البحث-1", "ai-automation-project-analysis"],
        ["أتمتة-العمليات-باستخدام-الذكاء-الاصطناعي-الطريق-إلى-تحسين-الكفاءة-التشغيلية", "process-automation-ai-efficiency"],
        ["الأتمتة-الصناعية-وأتمتة-المهام-المتكررة-كيفية-تحسين-الكفاءة-الإنتاجية", "industrial-automation-productivity"],
        ["الأتمتة-المالية-وأتمتة-الموارد-البشرية-حلول-مستقبلية-للشركات-الذكية", "financial-hr-automation"],
        ["التحول-الرقمي-وأتمتة-العمليات-كيف-يمكن-للذكاء-الاصطناعي-أن-يقود-الابتكار", "digital-transformation-automation"],
        ["التعلم-الآلي-والرؤية-الحاسوبية-مستقبل-الذكاء-الاصطناعي-في-معالجة-اللغة-الطبيعية-والتعرف-على-الصور", "machine-learning-computer-vision"],
        ["الذكاء-الاصطناعي-و-التسويق", "ai-marketing-guide"],
        ["تحليل-البيانات", "data-analysis-decision-making"],
        ["تعلم-الآلة-و-الأعمال", "machine-learning-business"],
        ["مقال-تحليل", "ai-data-analysis-tools"]
      ]);

      function ensureDir(filePath) {
        fs.mkdirSync(path.dirname(filePath), { recursive: true });
      }

      function copyIfMissing(sourceFile, destinationFile) {
        if (!fs.existsSync(sourceFile) || fs.existsSync(destinationFile)) return;
        ensureDir(destinationFile);
        fs.copyFileSync(sourceFile, destinationFile);
      }

      function moveHtmlToIndex(filePath) {
        if (!fs.existsSync(filePath) || !filePath.endsWith(".html")) return;
        const basename = path.basename(filePath);
        if (["index.html", "404.html", "500.html", "error.html"].includes(basename)) return;

        const destination = path.join(path.dirname(filePath), basename.slice(0, -5), "index.html");
        if (!fs.existsSync(destination)) {
          ensureDir(destination);
          fs.copyFileSync(filePath, destination);
        }
        fs.rmSync(filePath);
      }

      function walk(dir, visitor) {
        if (!fs.existsSync(dir)) return;
        for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
          const fullPath = path.join(dir, entry.name);
          if (entry.isDirectory()) walk(fullPath, visitor);
          if (entry.isFile()) visitor(fullPath);
        }
      }

      for (const [arabicSlug, englishSlug] of legacyArabicBlog.entries()) {
        const sourceFile = path.join(blog, `${arabicSlug}.html`);
        copyIfMissing(sourceFile, path.join(blog, englishSlug, "index.html"));
        if (fs.existsSync(sourceFile)) fs.rmSync(sourceFile);
      }

      for (const dir of ["blog", "services", "docs", "sectors", "tenders", "en/tenders", "demo/ai-tenders-analysis"]) {
        walk(path.join(root, dir), moveHtmlToIndex);
      }

      for (const page of ["ai-agent", "ai-workflows", "consultation", "data-analysis", "docs", "smart-automation", "tools"]) {
        moveHtmlToIndex(path.join(root, `${page}.html`));
      }

      const aiRejectSource = path.join(process.cwd(), "ai-reject-dashboard");
      const aiRejectPublic = path.join(root, "ai-reject-dashboard");
      copyIfMissing(path.join(aiRejectSource, "index.html"), path.join(aiRejectPublic, "index.html"));
      if (fs.existsSync(path.join(aiRejectSource, "frontend"))) {
        fs.cpSync(
          path.join(aiRejectSource, "frontend"),
          path.join(aiRejectPublic, "frontend"),
          {
            recursive: true,
            force: true,
            filter: (source) => !source.split(path.sep).some((part) => part === "docs"),
          }
        );
      }
      NODE
      SEO_ROOT=.render-static npm run seo:production-guard
    staticPublishPath: .render-static
