services:
  - type: web
    runtime: node
    name: brightai-api
    rootDir: backend
    buildCommand: npm ci --include=dev --no-audit --no-fund
    startCommand: npm start
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: NVIDIA_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GA4_MEASUREMENT_ID
        sync: false
      - key: GA4_API_SECRET
        sync: false
      - key: ANALYTICS_WEBHOOK_KEY
        sync: false
  - type: web
    runtime: static
    name: brightai-site
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run assets:minify && npm run seo:gate && rm -f frontend/js/index-theme.js frontend/js/services-page.js frontend/js/vendor/gsap.min.js && bash scripts/seo-hreflang-dirs.sh
    staticPublishPath: .
    headers:
      # المصدر المرجعي الأساسي للهيدرز هو ملف _headers.
      # هذا القسم يحتفظ فقط بالقيم التنفيذية التي يجب أن يطبّقها Render أثناء النشر.
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://js.sentry-cdn.com https://www.clarity.ms https://cdnjs.cloudflare.com https://tovik.app; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://o4510966719840256.ingest.us.sentry.io https://*.sentry.io https://www.google-analytics.com https://region1.google-analytics.com https://www.clarity.ms https://api.contractai.sa https://tovik.app; frame-src 'self' https://tovik.app; worker-src 'self' blob:; manifest-src 'self'"
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /**/*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate

      - path: /interview/pages/admin
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /interview/pages/admin/
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /interview/pages/admin.html
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /interview/pages/Visitor-registration
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /interview/pages/Visitor-registration/
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /interview/pages/Visitor-registration/index.html
