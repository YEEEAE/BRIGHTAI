# BrightAI Render Blueprint — cleaned against the current project files
# Generated after auditing the uploaded BRIGHTAI-main project and removing routes to pages that are not present.

services:
  - type: web
    runtime: node
    name: brightai-api
    rootDir: backend
    buildCommand: npm ci --include=dev --no-audit --no-fund
    startCommand: npm start
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: brightai-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_VISION_MODEL
        value: llama-3.2-11b-vision-preview
      - key: GROQ_TRANSCRIBE_MODEL
        value: whisper-large-v3-turbo
      - key: GROQ_STREAM_TIMEOUT_MS
        value: 30000
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: nvidia/llama-3.1-nemotron-70b-instruct
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: GA4_MEASUREMENT_ID
        sync: false
      - key: GA4_API_SECRET
        sync: false
      - key: ANALYTICS_WEBHOOK_KEY
        sync: false
      - key: AI_GATEWAY_MOCK_MODE
        value: 0
      - key: RATE_LIMIT_REQUESTS_PER_MINUTE
        value: 30
      - key: RATE_LIMIT_STORAGE
        value: memory
      - key: MAX_BODY_BYTES
        value: 10240
      - key: OCR_MAX_BODY_BYTES
        value: 8388608
      - key: MAX_UPLOAD_BODY_BYTES
        value: 41943040
      - key: DEMO_RATE_LIMIT_IP_MAX
        value: 30
      - key: DEMO_RATE_LIMIT_DEMO_MAX
        value: 10
      - key: DEMO_RATE_LIMIT_BURST_MAX
        value: 5
      - key: CACHE_ENABLED
        value: true

  - type: web
    runtime: static
    name: brightai-site
    buildCommand: |
      set -eu
      npm ci --include=dev --no-audit --no-fund
      npm run assets:minify
      npm run assets:replace-refs
      npm run production:fixes
      npm run sitemap:all
      bash scripts/seo-hreflang-dirs.sh

      rm -rf .render-static
      mkdir -p .render-static
      rsync -a --delete \
        --exclude='.git' \
        --exclude='node_modules' \
        --exclude='.render-static' \
        --exclude='.agents' \
        --exclude='plugins' \
        --exclude='reports' \
        --exclude='tmp' \
        --exclude='backend' \
        --exclude='app' \
        --exclude='components' \
        --exclude='lib' \
        --exclude='scripts' \
        --exclude='next.config.*' \
        --exclude='next-env.d.ts' \
        --exclude='tsconfig*.json' \
        --exclude='package*.json' \
        --exclude='render.yaml' \
        --exclude='*.md' \
        --exclude='.env' \
        --exclude='.env.*' \
        --exclude='*.sqlite' \
        --exclude='*.db' \
        --exclude='*.sql' \
        --exclude='*.log' \
        ./ .render-static/

      node <<'NODE'
      const fs = require("fs");
      const path = require("path");

      const root = path.join(process.cwd(), ".render-static");

      function ensureDir(filePath) {
        fs.mkdirSync(path.dirname(filePath), { recursive: true });
      }

      function removeIfExists(relativePath) {
        const target = path.join(root, relativePath);
        if (fs.existsSync(target)) fs.rmSync(target, { recursive: true, force: true });
      }

      function moveHtmlToIndex(filePath) {
        if (!fs.existsSync(filePath) || !filePath.endsWith(".html")) return;
        const basename = path.basename(filePath);
        if (["index.html", "404.html", "500.html", "error.html"].includes(basename)) return;

        const destination = path.join(path.dirname(filePath), basename.slice(0, -5), "index.html");
        if (!fs.existsSync(destination)) {
          ensureDir(destination);
          fs.copyFileSync(filePath, destination);
        }
        fs.rmSync(filePath, { force: true });
      }

      function walkHtml(dir, visitor) {
        if (!fs.existsSync(dir)) return;
        for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
          const fullPath = path.join(dir, entry.name);
          if (entry.isDirectory()) walkHtml(fullPath, visitor);
          if (entry.isFile() && entry.name.endsWith(".html")) visitor(fullPath);
        }
      }

      // Keep only publish-safe files from bundled demo dashboards.
      removeIfExists("demo/ai-reject-dashboard/backend");
      removeIfExists("demo/ai-reject-dashboard/node_modules");
      removeIfExists("demo/ai-reject-dashboard/docs");
      removeIfExists("demo/ai-reject-dashboard/tests");
      removeIfExists("demo/ai-reject-dashboard/scripts");

      // Convert real .html application pages to clean canonical /path/ URLs.
      // Components such as frontend/components/nav.html are intentionally left unchanged because the app fetches them directly.
      for (const dir of [
        "docs",
        "dashboard",
        "kernel",
        "demo/ai-tenders-analysis",
        "demo/ai-reject-dashboard/frontend/pages",
        "demo/ai-reject-dashboard/frontend/pages/admin"
      ]) {
        walkHtml(path.join(root, dir), moveHtmlToIndex);
      }
      NODE

