      - path: /**/*.svg
        name: Cache-Control
        value: public, max-age=7776000, stale-while-revalidate=2592000
      - path: /*.ico
        name: Cache-Control
        value: public, max-age=7776000, stale-while-revalidate=2592000
      - path: /**/*.ico
        name: Cache-Control
        value: public, max-age=7776000, stale-while-revalidate=2592000
      - path: /llms.txt
        name: Content-Type
        value: text/plain; charset=utf-8
      - path: /llms-full.txt
        name: Content-Type
        value: text/plain; charset=utf-8
      - path: /robots.txt
        name: Content-Type
        value: text/plain; charset=utf-8
      - path: /sitemap*.xml
        name: Content-Type
        value: application/xml; charset=utf-8
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json; charset=utf-8
      # ── Hard block: frontend/ (Express backend code) is NOT published ──
      # Safety net in case any stale cache or accidental file ends up under
      # /frontend/*. Tells crawlers + browsers to never index or cache it.
      - path: /frontend/*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive, nosnippet
      - path: /frontend/*
        name: Cache-Control
        value: no-store, no-cache, must-revalidate, max-age=0
      - path: /frontend/*
        name: Content-Security-Policy
        value: "default-src 'none'; frame-ancestors 'none'"
