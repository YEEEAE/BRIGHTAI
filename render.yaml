# BrightAI Render Blueprint — Astro with the standalone Node adapter.
# npm start applies redirects.json before static files via scripts/server.mjs;
# src/middleware.ts also resolves aliases that reach Astro.

services:
  - type: web
    runtime: node
    name: brightai-site
    # The committed lockfile is package-lock.json; no pnpm lockfile is present.
    buildCommand: npm ci && npm run build
    # Operator: attach the domain to this Node web service, not dist/client.
    # Forward /app/* and /app/api/* unchanged; bypass every CDN cache for /app/*.
    # Existing static hosting requires an operator-managed origin change; not deployed here.
    startCommand: npm start
    # Checks website availability only, not product/API readiness.
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      # Enable only after the owner authorizes exposing the portal on this Node service.
      - key: AIGAS_APP_ENABLED
        value: "false"
      # The full CSP is defined in src/middleware.ts and shipped as Report-Only.
      # Set true only after an authorized browser check of the public site, the
      # GA4 tag and the Neon Auth sign-in flow. See docs/PRE-BETA-SECURITY-AND-OPERATIONS-RUNBOOK.md.
      - key: AIGAS_CSP_ENFORCE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: NEON_AUTH_JWKS_URL
        sync: false
      # Preserved for existing dashboard compatibility; the current site has no chat API.
      - key: REDIS_URL
        sync: false
    # Operator runbook: docs/APP-PORTAL-RUNTIME-HANDOFF.md
    # Data/secret handling and rotation: docs/DATA-PRIVACY-AND-SECURITY.md
    # Branch protection, backup/restore and rollback: docs/NEON-BRANCH-PROTECTION-RUNBOOK.md
    # DATABASE_URL must be a least-privilege runtime role before the portal is enabled;
    # never paste a secret value into this file or any tracked file.
    # Static-site header rules do not belong to this Node web service.
    # src/middleware.ts sets baseline headers (framing, referrer, permissions,
    # HSTS on HTTPS) and private /app/* no-store/noindex headers.
    # Keep TLS termination at the operator-managed edge; do not downgrade to HTTP.
