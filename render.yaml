# BrightAI Render Blueprint — Astro site (static + Node server functions)
# KERNEL-AI-2026-07-14: switched from `runtime: static` to `runtime: node`
# to enable the /api/ai/chat and /api/lead serverless functions on Render.
# Astro builds produce:
#   - dist/client/   (190 prerendered HTML pages + assets)
#   - dist/server/   (Node standalone server with API routes)
# The Node server serves both static files and API routes from one process.

services:
  - type: web
    runtime: node
    name: brightai-site
    buildCommand: pnpm install && pnpm run build
    startCommand: node ./dist/server/entry.mjs
    # KERNEL-AUDIT-2026-07-15-BATCH-10 / EXEC-17: hit a real SSR endpoint
    # (not just / static HTML) so Render detects actual Node outages.
    healthCheckPath: /api/health/
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      # GROQ_API_KEY and GEMINI_API_KEY are set in Render dashboard env
      # (NOT in this file — they are server secrets).
      # LEAD_WEBHOOK_URL + LEAD_WEBHOOK_SECRET (KRN-004 / EXEC-04) also
      # set in Render dashboard env. Without LEAD_WEBHOOK_URL configured,
      # leads are queued in-memory only (cap 100). Recommended webhook
      # providers: Resend / SendGrid / HubSpot / Zapier / n8n.
      # BRIGHTAI_CHAT_KEY (KRN-003-FULL-2026-07-15 / EXEC-03) — optional
      # shared-secret API key for /api/ai/chat/. The endpoint accepts
      # requests from the BrightAI origin (browser) OR from any client
      # sending a valid `x-brightai-chat-key: <key>` header. Set in Render
      # dashboard to enable the API-key auth path for non-browser clients
      # (curl/Postman/server-to-server). When unset, only the Origin
      # allowlist is enforced (current production default). Generate with:
      #   openssl rand -hex 32
      # The value is read at function scope (process.env) at request time
      # so it is never inlined into the SSR bundle.
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://js.sentry-cdn.com https://www.clarity.ms https://*.clarity.ms https://cdnjs.cloudflare.com; script-src-elem 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://js.sentry-cdn.com https://www.clarity.ms https://*.clarity.ms https://cdnjs.cloudflare.com; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://region1.google-analytics.com https://stats.g.doubleclick.net https://o4510966719840256.ingest.us.sentry.io https://*.sentry.io https://www.clarity.ms https://*.clarity.ms https://c.bing.com; frame-src 'self' https://www.googletagmanager.com; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' data: blob: https:; upgrade-insecure-requests"
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /sw.js
        name: Cache-Control
        value: no-store, no-cache, must-revalidate, max-age=0
      - path: /service-worker.js
        name: Cache-Control
        value: no-store, no-cache, must-revalidate, max-age=0
      - path: /*.css
        name: Cache-Control
        value: public, max-age=86400
      - path: /**/*.css
        name: Cache-Control
        value: public, max-age=86400
      - path: /*.js
        name: Cache-Control
        value: public, max-age=86400
      - path: /**/*.js
        name: Cache-Control
        value: public, max-age=86400
      - path: /*.v*.css
