  <script>
    // --- Recent Interactions ---
    async function loadRecent() {
      const el = document.getElementById('recentList');
      try {
        const res = await fetch('/api/kernel/audit?limit=5');
        if (!res.ok) throw new Error();
        const data = await res.json();
        const items = data.audit || data.records || data.interactions || data.data || data;
        if (!Array.isArray(items) || items.length === 0) {
          el.innerHTML = '<p class="text-muted text-xs">لا توجد تفاعلات حديثة</p>';
          return;
        }
        el.innerHTML = items.map(r => {
          const id = r.interactionId || r.id || r._id || '';
          const label = id.length > 12 ? id.substring(0,12) + '...' : id;
          return `<button onclick="document.getElementById('interactionId').value='${id}';generateEvidence()" class="w-full text-right bg-surface hover:bg-border border border-border rounded-lg px-3 py-2 text-xs hash-field text-accent hover:text-emerald-300 transition">${label}</button>`;
        }).join('');
      } catch {
        el.innerHTML = '<p class="text-muted text-xs">تعذّر تحميل التفاعلات الحديثة</p>';
      }
    }

    // --- Generate Evidence ---
    let rawEvidence = null;

    async function generateEvidence() {
      const id = document.getElementById('interactionId').value.trim();
      const errEl = document.getElementById('inputError');
      const outEl = document.getElementById('evidenceOutput');
      const btn = document.getElementById('genBtn');

      errEl.classList.add('hidden');
      outEl.classList.add('hidden');

      if (!id) {
        errEl.textContent = 'يرجى إدخال معرّف التفاعل';
        errEl.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path></svg> جارٍ الإنشاء...';

      try {
        const res = await fetch(`/api/kernel/evidence/${encodeURIComponent(id)}`, { method: 'POST' });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || err.message || `خطأ ${res.status}`);
        }
        rawEvidence = await res.json();
        renderEvidence(rawEvidence);
      } catch (e) {
        errEl.textContent = e.message || 'تعذّر إنشاء ملف الدليل';
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg> إنشاء ملف الدليل';
      }
    }

    // --- Helpers ---
    function hashHtml(val) {
      if (!val) return '<span class="text-muted">—</span>';
      return `<span class="hash-field text-xs text-emerald-300">${esc(val)}</span>`;
    }
    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function badge(label, color='accent') {
      const c = color === 'red' ? 'bg-red-500/10 text-red-400' : color === 'yellow' ? 'bg-yellow-500/10 text-yellow-400' : color === 'blue' ? 'bg-blue-500/10 text-blue-400' : 'bg-accent/10 text-accent';
      return `<span class="inline-block px-2 py-0.5 rounded text-xs font-semibold ${c}">${esc(label)}</span>`;
    }
    function sectionCard(title, icon, bodyHtml) {
      return `<div class="bg-card border border-border rounded-xl overflow-hidden">
        <div class="px-5 py-3 bg-surface border-b border-border flex items-center gap-2">
          <span class="text-accent">${icon}</span>
          <h3 class="text-sm font-bold text-gray-200">${esc(title)}</h3>
        </div>
        <div class="p-5">${bodyHtml}</div>
      </div>`;
    }
    function kvRow(key, val, mono=false) {
      const cls = mono ? 'hash-field' : '';
      return `<div class="flex flex-col sm:flex-row sm:items-center gap-1 py-2 border-b border-border/50 last:border-0">
        <span class="text-muted text-xs w-40 shrink-0">${esc(key)}</span>
        <span class="${cls} text-sm text-gray-100">${val}</span>
      </div>`;
    }

    // --- Render ---
    function renderEvidence(ev) {
      const out = document.getElementById('evidenceOutput');
      const e = ev.evidence || ev;
      let html = '';

      // Action buttons
      html += `<div class="flex items-center gap-3 mb-6">
        <button onclick="copyJson()" class="bg-surface border border-border hover:border-accent text-gray-300 hover:text-accent px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
          نسخ JSON
        </button>
        <button onclick="downloadJson()" class="bg-surface border border-border hover:border-accent text-gray-300 hover:text-accent px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          تحميل JSON
        </button>
        <span id="copyMsg" class="text-accent text-xs hidden">تم النسخ!</span>
      </div>`;

      // 1 - Evidence ID + Timestamp
      html += sectionCard('معرّف الدليل والطابع الزمني', '&#x1F4C4;',
        kvRow('معرّف الدليل', hashHtml(e.evidenceId), true) +
        kvRow('الطابع الزمني', e.timestamp ? new Date(e.timestamp).toLocaleString('ar-SA') : '—')
      );

      // 2 - Summary
      const s = e.summary || e;
      html += sectionCard('الملخص', '&#x1F4CB;',
        kvRow('الطلب', esc(s.request || s.userPrompt || '—')) +
        kvRow('الرد', esc(s.response || s.aiResponse || '—')) +
        kvRow('درجة المخاطر', (s.riskScore ?? s.risk?.score ?? '—') + ' / 100') +
        kvRow('مستوى المخاطر', badge(s.riskLevel || s.risk?.level || '—', (s.riskLevel || s.risk?.level) === 'high' ? 'red' : (s.riskLevel || s.risk?.level) === 'medium' ? 'yellow' : 'accent')) +
        kvRow('حالة الموافقة', badge(s.approvalStatus || s.approval || '—')) +
        kvRow('النموذج', esc(s.model || '—')) +
        kvRow('التوكنات', esc(s.tokens || s.tokenUsage ? JSON.stringify(s.tokens || s.tokenUsage) : '—')) +
        kvRow('زمن الاستجابة', esc((s.responseTime || s.duration || '—') + (s.responseTime || s.duration ? ' مللي ثانية' : '')))
      );

      // 3 - Firewall
      const fw = e.firewall || e.firewallResult || e.piiDetection || {};
      const piiDetected = fw.piiDetected ?? fw.detected ?? false;
      html += sectionCard('جدار الحماية', '&#x1F6E1;',
        kvRow('PII مكتشف', piiDetected ? badge('نعم — تم الكشف', 'red') : badge('لا — نظيف', 'accent')) +
        kvRow('الأنواع', esc(fw.types ? fw.types.join(', ') : (fw.piiTypes || '—'))) +
        kvRow('العناصر', esc(fw.items ? fw.items.join(', ') : (fw.piiItems || '—'))) +
        kvRow('التصنيفات الحساسة', esc(fw.sensitiveCategories ? fw.sensitiveCategories.join(', ') : '—')) +
        kvRow('الإجراء', esc(fw.action || '—'))
      );

      // 4 - Risk Assessment
      const risk = e.riskAssessment || e.risk || {};
      const reasons = risk.reasons || risk.factors || [];
      html += sectionCard('تقييم المخاطر', '&#x26A0;',
        kvRow('الدرجة', (risk.score ?? '—') + ' / 100') +
        kvRow('المستوى', badge(risk.level || '—', risk.level === 'high' ? 'red' : risk.level === 'medium' ? 'yellow' : 'accent')) +
        kvRow('الأسباب', reasons.length > 0 ? `<ul class="list-disc list-inside text-xs text-gray-300 space-y-1">${reasons.map(r=>`<li>${esc(typeof r === 'string' ? r : JSON.stringify(r))}</li>`).join('')}</ul>` : '<span class="text-muted">—</span>')
      );

      // 5 - Compliance
      const comp = e.compliance || e.complianceResult || {};
      html += sectionCard('الامتثال', '&#x2705;',
        kvRow('حزمة الامتثال', esc(comp.pack || comp.compliancePack || '—')) +
        kvRow('العلامات (Flags)', comp.flags && comp.flags.length > 0
          ? comp.flags.map(f => badge(typeof f === 'string' ? f : f.rule || f.name || JSON.stringify(f), 'yellow')).join(' ')
          : '<span class="text-accent text-xs">لا توجد علامات</span>')
      );

      // 6 - Audit / Integrity
      const aud = e.audit || e.integrity || {};
      const verified = aud.integrityVerified ?? aud.verified ?? true;
      html += sectionCard('التدقيق والسلامة', '&#x1F50F;',
        kvRow('هاش الطلب', hashHtml(aud.requestHash), true) +
        kvRow('هاش الرد', hashHtml(aud.responseHash), true) +
        kvRow('هاش السابق', hashHtml(aud.previousHash), true) +
        kvRow('هاش السجل', hashHtml(aud.recordHash), true) +
        kvRow('السلامة', verified ? '<span class="inline-flex items-center gap-1">' + badge('تم التحقق — سليم', 'accent') + '<span class="pulse-glow inline-block w-2 h-2 rounded-full bg-accent"></span></span>' : badge('غير متطابق', 'red'))
      );

      // 7 - User
      const usr = e.user || {};
      html += sectionCard('المستخدم', '&#x1F464;',
        kvRow('المعرّف', hashHtml(usr.id || usr.userId || '—'), true) +
        kvRow('الاسم', esc(usr.name || usr.userName || '—')) +
        kvRow('عنوان IP', `<span class="hash-field text-xs">${esc(usr.ip || usr.ipAddress || '—')}</span>`)
      );

      // 8 - Regulatory References
      const refs = e.regulatoryReferences || e.references || [];
      if (refs.length > 0) {
        let refRows = refs.map(r => `<tr class="border-b border-border/50">
          <td class="py-2 px-3 text-xs text-gray-300">${esc(r.framework || r.standard || '—')}</td>
          <td class="py-2 px-3 text-xs text-accent font-semibold">${esc(r.article || r.section || r.clause || '—')}</td>
          <td class="py-2 px-3 text-xs text-gray-400">${esc(r.description || '—')}</td>
        </tr>`).join('');
        html += sectionCard('المراجع التنظيمية', '&#x1F4DA;',
          `<div class="overflow-x-auto"><table class="w-full text-right">
            <thead><tr class="border-b border-border text-muted text-xs">
              <th class="py-2 px-3">الإطار</th><th class="py-2 px-3">المادة</th><th class="py-2 px-3">الوصف</th>
            </tr></thead>
            <tbody>${refRows}</tbody>
          </table></div>`
        );
      }

      // 9 - Evidence Hash
      html += `<div class="bg-card border border-border rounded-xl p-5 text-center">
        <span class="text-muted text-xs block mb-2">هاش ملف الدليل</span>
        <span class="hash-field text-xs text-accent break-all">${hashHtml(e.evidenceHash || e.hash || e.sha256 || '—')}</span>
      </div>`;

      out.innerHTML = html;
      out.classList.remove('hidden');
      out.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // --- Copy / Download ---
    function copyJson() {
      if (!rawEvidence) return;
      navigator.clipboard.writeText(JSON.stringify(rawEvidence, null, 2)).then(() => {
        const msg = document.getElementById('copyMsg');
        msg.classList.remove('hidden');
        setTimeout(() => msg.classList.add('hidden'), 2000);
      });
    }
    function downloadJson() {
      if (!rawEvidence) return;
      const id = rawEvidence.evidenceId || rawEvidence.interactionId || rawEvidence.id || 'evidence';
      const blob = new Blob([JSON.stringify(rawEvidence, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `evidence-${id}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // --- Init ---
    loadRecent();
  </script>
