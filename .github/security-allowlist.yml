# BRIGHTAI — Security CVE Allowlist
#
# Purpose: Allow specific CVEs to pass CI without failing the build.
# This is a LAST RESORT — the default behavior is to FAIL on any critical/high CVE.
#
# Required fields for every entry:
#   - id:           CVE identifier from a real database (NVD / GHSA / OSV)
#   - package:      exact package name (case-sensitive, no version)
#   - severity:     critical | high | medium | low (matches the CVE)
#   - justification: WHY we accept the risk — must be concrete and specific
#   - expires:      YYYY-MM-DD — CI fails if today > expires (max 90 days from creation)
#
# Rules (enforced by CI + manual review):
#   - No entry without a real justification (no "just because" or "low risk")
#   - No entry without an expiration date (max 90 days; renewable)
#   - Critical CVEs require explicit founder approval before adding
#   - Each entry must link a tracking issue (PR or task ID)
#   - Entries older than 90 days MUST be re-justified or removed
#   - Duplicate IDs are not allowed (CI fails on duplicates)
#
# How to add an exception:
#   1. Get the CVE ID from GitHub Security Advisory, NVD, or OSV.dev
#   2. Verify the CVE affects our exact version range (the committed lockfile is
#      package-lock.json; there is no pnpm lockfile):
#        node -e "const l=require('./package-lock.json');console.log(l.packages['node_modules/<name>'])"
#   3. Confirm no upstream patch exists (check npm/GitHub for newer version)
#   4. Document the specific risk we're accepting (NOT generic boilerplate)
#   5. Add the entry with concrete justification + ≤90 day expiration
#   6. Open a PR — the security-scan job will validate the entry shape
#      (duplicate ID, malformed date, expired entry all fail CI)
#
# How to remove:
#   1. After patching the dependency, delete the entry
#   2. CI will enforce: no expired entries, no duplicates, valid YAML
#
# Validation enforced by CI:
#   - YAML syntax valid
#   - Every entry has all 6 required fields
#   - expires date is in the future (today < expires)
#   - severity is one of: critical, high, medium, low
#   - id follows CVE-YYYY-NNNN+ or GHSA-xxxx-xxxx-xxxx pattern
#
# Related:
#   - Workflow: .github/workflows/ci-build-guard.yml (job: security-scan)
#   - Brain entry: .agents/brain.md → "HIGH-08 DEPENDENCY-GATE-2026-07-15"
#   - Report: report/2026-07-15-dependency-gate.md
#
# Last reviewed: 2026-11-10 (P16-AR04 — first dependency advisory review)
# Reviewer: P16 Dependency Security Engineer
# Evidence: Audit/p16-dependency-security-2026-11-10/REPORT.md
# Re-verify the reachability facts with: node scripts/verify-dependency-posture.mjs
#
# Intentionally NOT listed: GHSA-26w7-cxv4-gfx2 (critical, Astro AVIF image
# optimization RCE). Its reachability proof is recorded in the P16 report, but a
# critical entry requires explicit founder approval, so it stays unwaived until
# the owner approves it or the Astro upgrade below lands.
#   Pending upgrade (needs an authorized major-version scope): astro >= 7.3.2
#   with @astrojs/node >= 11.1.3, which also requires Node >= 22.23.4.

exceptions:
  # ---- @astrojs/node 10.1.4: reachable only through the adapter's own request
  # handling, which scripts/server.mjs now guards before the adapter runs.
  - id: GHSA-qh8j-hqjv-7m4x
    package: '@astrojs/node'
    severity: high
    justification: 'CVE-2026-102984: a malformed Host port crash raised an uncaught Invalid URL and answered 500 on every SSR route; reproduced locally on /healthz/, /app/ and /app/api/ before the guard. scripts/server.mjs now rejects a Host that is not a single hostname[:port] with port <= 65535 (400) and catches a rejected render, so the adapter path is unreachable. The dependency itself is still unfixed; the remedy is @astrojs/node >= 11.1.3 with astro >= 7.2.1, a major upgrade that needs an authorized scope, and Node >= 22.23.4 against the pinned 22.22.2. Guard: verify-node-runtime A10.'
    expires: '2027-02-08'
    added_by: 'P16 Dependency Security Engineer'
    added_date: '2026-11-10'
    tracking_issue: 'P16-AR04'
  - id: GHSA-r557-wffq-wvrc
    package: '@astrojs/node'
    severity: low
    justification: 'Open redirect via a raw backslash in the trailing-slash redirect: /\evil.example/app answered 301 with Location /\evil.example/app/, which a browser resolves to //evil.example/app/. Reproduced locally, then closed: scripts/server.mjs rejects a raw backslash in the request path with 400, and an encoded %5C path stays same-origin in Location. Guard: verify-node-runtime A11.'
    expires: '2027-02-08'
    added_by: 'P16 Dependency Security Engineer'
    added_date: '2026-11-10'
    tracking_issue: 'P16-AR04'
  # ---- astro 6.4.8: no path from this site's code reaches these advisories.
  - id: GHSA-f48w-9m4c-m7f5
    package: astro
    severity: moderate
    justification: 'Unescaped spread attribute names are only rendered through a framework renderer (renderHTMLElement). The project declares and uses no @astrojs/react, preact, vue, svelte or solid integration and has no .jsx/.tsx/.mdx page, so no renderer ships. Guard: verify-dependency-posture D3.'
    expires: '2027-02-08'
    added_by: 'P16 Dependency Security Engineer'
    added_date: '2026-11-10'
    tracking_issue: 'P16-AR04'
  - id: GHSA-7pw4-f3q4-r2p2
    package: astro
    severity: low
    justification: 'Requires a transition:* directive on a hydrated island. The site has no client:* directive and no astro transition: directive (the only transition: occurrences are CSS declarations in .astro style blocks). Guard: verify-dependency-posture D4.'
    expires: '2027-02-08'
    added_by: 'P16 Dependency Security Engineer'
    added_date: '2026-11-10'
    tracking_issue: 'P16-AR04'
  - id: GHSA-4g3v-8h47-v7g6
    package: astro
    severity: moderate
    justification: 'Requires View Transition animation properties. The site imports neither ViewTransitions nor ClientRouter and has no transition:animate/transition:name directive; navigation uses at most the native view-transition API (already documented in P12). Guard: verify-dependency-posture D4.'
    expires: '2027-02-08'
    added_by: 'P16 Dependency Security Engineer'
    added_date: '2026-11-10'
    tracking_issue: 'P16-AR04'
  - id: GHSA-376h-93r7-7g6f
    package: astro
    severity: moderate
    justification: 'Authorization bypass while stripping the configured base. astro.config.mjs sets no base, and every route is served from the origin root, so there is no base prefix to strip. Guard: verify-dependency-posture D5.'
    expires: '2027-02-08'
    added_by: 'P16 Dependency Security Engineer'
    added_date: '2026-11-10'
    tracking_issue: 'P16-AR04'
  - id: GHSA-98hj-9722-w3j8
    package: astro
    severity: moderate
    justification: 'Unescaped <script>/<style> content in JSX/MDX rendering. The project has no .jsx/.tsx/.mdx file anywhere under src/, so the affected rendering path is not built. Guard: verify-dependency-posture D6.'
    expires: '2027-02-08'
    added_by: 'P16 Dependency Security Engineer'
    added_date: '2026-11-10'
    tracking_issue: 'P16-AR04'
  # ---- sharp 0.34.5 (optional dependency of astro): never loaded.
  - id: GHSA-f88m-g3jw-g9cj
    package: sharp
    severity: high
    justification: 'libvips inherited CVEs are reachable only when sharp decodes an untrusted image. Its sole consumer is the Astro image service, and the site uses no astro:assets API: no astro:assets import, no getImage(), no <Image />, no avif, no image: config, and the built output exposes no /_image endpoint. sharp is an optional dependency and is never imported. Guard: verify-dependency-posture D2.'
    expires: '2027-02-08'
    added_by: 'P16 Dependency Security Engineer'
    added_date: '2026-11-10'
    tracking_issue: 'P16-AR04'
  - id: GHSA-rgj7-g3m4-5g8c
    package: sharp
    severity: high
    justification: 'libheif CVEs are reachable only when sharp decodes a HEIF/AVIF input it is handed by the image service, which this site does not run (see GHSA-f88m-g3jw-g9cj). Guard: verify-dependency-posture D2.'
    expires: '2027-02-08'
    added_by: 'P16 Dependency Security Engineer'
    added_date: '2026-11-10'
    tracking_issue: 'P16-AR04'
  - id: GHSA-wq5f-xc86-pv6w
    package: sharp
    severity: high
    justification: 'librsvg CVE is reachable only through sharp rasterising an SVG via the image service, which this site does not run (see GHSA-f88m-g3jw-g9cj). Note: astro:assets images must not be introduced before the Astro upgrade, or this exception and the critical AVIF one stop being valid.'
    expires: '2027-02-08'
    added_by: 'P16 Dependency Security Engineer'
    added_date: '2026-11-10'
    tracking_issue: 'P16-AR04'
  # ---- esbuild 0.27.7 (build-time only).
  - id: GHSA-g7r4-m6w7-qqqr
    package: esbuild
    severity: low
    justification: 'Arbitrary file read via the esbuild development server, Windows only. esbuild is used by Astro/Vite to build, never started as a server, the repository builds with `astro build` on darwin and the Linux Node runtime on Render, and no esbuild binary is in the shipped server bundle.'
    expires: '2027-02-08'
    added_by: 'P16 Dependency Security Engineer'
    added_date: '2026-11-10'
    tracking_issue: 'P16-AR04'
