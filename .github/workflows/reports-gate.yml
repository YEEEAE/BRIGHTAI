# BRIGHTAI — Reports Gate CI
#
# BAI-PROC-12 (2026-07-25) — prevents merging any report/*.md file that
# claims ✅ without proving verified_production against the live site.
#
# Closes the 2026-07-25 BAI-DEPLOY-11 gap where 3 reports declared PASS
# for fixes that were verified locally only but failed on production
# (the uncommitted /frontend/ leak, the missing /api/health/ JSON, and
# the stale Cloudflare cache).
#
# What this job does:
#   1. Checks out the PR
#   2. Installs dependencies (pnpn + Node 22)
#   3. Runs `pnpm run verify:report` — scans every report/2026-07-25-*.md
#      for ✅ claims and asserts each one has a verified_production: yes
#      field (or the file is grandfathered by date).
#   4. Fails the PR if any post-cutover report has claims without proof.
#
# Legacy reports (date < 2026-07-25) are warned, not failed — the
# cutover is the contract change point.
#
# Branch protection (configure in GitHub repo settings) should require
# this job for any PR that touches report/*.md. If a PR does not touch
# any report file, this job is not required (skip-on-no-changes below).

name: Reports Gate

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'report/**'
      - 'scripts/verify-report-claims.mjs'
      - 'package.json'
  push:
    branches:
      - main
      - master
    paths:
      - 'report/**'

concurrency:
  group: reports-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report-discipline:
    name: Report claims discipline gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Report Claims Gate
        run: pnpm run verify:report

      - name: Run Report Claims Gate (strict on warnings)
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        run: pnpm run verify:report -- --strict

      - name: Annotate failure with fix instructions
        if: failure()
        run: |
          echo "## ❌ Reports Gate Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "One or more post-2026-07-25 reports contain ✅ claims without verified_production proof." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Fix" >> $GITHUB_STEP_SUMMARY
          echo "Add these fields to the affected report(s):" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "verified_local: yes" >> $GITHUB_STEP_SUMMARY
          echo "verified_production: yes   # only if you ran pnpm run verify:production against live brightai.live" >> $GITHUB_STEP_SUMMARY
          echo "verified_production_commit: <40-char SHA>" >> $GITHUB_STEP_SUMMARY
          echo "verified_production_at: <UTC timestamp>" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Or, if the fix is still pending production deploy, mark:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "verified_local: yes" >> $GITHUB_STEP_SUMMARY
          echo "verified_production: no" >> $GITHUB_STEP_SUMMARY
          echo "verified_production_blocker: <reason — e.g. 'awaiting Render deploy' or 'Cloudflare cache stale'>" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See report/2026-07-25-bai-proc-12-verify-production-process.md for the full process." >> $GITHUB_STEP_SUMMARY

  report-discipline-summary:
    name: Reports Gate — PR comment
    if: always() && github.event_name == 'pull_request'
    needs: report-discipline
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Comment on PR with results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const result = {
              jobStatus: '${{ needs.report-discipline.result }}',
              strictRun: 'executed (non-blocking)',
            };
            const body = `## 📋 Reports Gate (BAI-PROC-12)\n\n- Job: \`${{ needs.report-discipline.result }}\`\n- Strict warnings: non-blocking\n\nThe full discipline gate is wired in \`scripts/verify-report-claims.mjs\`. See the job logs for per-report findings.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });
