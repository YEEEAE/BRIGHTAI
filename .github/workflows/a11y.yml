name: A11y

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  axe:
    name: Accessibility (WCAG 2.1 AA) Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build static site
        run: pnpm run build

      - name: Run axe-core scan
        env:
          A11Y_BASE_URL: http://localhost:4321
        run: |
          pnpm preview --port 4321 &
          PREVIEW_PID=$!
          # انتظار جاهزية الـ preview (بدون dependency إضافية)
          for i in $(seq 1 40); do
            if curl -s http://localhost:4321/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/axe-scan.mjs
          SCAN_EXIT=$?
          kill $PREVIEW_PID 2>/dev/null || true
          exit $SCAN_EXIT

      - name: Upload a11y HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: a11y-report.html
          if-no-files-found: ignore

      - name: Comment PR with a11y results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let data;
            try { data = JSON.parse(fs.readFileSync('a11y-report.json', 'utf8')); }
            catch { core.info('a11y-report.json not found'); return; }
            const sev = { critical: 0, serious: 0, moderate: 0, minor: 0 };
            const rows = [];
            for (const r of data) {
              const c = { critical: 0, serious: 0, moderate: 0, minor: 0 };
              for (const v of (r.violations || [])) if (v.impact) c[v.impact]++;
              for (const k in sev) sev[k] += c[k];
              const status = r.error ? 'ERROR' : (r.violations.length ? String(r.violations.length) + ' issue(s)' : 'clean');
              rows.push(`| ${r.path} | ${c.critical} | ${c.serious} | ${c.moderate} | ${c.minor} | ${status} |`);
            }
            const body =
              `## ♿ Accessibility Scan — WCAG 2.1 AA\n\n` +
              `**Critical:** ${sev.critical} · **Serious:** ${sev.serious} · **Moderate:** ${sev.moderate} · **Minor:** ${sev.minor}\n\n` +
              `| Page | Critical | Serious | Moderate | Minor | Status |\n` +
              `|---|---|---|---|---|---|\n` +
              rows.join('\n') + `\n\n` +
              (sev.critical > 0
                ? '❌ **Critical violations تفشل الـ merge.** صحّحها قبل الموافقة.'
                : '✅ **لا يوجد critical violations.**');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
        continue-on-error: true
