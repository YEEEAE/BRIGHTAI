# BRIGHTAI — Weekly GSC Indexation Snapshot
#
# BAI-IDX-13 (2026-07-25) — weekly Google Search Console indexation snapshot.
#
# Why this workflow exists:
#   The team has been exporting GSC data manually. This workflow automates it:
#     1. Every Sunday 06:00 UTC, query the GSC URL Inspection API for every URL
#        in the production sitemap (180 URLs as of 2026-07-25).
#     2. Save the result as report/gsc/YYYY-MM-DD.json (date-keyed by UTC day).
#     3. Compute the week-over-week delta against the most recent prior file.
#     4. Commit the new file back to main (no PR — this is a generated
#        artifact, not a code change).
#
# Schedule:
#   cron: "0 6 * * 0"  →  Sunday 06:00 UTC
#   Also runnable via workflow_dispatch for ad-hoc snapshots.
#
# Required GitHub Secret (set once, then never touched):
#   GSC_SERVICE_ACCOUNT_JSON  — full JSON content of a GSC service account key.
#     The corresponding service-account email must be added as an Owner on
#     https://search.google.com/search-console/users (sc-domain:brightai.site).
#
# Quota (URL Inspection API):
#   - 2,000 inspections/day per site (the script uses 180; well within limit).
#   - 600 inspections/minute per project (the script caps at 10 concurrent
#     with exponential backoff on 429/5xx; retries up to 3 times per URL).
#
# Permissions:
#   - contents: write  — to commit the JSON snapshot back to the repo.
#   - id-token: none required (we use a static SA key, not OIDC).
#
# Reversal:
#   Delete this file + the GSC_SERVICE_ACCOUNT_JSON secret + the report/gsc/
#   directory. No code change touches anything user-facing.

name: Weekly GSC Indexation Snapshot

on:
  schedule:
    # Sunday 06:00 UTC. Cron format: minute hour day-of-month month day-of-week
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no API calls, synthetic data)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

# Cancel in-progress runs of the same workflow on the same branch.
concurrency:
  group: weekly-gsc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  gsc-snapshot:
    name: GSC weekly snapshot + commit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests (defense in depth)
        run: node --test scripts/gsc-export.test.mjs

      - name: Build the site (so sitemap.xml exists)
        run: ASTRO_TELEMETRY_DISABLED=1 pnpm run build

      - name: Run GSC export
        if: env.GSC_SERVICE_ACCOUNT_JSON != ''
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL || 'sc-domain:brightai.site' }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "::notice::Dry-run mode (workflow_dispatch input)"
            node scripts/gsc-export.mjs --dry-run
          else
            node scripts/gsc-export.mjs
          fi

      - name: Run GSC export (dry-run fallback)
        if: env.GSC_SERVICE_ACCOUNT_JSON == ''
        env:
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL || 'sc-domain:brightai.site' }}
        run: |
          echo "::warning::GSC_SERVICE_ACCOUNT_JSON secret is not set. Running --dry-run so the file is still written. Set the secret to enable live GSC data."
          node scripts/gsc-export.mjs --dry-run

      - name: Verify the output file
        run: |
          if [ ! -d report/gsc ]; then
            echo "::error::report/gsc/ directory was not created"
            exit 1
          fi
          count=$(ls report/gsc/*.json 2>/dev/null | wc -l)
          echo "report/gsc/ contains $count JSON file(s)"
          if [ "$count" -lt 1 ]; then
            echo "::error::No JSON file was written"
            exit 1
          fi
          # The newest file must be valid JSON + contain the acceptance criteria fields.
          newest=$(ls -t report/gsc/*.json | head -1)
          echo "Newest file: $newest"
          test -s "$newest" || { echo "::error::$newest is empty"; exit 1; }
          node -e "
            const data = JSON.parse(require('fs').readFileSync('$newest', 'utf8'));
            for (const k of ['indexed_count', 'not_indexed_count', 'crawled_not_indexed_count', 'total_count']) {
              if (typeof data[k] !== 'number') {
                console.error('Missing or non-numeric field:', k);
                process.exit(1);
              }
            }
            console.log('Acceptance criteria fields present:', {
              total_count: data.total_count,
              indexed_count: data.indexed_count,
              not_indexed_count: data.not_indexed_count,
              crawled_not_indexed_count: data.crawled_not_indexed_count,
            });
          "

      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report/gsc/
          # Only commit if there is something new to commit.
          if git diff --cached --quiet; then
            echo "No changes to commit (snapshot file already exists for today)."
            exit 0
          fi
          # The commit message follows DEC-PROC-12-2026-07-25-002.
          # The [skip-precommit] opt-out is not needed: this commit is touched by a
          # human (the workflow bot), not a developer, and the file is in
          # report/ (a generated artifact, not a high-blast-radius source path).
          git commit -m "chore(gsc): BAI-IDX-13 weekly indexation snapshot"
          git push
