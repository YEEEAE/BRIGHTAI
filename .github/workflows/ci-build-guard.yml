# BRIGHTAI — CI Build Guard
#
# Prevents merging any invalid build. Secrets-free (runs on PRs without
# external credentials). Catches the three production blockers from
# 2026-07-15 sessions:
#   - CRITICAL-01: pnpm dashboard:build failures (missing deps, ONNX bundling)
#   - CRITICAL-02: Prisma schema drift + generation gaps
#   - CRITICAL-03: No CI to catch invalid builds pre-merge
#
# Also catches (added 2026-07-15 — HIGH-08 / IP-09):
#   - HIGH-08: Transitive dependency CVEs reaching production lockfile
#
# Also catches (added 2026-07-25 — BAI-PERF-03):
#   - PERF-03: Lighthouse LCP budget (2500ms) regression on dist/client
#     via `pnpm run lhci:collect` + `pnpm run lhci:assert` steps inside
#     the seo-gates job. Desktop-only gate; mobile measurement uses PSI
#     in production (see report/2026-07-25-bai-perf-03-ci-lhci-gate.md).
#
# Branch protection (configure in GitHub repo settings) should require:
#   - install
#   - typecheck
#   - lint
#   - test
#   - build-astro
#   - build-dashboard
#   - seo-gates
#   - security-scan (HIGH-08 — OSV lockfile scan + allowlist validation)
#   - hreflang-live (BAI-IDX-14 — production drift detection, runs on push + schedule + dispatch)
#   - links-dist (BAI-LINK-06 — internal link audit on dist/)
#   - ci-success (must be green to merge)
#
# Edge cases handled:
#   - PRs without secrets: no DB, no Clerk, no API keys needed
#   - pnpm via corepack (no global install, exact version)
#   - Prisma client generated via packages/db postinstall hook
#   - vitest firewall uses server-only stub (no runtime deps)
#   - Astro/Next builds are static — no request-time secrets
#   - Security scanner runs on push AND pull_request (full lockfile)
#   - dependency-review-action only runs on pull_request (PR diff)
#
# Note: SEO Guard CI (.github/workflows/seo-guard.yml) remains as a
# legacy single-job fallback for older branch protection configs.
# New branches should require this ci-build-guard instead.

name: CI Build Guard

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  schedule:
    # Daily at 03:00 UTC. Catches production drift within 24h.
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Allow manual run for staging validation or emergency checks.
    inputs:
      host:
        description: 'Production host to audit (default: https://brightai.live)'
        required: false
        default: 'https://brightai.live'
      sample:
        description: 'Number of pages to sample from sitemap (default: 200, 0 = all)'
        required: false
        default: '200'

concurrency:
  # Cancel in-progress runs when a new commit lands on the same PR/branch.
  # Saves CI minutes on stacked commits.
  group: ci-build-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Explicitly NO write/secrets permissions — runs must be safe on public PRs.

# Prevent the same job from queuing infinitely on a misconfigured runner.
concurrency-group-timeout: 15m

jobs:
  # ────────────────────────────────────────────────────────────────
  # Job 1: Install + Prisma Generate
  # Foundational. All other jobs depend on this.
  # Verifies:
  #   - pnpm-lock.yaml is in sync (frozen install must succeed)
  #   - Prisma client can be generated from schema.prisma
  # ────────────────────────────────────────────────────────────────
  install:
    name: Install + Prisma Generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack + Activate pnpm
        uses: pnpm/action-setup@v4
        with:
          # Uses the version from package.json `packageManager` field.
          # No manual version drift between local dev and CI.
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @brightai/db db:generate

      - name: Verify Prisma client generated
        run: |
          test -d node_modules/.pnpm/@prisma+client@5.22.0_prisma@5.22.0/node_modules/.prisma/client \
            && echo "✅ Prisma client generated" \
            || (echo "❌ Prisma client NOT generated"; exit 1)

      - name: Verify Prisma schema ↔ generated client drift
        # BAI-P1-TYPES-001: every model/enum in schema.prisma must have a
        # matching export in the generated @prisma/client. Catches the
        # exact TS2305 drift class that broke typecheck on a clean clone.
        run: pnpm verify:prisma:drift

  # ────────────────────────────────────────────────────────────────
  # Job 2: TypeScript Typecheck (all workspaces)
  # Catches: type errors, missing fields, schema drift.
  # Fast (~30s) and rejects bad code early.
  # ────────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript Typecheck (root + dashboard + db)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version-file: '.node-version' }
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter @brightai/db db:generate
      - run: pnpm -r --parallel typecheck

  # ────────────────────────────────────────────────────────────────
  # Job 3: Lint (ESLint across workspaces)
  # Catches: unused vars, React anti-patterns, type-only ESLint rules.
  # ────────────────────────────────────────────────────────────────
  lint:
    name: ESLint (root + dashboard)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version-file: '.node-version' }
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter @brightai/db db:generate
      - run: pnpm -r --parallel lint
      # P0-1 (2026-07-18): forbid dbServiceRole in dashboard read paths
      # (tenant isolation via RLS). Allowlist enforced in the script.
      - name: RLS allowlist lint
        run: pnpm lint:rls

  # ────────────────────────────────────────────────────────────────
  # Job 4: Vitest — ALL workspaces (firewall + detectors + lead-queue + db:rls + root)
  # Verifies: regex, redaction, token vault, PII detector, NER pipeline
  #   (2s cold start), durable audit, hash chain, RLS isolation (DB),
  #   cross-tenant leak, chat session, CSRF.
  # P0-2 (2026-07-19): replaced the firewall-only job with the full
  #   workspace test suite. Requires Postgres service container for
  #   db:rls:test.
  # ────────────────────────────────────────────────────────────────
  test-all:
    name: "Vitest — all workspaces (firewall + detectors + lead-queue + db:rls + root)"
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brightai
          POSTGRES_PASSWORD: brightai
          POSTGRES_DB: brightai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Use the service container's DB. App + service roles for RLS test.
      DATABASE_URL: postgresql://brightai:brightai@localhost:5432/brightai_test
      DATABASE_URL_SERVICE: postgresql://brightai:brightai@localhost:5432/brightai_test
      DATABASE_URL_APP: postgresql://brightai:brightai@localhost:5432/brightai_test
      DIRECT_URL: postgresql://brightai:brightai@localhost:5432/brightai_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version-file: '.node-version' }
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter @brightai/db db:generate
      - name: Create RLS roles + dev DB (mirror local setup)
        env:
          PGPASSWORD: brightai
        run: |
          psql -U brightai -d brightai_test -h localhost <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'brightai_app') THEN
              CREATE ROLE brightai_app NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'brightai_service') THEN
              CREATE ROLE brightai_service NOLOGIN BYPASSRLS;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'brightai_readonly') THEN
              CREATE ROLE brightai_readonly NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'brightai_admin') THEN
              CREATE ROLE brightai_admin NOLOGIN BYPASSRLS;
            END IF;
            GRANT brightai_app, brightai_service, brightai_readonly, brightai_admin TO brightai;
          END
          $$;
          SQL
      - name: Apply Prisma schema + RLS policies
        env:
          PGPASSWORD: brightai
        run: |
          # P0-2 (2026-07-19): use `prisma db push` instead of `migrate deploy`
          # because the existing migrations have a pre-existing FK bug
          # (reference "Organization" PascalCase instead of "organizations"
          # snake_case — see packages/db/prisma/migrations/20260715000000_ai_usage_entries/migration.sql).
          # db push is fine for the CI test DB (it's ephemeral).
          # Tracked as a follow-up: fix the migration FK bug separately.
          pnpm exec prisma db push --schema=./packages/db/prisma/schema.prisma --skip-generate --accept-data-loss
          psql -U brightai -d brightai_test -h localhost -v ON_ERROR_STOP=1 -f packages/db/prisma/policies/rls.sql
      - name: Run all workspace tests
        run: pnpm -r test
      - name: Run root chat-session + CSRF tests
        run: |
          pnpm test:chat-session
          pnpm test:csrf
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-all-failure-logs
          path: |
            packages/db/test-results/
            packages/firewall-detectors/test-results/
            packages/lead-queue/test-results/
            apps/dashboard/test-results/
          retention-days: 7

  # ────────────────────────────────────────────────────────────────
  # Job 5: Astro Marketing Build (190 pages)
  # The public marketing site. Generates dist/ + sitemap.
  # ────────────────────────────────────────────────────────────────
  build-astro:
    name: Astro Marketing Build (~190 pages)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version-file: '.node-version' }
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Sync solution FAQ schema
        run: pnpm run schema:solutions:sync
      - name: Sync docs HowTo schema
        run: pnpm run schema:docs:sync
      - name: Build Astro marketing site
        run: pnpm run build
        env:
          NODE_ENV: production
      - name: Verify build output
        run: |
          test -d dist \
            && echo "✅ dist/ generated" \
            || (echo "❌ dist/ missing"; exit 1)
          echo "📊 Page count: $(find dist -name 'index.html' | wc -l)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-astro
          path: dist
          retention-days: 7

  # ────────────────────────────────────────────────────────────────
  # Job 6: Dashboard Build (Next.js 15)
  # The SaaS dashboard. 22 routes + middleware.
  # ────────────────────────────────────────────────────────────────
  build-dashboard:
    name: Dashboard Build (Next.js 15, ~22 routes)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version-file: '.node-version' }
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter @brightai/db db:generate
      - name: Build Next.js dashboard
        run: pnpm dashboard:build
        env:
          NODE_ENV: production
      - name: Verify build output
        run: |
          test -f apps/dashboard/.next/BUILD_ID \
            && echo "✅ BUILD_ID present" \
            || (echo "❌ BUILD_ID missing"; exit 1)
          echo "📊 Routes: $(ls apps/dashboard/.next/server/app/api 2>/dev/null | wc -l || echo 0) api dirs"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-dashboard
          path: apps/dashboard/.next
          retention-days: 7

  # ────────────────────────────────────────────────────────────────
  # Job 7: SEO + Content + Performance Gates
  # Runs after build-astro (needs dist/).
  # Pure static analysis: sitemap, JSON-LD, schema, content, links,
  # redirects, performance budget. No DB needed.
  # ────────────────────────────────────────────────────────────────
  seo-gates:
    name: SEO + Content + Performance Gates
    needs: build-astro
    runs-on: ubuntu-latest
    # BAI-PERF-03 (2026-07-25): lhci:collect adds ~3-5min for 21 URLs x 3 runs.
    # Budget raised 12 -> 18min to absorb the Lighthouse scans safely.
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version-file: '.node-version' }
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Sync solution FAQ schema
        run: pnpm run schema:solutions:sync
      - name: Sync docs HowTo schema
        run: pnpm run schema:docs:sync
      - run: pnpm run build
        env:
          NODE_ENV: production
      - name: Full verification (sitemap, schema, gate)
        run: pnpm run verify:all
      - name: Performance budget
        run: pnpm run performance:budget
      - name: Internal links audit
        run: pnpm run internal-links:audit
      - name: Redirects check
        run: pnpm run redirects:check
      # BAI-PERF-03 (2026-07-25): Lighthouse CI gate.
      # lhci:collect runs Lighthouse 3x on 21 URLs from .lighthouserc.json
      # (desktop preset). lhci:assert enforces the budgets declared in
      # .lighthouserc.json (LCP <=2500ms = error, INP/CLS/SI = warn).
      # Desktop-only -- mobile measurement uses PSI in production
      # (see report/2026-07-25-bai-perf-03-ci-lhci-gate.md for rationale).
      - name: Lighthouse CI collect
        run: pnpm run lhci:collect
        env:
          # Bump per-process memory for 21 URLs x 3 runs without OOM.
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Lighthouse CI assert (LCP budget gate)
        run: pnpm run lhci:assert
      - name: Upload Lighthouse reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            .lighthouseci/
            reports/lighthouse/
          retention-days: 7

  # ────────────────────────────────────────────────────────────────
  # Job 8: Internal Links Audit (BAI-LINK-06)
  # Runs linkinator on the built dist/ output to catch broken internal links.
  # Uses the existing `links:dist` script from package.json.
  # ────────────────────────────────────────────────────────────────
  links-dist:
    name: Internal Links Audit (dist/)
    needs: build-astro
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version-file: '.node-version' }
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-astro
          path: dist
      - name: Run linkinator on dist/
        run: pnpm run links:dist

  # ────────────────────────────────────────────────────────────────
  # Job 9: Dependency Security Scan (HIGH-08 / IP-09)
  # Scans pnpm-lock.yaml for known CVEs.
  #   - Fails on critical/high severity (no exceptions, no warnings)
  #   - Warns on medium severity (annotations, does NOT fail CI)
  #   - Allowlist: .github/security-allowlist.yml (must be valid YAML,
  #     no expired entries, no duplicates, all required fields)
  # Two scanners run in parallel:
  #   1. anchore/scan-action@v3 (full lockfile scan via Grype/OSV)
  #   2. actions/dependency-review-action@v4 (PR-only diff scan)
  # SARIF results upload to GitHub Security tab for code-scanning alerts.
  # ────────────────────────────────────────────────────────────────
  security-scan:
    name: Dependency Security Scan
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      # Required for actions/dependency-review-action to read PR diff
      pull-requests: read
      # Required for github/codeql-action to upload SARIF
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack + Activate pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install (frozen lockfile)
        # Mirrors install job — needed because anchore/scan-action
        # reads the lockfile alongside node_modules for transitive resolution.
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Validate security allowlist (no expired / malformed entries)
        # Pre-flight check before scanning. Ensures:
        #   - File exists
        #   - YAML parses (Python is preinstalled on ubuntu-latest)
        #   - Every expires: date is in the future
        #   - No duplicate IDs across entries
        # Fails CI BEFORE scanning — saves 1-2 min on bad allowlist PRs.
        run: |
          set -euo pipefail
          ALLOWLIST=".github/security-allowlist.yml"
          echo "::group::Validating $ALLOWLIST"

          if [ ! -f "$ALLOWLIST" ]; then
            echo "::error title=Allowlist missing::$ALLOWLIST does not exist. CI cannot validate exceptions."
            exit 1
          fi

          # 1. YAML syntax check
          python3 -c "import yaml,sys; yaml.safe_load(open('$ALLOWLIST'))" \
            || (echo "::error title=Allowlist YAML invalid::$ALLOWLIST is not valid YAML"; exit 1)
          echo "✅ YAML syntax valid"

          # 2. Expiration check
          TODAY=$(date -u +%Y-%m-%d)
          EXPIRED_COUNT=0
          while IFS= read -r line; do
            if [[ "$line" =~ ^[[:space:]]*expires:[[:space:]]*[\"']([0-9-]+)[\"'] ]]; then
              EXP_DATE="${BASH_REMATCH[1]}"
              if [[ "$EXP_DATE" < "$TODAY" ]]; then
                echo "::error title=Allowlist expired::Entry with expires=$EXP_DATE is past today=$TODAY. Remove or renew."
                EXPIRED_COUNT=$((EXPIRED_COUNT + 1))
              else
                echo "✅ Allowlist entry expires: $EXP_DATE"
              fi
            fi
          done < "$ALLOWLIST"
          if [ "$EXPIRED_COUNT" -gt 0 ]; then
            echo "::error title=Allowlist has expired entries::$EXPIRED_COUNT entries need renewal or removal."
            exit 1
          fi

          # 3. Required-fields check + duplicate ID check
          python3 <<'PYEOF' || exit 1
          import yaml, sys, re
          from collections import Counter
          from datetime import date, datetime

          with open('.github/security-allowlist.yml') as f:
              data = yaml.safe_load(f) or {}

          exceptions = data.get('exceptions', []) or []
          if not isinstance(exceptions, list):
              print('::error title=Allowlist shape::exceptions must be a list')
              sys.exit(1)

          ids = []
          sev_ok = {'critical', 'high', 'medium', 'low'}
          id_pat = re.compile(r'^(CVE-\d{4}-\d{4,}|GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4})$')
          today = date.today()

          for i, e in enumerate(exceptions):
              missing = [k for k in ('id','package','severity','justification','expires') if not e.get(k)]
              if missing:
                  print(f'::error title=Allowlist entry #{i}::missing required fields: {missing}')
                  sys.exit(1)
              if e['severity'] not in sev_ok:
                  print(f'::error title=Allowlist entry {e["id"]}::severity must be one of {sev_ok}, got "{e["severity"]}"')
                  sys.exit(1)
              if not id_pat.match(e['id']):
                  print(f'::error title=Allowlist entry #{i}::id "{e["id"]}" does not match CVE-YYYY-NNNN or GHSA-xxxx-xxxx-xxxx')
                  sys.exit(1)
              try:
                  exp = datetime.strptime(e['expires'], '%Y-%m-%d').date()
              except ValueError:
                  print(f'::error title=Allowlist entry {e["id"]}::expires "{e["expires"]}" not YYYY-MM-DD')
                  sys.exit(1)
              if exp <= today:
                  print(f'::error title=Allowlist entry {e["id"]}::expires {e["expires"]} is not in the future (today={today.isoformat()})')
                  sys.exit(1)
              ids.append(e['id'])

          dup = [k for k,v in Counter(ids).items() if v > 1]
          if dup:
              print(f'::error title=Allowlist duplicates::duplicate CVE IDs: {dup}')
              sys.exit(1)

          print(f'✅ {len(exceptions)} allowlist entries validated (no expired, no duplicates, all fields present)')
          PYEOF

          echo "::endgroup::"

      - name: Run vulnerability scan on pnpm-lock.yaml
        # anchore/scan-action uses Grype (backed by OSV + NVD data).
        # Scans the WHOLE lockfile (all transitive deps), not just direct deps.
        # severity-cutoff=high means: fail on critical OR high, warn on medium/low.
        uses: anchore/scan-action@v3
        with:
          path: "."
          scan-type: "lockfile"
          target: "pnpm-lock.yaml"
          fail-build: true
          severity-cutoff: high
          output-format: "sarif"
          # Disable Anchore registry auth (we don't publish SBOMs there)
          # and skip Docker scanning (this is a static site / Node app).

      - name: Upload SARIF to GitHub Security tab
        # Even if scan fails, we want the SARIF uploaded for forensics.
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: anchore-reports/sarif-result.sarif
          category: anchore-lockfile-scan

      - name: Dependency review (PR-only — diff scanning)
        # Scans ONLY the dependency diff (added/updated/removed packages in the PR).
        # Complements anchore (which scans the whole lockfile): catches new CVEs
        # before they're merged. Runs ONLY on pull_request events (skip on push).
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # No license restrictions — too noisy for a marketing site.
          # Show OSSF Scorecard would be nice but adds ~30s; skip for now.
          show-openssf-scorecard: false
          # Don't fail on scope changes (we're not building/publishing from PRs).
          fail-on-scopes: ''

  # ────────────────────────────────────────────────────────────────
  # Job 10: Hreflang Live Audit (BAI-IDX-14)
  # Production drift detection. Fetches live HTML via Playwright
  # and validates the 5 hreflang contracts:
  #   1. Self hreflang on every page
  #   2. Return link to counterpart (reciprocity)
  #   3. x-default does not point to /en/
  #   4. EN pages have en-SA=self + ar-SA return
  #   5. AR-only pages don't invent en-SA
  #
  # Triggers: push (post-deploy smoke test) + schedule (daily 03:00
  # UTC) + workflow_dispatch (manual staging validation).
  # Pull requests are secrets-free (uses public brightai.live URL).
  # ────────────────────────────────────────────────────────────────
  hreflang-live:
    name: Hreflang Live Audit (production)
    needs: [build-astro]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        host:
          - ${{ github.event.inputs.host || 'https://brightai.live' }}
    env:
      PROD_HOST: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack + Activate pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run live hreflang audit
        run: |
          node scripts/hreflang-bidirectional-audit.mjs \
            --live \
            --host="${{ env.PROD_HOST }}" \
            --sample="${{ github.event.inputs.sample || '200' }}" \
            --concurrency=10 \
            --report="report/hreflang-live-$(date -u +%Y%m%dT%H%M%SZ).json"
        continue-on-error: false

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hreflang-live-report-${{ matrix.host }}
          path: report/hreflang-live-*.json
          retention-days: 30

  # ────────────────────────────────────────────────────────────────
  # Job 11: CI Success Gate
  # Aggregates all jobs. Fails if any job failed/cancelled.
  # This is the single required status check for branch protection.
  # ────────────────────────────────────────────────────────────────
  ci-success:
    name: CI Build Guard
    needs:
      - typecheck
      - lint
      - test-all
      - build-astro
      - build-dashboard
      - seo-gates
      - security-scan
      - hreflang-live
      - links-dist
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Aggregate CI results
        run: |
          echo "## CI Build Guard Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| typecheck | ${{ needs.typecheck.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| lint | ${{ needs.lint.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| test-all | ${{ needs.test-all.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| build-astro | ${{ needs.build-astro.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| build-dashboard | ${{ needs.build-dashboard.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| seo-gates | ${{ needs.seo-gates.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| security-scan | ${{ needs.security-scan.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| hreflang-live | ${{ needs.hreflang-live.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| links-dist | ${{ needs.links-dist.result }} |" >> "$GITHUB_STEP_SUMMARY"

          # Fail if any required job did not succeed.
          # Direct GitHub Actions expressions (no bash loop interpolation).
          failed=0
          for job in typecheck lint test-all build-astro build-dashboard seo-gates security-scan hreflang-live links-dist; do
            case "$job" in
              typecheck)       r="${{ needs.typecheck.result }}" ;;
              lint)            r="${{ needs.lint.result }}" ;;
              test-all)        r="${{ needs.test-all.result }}" ;;
              build-astro)     r="${{ needs.build-astro.result }}" ;;
              build-dashboard) r="${{ needs.build-dashboard.result }}" ;;
              seo-gates)       r="${{ needs.seo-gates.result }}" ;;
              security-scan)   r="${{ needs.security-scan.result }}" ;;
              hreflang-live)   r="${{ needs.hreflang-live.result }}" ;;
              links-dist)      r="${{ needs.links-dist.result }}" ;;
            esac
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "❌ CI FAILED at job: $job (result: $r)"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "✅ All CI jobs passed."