# ═══════════════════════════════════════════════════════════════════
# BrightAI — Local Dev Stack
# ═══════════════════════════════════════════════════════════════════
#
# Run:   docker compose up -d
# Stop:  docker compose down
# Reset: docker compose down -v  (wipes Postgres data + Redis)
#
# What's here:
#   - postgres:16  — main DB (port 5432)
#   - redis:7      — sessions + rate limiting (port 6379)
#   - mailhog:1.0  — dev email catcher (SMTP 1025, UI 8025)
#   - brightai-site — marketing site (DOCKER-001, 2026-07-15)
#
# Credentials match packages/db/scripts/setup-local-db.mjs and the
# .env.example. Keep in sync.
# ═══════════════════════════════════════════════════════════════════

services:
  postgres:
    image: postgres:16-alpine
    container_name: brightai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: brightai_admin
      POSTGRES_PASSWORD: brightai_admin
      POSTGRES_DB: brightai_dev
      # Locale-friendly defaults for Arabic collation
      LANG: en_US.utf8
      LC_ALL: en_US.utf8
    ports:
      - "5432:5432"
    volumes:
      - brightai-postgres-data:/var/lib/postgresql/data
      # Init script runs once on first start — creates the brightai_app
      # and brightai_service roles with the right BYPASSRLS flags.
      # setup-local-db.mjs then grants schema privileges.
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightai_admin -d brightai_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: brightai-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - brightai-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: brightai-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI: http://localhost:8025

  # DOCKER-001 (2026-07-15): marketing site (Astro hybrid + Node adapter).
  # Uses local Dockerfile. For production deploys, prefer Render or
  # other cloud platforms (this service is for local dev + air-gapped).
  brightai-site:
    build:
      context: .
      dockerfile: Dockerfile
    image: brightai/marketing-site:local
    container_name: brightai-site
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:10000"  # host 3000 → container 10000 (matches Render PORT)
    environment:
      # AI provider keys (required for /api/ai/chat/ and /api/lead/).
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Lead webhook (optional — leads queue in-memory if unset).
      LEAD_WEBHOOK_URL: ${LEAD_WEBHOOK_URL:-}
      LEAD_WEBHOOK_SECRET: ${LEAD_WEBHOOK_SECRET:-}
      # CSRF (CSRF-LEAD-001): generate with `openssl rand -hex 32`.
      CSRF_SECRET: ${CSRF_SECRET:-dev-only-replace-in-prod-32chars-min-aaaa}
      # Proxy trust (Render/Cloudflare).
      TRUSTED_PROXY_COUNT: "1"
      # Database (uncomment when wiring dashboard to local Postgres).
      # DATABASE_URL: postgresql://brightai_admin:brightai_admin@postgres:5432/brightai_dev
      # Redis (rate limiting + chat session store).
      # REDIS_URL: redis://redis:6379
    healthcheck:
      # /api/health/ is server-rendered (prerender=false) so this catches
      # real Node SSR outages, matching render.yaml healthCheckPath.
      test: ["CMD", "wget", "-qO-", "http://localhost:10000/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  brightai-postgres-data:
    driver: local
  brightai-redis-data:
    driver: local
