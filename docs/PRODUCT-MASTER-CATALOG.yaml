minimum_global_acceptance:
- id: CAT-AC-01
  rule_ar: شراء منتج منفرد يتيح وظيفته الأساسية دون ترخيص أي منتج آخر.
- id: CAT-AC-02
  rule_ar: منع سياسة مؤسسة عليا لا يستطيع نموذج أو سياسة أدنى تجاوزها.
- id: CAT-AC-03
  rule_ar: عدم نقل الطلب لمزود أو نموذج أو منطقة معالجة غير مصرح بها عند فشل الأساسي.
- id: CAT-AC-04
  rule_ar: الموافقات الحرجة لا تتنفذ دون موافقة صالحة وموثقة؛ انتهاء المهلة آمن.
- id: CAT-AC-05
  rule_ar: حفظ دليل Ledger قابل للتصدير والتحقق، وفشل التحقق بعد التلاعب.
- id: CAT-AC-06
  rule_ar: فشل التخزين الإلزامي الرئيسي والبديل يوقف الأعمال التي تتطلب أدلة محمية.
- id: CAT-AC-07
  rule_ar: عزل بيانات مؤسسة عن الأخرى في جميع طبقات الخدمة.
- id: CAT-AC-08
  rule_ar: Trial ينتهي بعد 48 ساعة دون خصم أو تحويل تلقائي مدفوع.
- id: CAT-AC-09
  rule_ar: حدود الإنفاق وحصص الاستخدام والفوترة تعالج التكرار دون احتساب غير مبرر.
- id: CAT-AC-10
  rule_ar: بيئة Air-Gapped تعمل بالكامل دون اتصال خارجي أو Cloud License Check.
- id: CAT-AC-11
  rule_ar: وصول الدعم لا يحدث دون تصريح مؤقت محدد ومراقب من الجهة.
- id: CAT-AC-12
  rule_ar: استيراد السياسات يجري أولاً Dry Run ومراجعة ثم موافقة قبل الإنفاذ.
- id: CAT-AC-13
  rule_ar: دقة محتوى التسويق والأسعار والشهادات مرتبطة بأدلة واعتمادات حقيقية.
- id: CAT-AC-14
  rule_ar: عدم استخدام بيانات العميل لتدريب أو تحسين أي نموذج AI لدى BRIGHT AI أو مورديه.
