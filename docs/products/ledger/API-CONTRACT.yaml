openapi: 3.1.0
info:
  title: AIGAS Ledger — Proposed API Contract (NOT DEPLOYED)
  version: 1.0.0-draft
  description: عقد تصميم مستهدف لـ AIGAS Ledger؛ جميع مساراته مقترحة وليست إثباتًا على وجود API عاملة. بيانات العميل
    Metadata افتراضيًا، مع اختبارات صلاحية وعزل وسلامة تدقيق.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
- url: https://api.aigas.invalid
  description: Placeholder .invalid فقط؛ لا خادم حقيقي ولا عنوان منشور
x-contract-state: PROPOSED_NOT_IMPLEMENTED_OR_VERIFIED
x-product-id: AIGAS-LD
x-source-requirements:
- LD-01
- LD-02
- LD-03
- LD-04
- LD-05
- LD-06
- LD-07
x-security-contract:
  kernel_required: true
  kernel_fee_separate: false
  tenant_id_from_verified_token: true
  avoid_customer_raw_content_by_default: true
  privacy_no_training: true
  signed_export_profile_unapproved: true
  authz_scopes_are_design_candidates: true
  fail_closed_on_mandatory_ledger_loss: true
  independent_export_verifier_required: true
  no_assumption_of_blockchain: true
security: &id001
- BearerAuth: []
paths:
  /v1/ledger/events:
    post:
      tags:
      - Events
      summary: تسجيل حدث مؤسسي موثق
      operationId: ingestEvidenceEvent
      description: إقرار durable only after valid persistence; protected fallback identified explicitly; fail closed
        for mandatory events if both paths fail.
      x-required-permission: ledger.event.ingest
      x-tenant-scope: derived from verified identity, never from caller-supplied tenant_id
      security: *id001
      responses:
        '201':
          description: النتيجة المصرح بها
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordReceipt'
        '400':
          description: BAD_REQUEST / schema invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: FORBIDDEN / tenant or scope denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: NOT_FOUND (no cross-tenant enumeration)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: CONFLICT / policy version or idempotency collision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: POLICY_REJECTED / sensitive content, legal hold, or semantic constraints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: RATE_LIMITED / quota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: MANDATORY_AUDIT_UNAVAILABLE / critical signing/storage dependency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventIngestRequest'
      parameters:
      - &id003
        name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
        description: إعادة نفس الطلب بنفس المفتاح لا تعيد الأثر أو الفاتورة
    get:
      tags:
      - Events
