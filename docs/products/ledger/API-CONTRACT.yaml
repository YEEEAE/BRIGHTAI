components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token from approved Kernel identity; actual protocol and federation not yet decided
  schemas:
    Error:
      type: object
      description: خطأ منظّم لا يكشف محتوى العميل
      properties:
        code:
          type: string
          description: رمز آلي معروف
        message:
          type: string
          description: شرح مختصر غير حساس
        correlation_id:
          type: string
          description: مرجع تحقيق
        retryable:
          type: boolean
          description: قابل لإعادة المحاولة؟
      additionalProperties: false
      required:
      - code
      - message
      - correlation_id
      - retryable
    PolicyReference:
      type: object
      description: مرجع سياسة مُعتمدة
      properties:
        policy_id:
          type: string
          description: معرف سياسة
        version:
          type: string
          description: نسخة سياسة
      additionalProperties: false
      required:
      - policy_id
      - version
    SourceReference:
      type: object
      description: مصدر الفعل بعد مصادقة النظام
      properties:
        source_event_ref:
          type: string
          description: معرف حدث النظام المصدر
        source_system:
          type: string
          description: خدمة/تطبيق مفوّض
        action_ref:
          type: string
          description: مرجع العملية
      additionalProperties: false
      required:
      - source_system
      - source_event_ref
    EventIngestRequest:
      type: object
      description: لا يحتوي tenant_id أو actor identity قابلة للتزوير؛ تُستمد من مصادقة Kernel
      properties:
        source:
          $ref: '#/components/schemas/SourceReference'
        event_type:
          type: string
          description: نوع حدث من قائمة معتمدة
        occurred_at:
          type: string
          description: وقت حدوث الحدث وفق المصدر مع إثبات مصدر الوقت
          format: date-time
        correlation_id:
          type: string
          description: مرجع سلسلة عمليات دون بيانات حساسة
        policy:
          $ref: '#/components/schemas/PolicyReference'
        decision_ref:
          type: string
          description: معرف قرار متعلق إن وجد
        actor_ref:
          type: string
          description: مرجع هوية مُمثل بعد تحقق مصدره
        classification:
          type: string
          description: مستوى التصنيف المسموح
          enum:
          - PUBLIC
          - INTERNAL
          - CONFIDENTIAL
          - RESTRICTED
        metadata:
          type: object
          description: بيانات وصفية بسيطة وwhitelist؛ لا prompts أو secrets
          additionalProperties:
            type:
            - string
            - integer
            - number
            - boolean
            - 'null'
        mandatory_record:
          type: boolean
          description: تصنيف العمل كتسجيل إلزامي تُثبته سياسة الخادم؛ لا يمنح الحقل المستدعي سلطة تخطي السياسة
      additionalProperties: false
      required:
      - source
      - event_type
      - occurred_at
      - correlation_id
      - classification
      - metadata
    RecordReceipt:
      type: object
      description: إقرار المتانة المحدد المعنى، ليس مجرد 202 HTTP
      properties:
        receipt_id:
          type: string
          description: معرف الإقرار
        event_id:
          type: string
          description: معرف الحدث
        recorded_at:
          type: string
          description: وقت اعتماد الإيداع
          format: date-time
        persistence_state:
          type: string
          description: نتيجة إيداع فعلية
          enum:
          - DURABLY_RECORDED
          - PROTECTED_FALLBACK
          - NOT_RECORDED
        integrity_profile:
          type: string
          description: معرف إصدار التحقق
        sequence_ref:
          type: string
          description: مرجع التسلسل إن كان معتمدًا
        idempotency_replayed:
          type: boolean
          description: الإعادة استرجعت نفس الإقرار
      additionalProperties: false
      required:
      - receipt_id
      - event_id
      - recorded_at
      - persistence_state
      - idempotency_replayed
    EvidenceEvent:
      type: object
      description: ملف حدث مختزل قابل للقراءة المفوضة
      properties:
        event_id:
          type: string
          description: معرف الخادم
        recorded_at:
          type: string
          description: وقت الاستلام الموثوق
          format: date-time
        event_type:
          type: string
          description: نوع الحدث
        source:
          $ref: '#/components/schemas/SourceReference'
        correlation_id:
          type: string
          description: مرجع عملية
        policy:
          $ref: '#/components/schemas/PolicyReference'
        decision_ref:
          type: string
          description: مرجع قرار إن وجد
        classification:
          type: string
          description: درجة حساسية
        integrity_receipt:
          $ref: '#/components/schemas/RecordReceipt'
        metadata:
          type: object
          description: حقول مختزلة ومسموحة
          additionalProperties: true
      additionalProperties: false
      required:
      - event_id
      - recorded_at
      - event_type
      - source
      - correlation_id
      - classification
      - integrity_receipt
    EventPage:
      type: object
      description: صفحة نتائج ضمن Tenant المصدق
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceEvent'
        next_cursor:
          type: string
          description: cursor قابل للتجاهل وعدم كشف بنية المخزن
      additionalProperties: false
      required:
      - items
    IntegrityResult:
      type: object
      description: نتيجة فحص خادم تشخيصية؛ الفحص المستقل يتم في أداة خارج الخادم
      properties:
        event_id:
          type: string
          description: معرّف الحدث
        result:
          type: string
          description: حالة مفصلة
          enum:
          - VALID
          - INVALID
          - INDETERMINATE
          - UNTRUSTED_SOURCE
          - KEY_UNAVAILABLE
        verification_profile:
          type: string
          description: طريقة التحقق وإصدارها
        checked_at:
          type: string
          description: وقت الفحص
          format: date-time
        reason_code:
          type: string
          description: السبب التقني غير الحساس
      additionalProperties: false
      required:
      - event_id
      - result
      - checked_at
      - reason_code
    ExportRequest:
      type: object
      description: نطاق تصدير مُصرح به، لا توجد صيغة تصدير عامة بلا صلاحية
      properties:
        event_ids:
          type: array
          items:
            type: string
          minItems: 1
        reason:
          type: string
          description: مبرر التصدير غير حساس
        format:
          type: string
          description: صيغة الحزمة بعد اعتماد معيارها
          enum:
          - EVIDENCE_BUNDLE_V1
        include_sensitive_content:
          type: boolean
          description: رفض افتراضي؛ يتطلب موافقة مستقلة إن توفرت
          default: false
      additionalProperties: false
      required:
      - event_ids
      - reason
      - format
    ExportJob:
      type: object
      description: مهمة إعداد حزمة تدقيق
      properties:
        export_id:
          type: string
          description: معرف الحزمة
        status:
          type: string
          description: حالة التحضير
          enum:
          - PENDING
          - RUNNING
          - READY
          - FAILED
          - EXPIRED
        created_at:
          type: string
          description: وقت الطلب
          format: date-time
        manifest_ref:
          type: string
          description: مرجع manifest عند اكتمالها
        failure_reason:
          type: string
          description: سبب الفشل غير الحساس
      additionalProperties: false
      required:
      - export_id
      - status
      - created_at
    RetentionPolicy:
      type: object
      description: سياسة لكل Tenant وفئة؛ المدد غير معتمدة عالميًا
      properties:
        policy_id:
          type: string
          description: معرف سياسة
        version:
          type: string
          description: نسخة معتمدة
        rules:
          type: array
          items:
            type: object
            description: قاعدة احتفاظ
            properties:
              data_class:
                type: string
                description: فئة البيانات
              retention_period:
                type: string
                description: ISO 8601 duration بعد الاعتماد أو policy reference
              deletion_action:
                type: string
                description: حذف/إخفاء/إتلاف بحسب الصنف
              legal_basis_ref:
                type: string
                description: مرجع السبب/الاعتماد
            additionalProperties: false
            required:
            - data_class
            - retention_period
            - deletion_action
        updated_at:
          type: string
          description: وقت الاعتماد
          format: date-time
      additionalProperties: false
      required:
      - policy_id
      - version
      - rules
    RetentionUpdateRequest:
      type: object
      description: تحديث سياسة مع تحقق صلاحية وIf-Match
      properties:
        rules:
          $ref: '#/components/schemas/RetentionPolicy'
        reason:
          type: string
          description: سبب تعديل مكتوب
        approval_ref:
          type: string
          description: مرجع موافقة مخولة
      additionalProperties: false
      required:
      - rules
      - reason
      - approval_ref
    LegalHoldCreate:
      type: object
      description: تجميد قانوني محدد لا يشمل كل المؤسسة افتراضيًا
      properties:
        case_ref:
          type: string
          description: مرجع قضية مفوض غير حساس
        scope_event_ids:
          type: array
          items:
            type: string
          minItems: 1
        legal_basis_ref:
          type: string
          description: الأساس المعتمد
        approver_ref:
          type: string
          description: مرجع موافقة مستقلة
        reason:
          type: string
          description: سبب مختصر غير حساس
      additionalProperties: false
      required:
      - case_ref
      - scope_event_ids
      - legal_basis_ref
      - approver_ref
      - reason
    LegalHold:
      type: object
      description: سجل Legal Hold قابل للمراجعة
      properties:
        hold_id:
          type: string
          description: معرف التجميد
        case_ref:
          type: string
          description: القضية
        status:
          type: string
          description: الحالة
          enum:
          - ACTIVE
          - RELEASED
        scope_event_ids:
          type: array
          items:
            type: string
        created_at:
          type: string
          description: وقت الإجراء
          format: date-time
        released_at:
          type: string
          description: وقت الرفع إن حدث
          format: date-time
      additionalProperties: false
      required:
      - hold_id
      - case_ref
      - status
      - scope_event_ids
      - created_at
    HoldReleaseRequest:
      type: object
      description: تسجيل رفع تجميد مخول
      properties:
        reason:
          type: string
          description: السبب
        approval_ref:
          type: string
          description: الموافقة المستقلة
      additionalProperties: false
      required:
      - reason
      - approval_ref
    EvidenceLinkCreate:
      type: object
      description: ربط دليل بسياق آخر دون إعادة كتابة الأصل
      properties:
        event_id:
          type: string
          description: معرف دليل من نفس المستأجر
        relation_type:
          type: string
          description: نوع علاقة
          enum:
          - APPROVAL
          - INCIDENT
          - RISK_ASSESSMENT
          - CONTROL
          - AI_ACTION
        target_ref:
          type: string
          description: مرجع الهدف ضمن المستأجر
        reason:
          type: string
          description: سبب الربط
      additionalProperties: false
      required:
      - event_id
      - relation_type
      - target_ref
    EvidenceLink:
      type: object
      description: نتيجة إنشاء علاقة منفصلة مدققة
      properties:
        link_id:
          type: string
          description: معرف العلاقة
        event_id:
          type: string
          description: الأصل
        relation_type:
          type: string
          description: نوع العلاقة
        target_ref:
          type: string
          description: المرجع
        created_at:
          type: string
          description: وقت الربط
          format: date-time
      additionalProperties: false
      required:
      - link_id
      - event_id
      - relation_type
      - target_ref
      - created_at
    HealthStatus:
      type: object
      description: صحة المسارات لا تعني صلاحية إطلاق المنتج
      properties:
        recording_mode:
          type: string
          description: حالة المسار
          enum:
          - PRIMARY
          - PROTECTED_FALLBACK
          - MANDATORY_RECORDING_UNAVAILABLE
        can_record_mandatory:
          type: boolean
          description: إمكان حفظ الأحداث الإلزامية
        observed_at:
          type: string
          description: وقت المراقبة
          format: date-time
      additionalProperties: false
      required:
      - recording_mode
      - can_record_mandatory
      - observed_at
