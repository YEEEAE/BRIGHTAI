              schema:
                $ref: '#/components/schemas/ApiError'
    get:
      operationId: listOwnMessages
      summary: استرجاع ما تسمح سياسة الحفظ بإتاحته للمالك
      tags:
      - Sessions
      description: لا تتوفر الرسائل في الجلسات غير المحفوظة؛ لا تعطِ مسؤول المؤسسة حق قراءة المحتوى افتراضيًا.
      security: *id001
      x-required-permission: chat.message.read_own
