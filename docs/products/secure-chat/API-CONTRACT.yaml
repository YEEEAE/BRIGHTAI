openapi: 3.1.0
info:
  title: AIGAS Secure Chat — Proposed API Contract (NOT DEPLOYED)
  version: 1.0.0-draft
  description: مواصفة مستهدفة لا توثق API موجودة. حماية Kernel الأساسية لكل رسالة، No-Training، خصوصية متن المحادثات عن المسؤولين،
    مشاركة/تصدير مغلقان، وحدود النماذج والميزانيات.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
- url: https://api.aigas.invalid
  description: عنوان .invalid غير قابل للاستخدام، لا خدمة حقيقية منشورة
x-contract-status: DESIGN_ONLY_NOT_IMPLEMENTED_OR_VERIFIED
x-product-id: AIGAS-SC
x-source-requirements:
- SC-01
- SC-02
- SC-03
- SC-04
- SC-05
- SC-06
- SC-07
x-cross-product-rule:
  kernel_required: true
  kernel_separate_paid_license: false
  firewall_paid_license_required: false
  ledger_paid_license_required: false
  human_gate_paid_license_required: false
  risk_engine_paid_license_required: false
x-security-invariants:
  tenant_id_from_verified_identity: true
  provider_allowlist_and_region_checked_before_send: true
  no_training_at_provider: true
  no_raw_content_in_security_logs: true
  staff_content_private_from_tenant_admin_by_default: true
  sharing_default_disabled: true
  export_default_disabled: true
  output_policy_applies_before_stream_flush: true
  no_auto_fallback_to_unapproved_provider: true
  fail_closed_for_mandatory_gates: true
  no_core_RAG_or_file_upload: true
  metering_idempotency_required: true
  actual_provider_not_selected: true
x-review-required:
- Provider/Region/Contract
- No-Training evidence
- Privacy/Retention matrix
- Key management
- Token and cost limits
- Access exception roles and SoD
- DLP policy
- SSE output policy buffering
- Legal terms
security: &id001
- BearerAuth: []
paths:
  /v1/chat/models:
    get:
      operationId: listApprovedModels
      summary: النماذج المعتمدة للمستخدم
      tags:
      - Models
      description: لا تسرد خيارات خارج سياسة المستأجر أو مكان معالجة غير مخوّل؛ لا يُسحب اسم المزود من مدخل المستخدم دون سياسة.
      security: *id001
      x-required-permission: chat.model.read
      x-tenant-context: verified_identity_only
      x-evidence-status: PROPOSED_NOT_IMPLEMENTED
      responses:
        '200':
          description: نجاح مقيد بصلاحية وسياسة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '401':
          description: UNAUTHENTICATED — تفاصيل عامة دون محتوى خاص
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: FORBIDDEN — تفاصيل عامة دون محتوى خاص
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: NO_APPROVED_PROVIDER_OR_SAFETY_GATE_UNAVAILABLE — تفاصيل عامة دون محتوى خاص
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/chat/sessions:
    post:
      operationId: createChatSession
      summary: إنشاء جلسة محادثة للمستخدم
      tags:
      - Sessions
      description: تفعيل الحفظ يخضع لسياسة مستقلة؛ لا اختيار tenant في body.
      security: *id001
      x-required-permission: chat.session.create
      x-tenant-context: verified_identity_only
      x-evidence-status: PROPOSED_NOT_IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSession'
      responses:
        '201':
          description: نجاح مقيد بصلاحية وسياسة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
        '400':
          description: BAD_REQUEST — تفاصيل عامة دون محتوى خاص
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: UNAUTHENTICATED — تفاصيل عامة دون محتوى خاص
