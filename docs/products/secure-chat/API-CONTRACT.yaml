      summary: عرض جلسات المستخدم المسموح حفظها
      tags:
      - Sessions
      description: لا تعرض جلسات عابرة ephemeral؛ الإدارة لا تستطيع تعداد نصوص جلسات الأفراد.
      security: *id001
      x-required-permission: chat.session.read_own
      x-tenant-context: verified_identity_only
      x-evidence-status: PROPOSED_NOT_IMPLEMENTED
      parameters:
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        '200':
          description: نجاح مقيد بصلاحية وسياسة
