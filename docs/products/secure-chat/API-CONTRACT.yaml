      - Sessions
      description: لا يعد الحذف فوريًا إذا كان Legal Hold قائمًا، ولا يوعد بمحو نسخ احتياطية قبل دورة معتمدة.
      security: *id001
      x-required-permission: chat.session.delete_own
      x-tenant-context: verified_identity_only
      x-evidence-status: PROPOSED_NOT_IMPLEMENTED
      parameters:
      - in: path
