          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: CONFLICT — تفاصيل عامة دون محتوى خاص
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
