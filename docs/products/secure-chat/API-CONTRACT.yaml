components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'تصميم غير نهائي: رمز Tenant/Subject موثوق. scopes في x-required-permission مرشحة وتحتاج اعتمادًا.'
  schemas:
    ApiError:
      type: object
      required:
      - code
      - message
      - correlation_id
      properties:
        code:
          type: string
          enum:
          - BAD_REQUEST
          - UNAUTHENTICATED
          - FORBIDDEN
          - NOT_FOUND
          - CONFLICT
          - PAYLOAD_TOO_LARGE
          - POLICY_REJECTED
          - QUOTA_EXCEEDED
          - NO_APPROVED_PROVIDER_OR_SAFETY_GATE_UNAVAILABLE
        message:
          type: string
        correlation_id:
          type: string
          format: uuid
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties:
            type: string
          description: لا تضمّن نصوص الرسائل أو أي أسرار
      additionalProperties: false
    ModelOption:
      type: object
      required:
      - model_id
      - display_name
      - approval_status
      - processing_region
      - data_classes
      properties:
        model_id:
          type: string
        display_name:
          type: string
        approval_status:
          type: string
          enum:
          - APPROVED
        processing_region:
          type: string
        data_classes:
          type: array
          items:
            type: string
        cost_visibility:
          type: string
          enum:
          - QUOTED
          - POLICY_DEFINED
          - NOT_APPROVED
        streaming_eligible:
          type: boolean
      additionalProperties: false
    ModelList:
      type: object
      required:
      - models
      - policy_version
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelOption'
        policy_version:
          type: string
      additionalProperties: false
    CreateSession:
      type: object
      required:
      - retention_preference
      properties:
        retention_preference:
          type: string
          enum:
          - EPHEMERAL
          - SAVE_IF_APPROVED
        model_id:
          type: string
          description: من قائمة approved فقط؛ غيابه يسمح بتوجيه محكوم
        purpose_code:
          type: string
          maxLength: 100
      additionalProperties: false
    ChatSession:
      type: object
      required:
      - session_id
      - owner_ref
      - state
      - retention_mode
      - created_at
      - policy_version
      properties:
        session_id:
          type: string
          format: uuid
        owner_ref:
          type: string
          description: مرجع مستعار للمالك لا بيانات هوية حساسة
        state:
          type: string
          enum:
          - ACTIVE
          - CLOSED
          - EXPIRED
          - RESTRICTED
        retention_mode:
          type: string
          enum:
          - EPHEMERAL
          - POLICY_SAVED
        model_id:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        policy_version:
          type: string
      additionalProperties: false
    SessionList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatSession'
        next_cursor:
          type:
          - string
          - 'null'
      additionalProperties: false
    ChatMessageRequest:
      type: object
      required:
      - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 65536
          description: نص فقط، لا مرفقات، لا بيانات حقيقية قبل اعتماد المعالجة
        model_id:
          type: string
          description: اختياري من نماذج معتمدة للمؤسسة
        response_mode:
          type: string
          enum:
          - JSON
          - SSE
          default: JSON
        client_message_id:
          type: string
          format: uuid
          description: لا يستخدم كهوية tenant أو مصدر صلاحية
      additionalProperties: false
    UsageRecord:
      type: object
      required:
      - request_id
      - metering_state
      properties:
        request_id:
          type: string
          format: uuid
        input_tokens:
          type:
          - integer
          - 'null'
          minimum: 0
        output_tokens:
          type:
          - integer
          - 'null'
          minimum: 0
        metering_state:
          type: string
          enum:
          - RESERVED
          - FINALIZED
          - NOT_BILLED
          - ADJUSTMENT_PENDING
        provider_cost_estimate:
          type:
          - number
          - 'null'
          minimum: 0
          description: العملة وسعر المزود يحتاجان اتفاقًا
        currency:
          type:
          - string
          - 'null'
        cost_is_approved:
          type: boolean
      additionalProperties: false
    ChatMessageResponse:
      type: object
      required:
      - request_id
      - session_id
      - state
      - correlation_id
      - policy_version
      - usage
      properties:
        request_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - COMPLETED
          - BLOCKED
          - CANCELLED
          - REVIEW_REQUIRED
          - ERROR
        content:
          type:
          - string
          - 'null'
          description: يظهر فقط بعد فحص وتفويض المخرج
        model_id:
          type:
          - string
          - 'null'
        correlation_id:
          type: string
          format: uuid
        policy_version:
          type: string
        usage:
          $ref: '#/components/schemas/UsageRecord'
        refusal_reason:
          type:
          - string
          - 'null'
          description: سبب عام دون تفاصيل سرية
      additionalProperties: false
    MessageList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessageResponse'
        next_cursor:
          type:
          - string
          - 'null'
      additionalProperties: false
    CancelResult:
      type: object
      required:
      - request_id
      - state
      properties:
        request_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - CANCELLED
          - ALREADY_FINISHED
          - CANCEL_PENDING
        metering_pending:
          type: boolean
      additionalProperties: false
    UsageSummary:
      type: object
      required:
      - limits_state
      - period_start
      - period_end
      properties:
        limits_state:
          type: string
          enum:
          - WITHIN_LIMIT
          - NEAR_LIMIT
          - BLOCKED
          - NOT_CONFIGURED
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        messages_used:
          type: integer
          minimum: 0
        tokens_used:
          type: integer
          minimum: 0
        remaining_messages:
          type:
          - integer
          - 'null'
          minimum: 0
        remaining_tokens:
          type:
          - integer
          - 'null'
          minimum: 0
        provider_cost:
          type:
          - number
          - 'null'
          minimum: 0
        brightai_fees:
          type:
          - number
          - 'null'
          minimum: 0
          description: تصميم واجهة فقط؛ لا سعر معتمد
      additionalProperties: false
    PrivacyPolicy:
      type: object
      required:
      - policy_version
      - content_storage
      - sharing_enabled
      - export_enabled
      - admin_content_access_default
      - retention_policy_ref
      properties:
        policy_version:
          type: string
        content_storage:
          type: string
          enum:
          - EPHEMERAL
          - OPT_IN_POLICY_SAVED
        sharing_enabled:
          type: boolean
          default: false
        export_enabled:
          type: boolean
          default: false
        admin_content_access_default:
          type: boolean
          const: false
        retention_policy_ref:
          type:
          - string
          - 'null'
        legal_hold_supported:
          type: boolean
      additionalProperties: false
    PolicyUpdate:
      type: object
      required:
      - requested_policy_version
      - justification
      - content_storage
      - sharing_enabled
      - export_enabled
      properties:
        requested_policy_version:
          type: string
        justification:
          type: string
          minLength: 5
        content_storage:
          type: string
          enum:
          - EPHEMERAL
          - OPT_IN_POLICY_SAVED
        sharing_enabled:
          type: boolean
        export_enabled:
