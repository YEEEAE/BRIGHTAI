  /v1/chat/sessions/{sessionId}/messages:
    post:
      operationId: sendChatMessage
      summary: إرسال نص إلى نموذج AI معتمد
      tags:
      - Sessions
      description: تقييم الهوية والبيانات والنموذج والمنطقة والتكلفة قبل إرسال الرسالة. في streaming يجب اجتياز فحص المخرجات
        قبل خروج أي chunk. عدم وجود مزود مصرح ⇒ رفض آمن. لا كشف مفاتيح أو prompt النظام.
      security: *id001
      x-required-permission: chat.message.send
      x-tenant-context: verified_identity_only
      x-evidence-status: PROPOSED_NOT_IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageRequest'
      parameters:
      - in: path
        name: sessionId
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
        description: منع إعادة التنفيذ المكرر مع حفظ النتيجة
      responses:
        '200':
          description: نجاح مقيد بصلاحية وسياسة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageResponse'
            text/event-stream:
              schema:
                type: string
              description: 'أحداث: message_safe_chunk، done، error. لا تعرض قطعة قبل اجتياز الحماية. لا تُرسل معلومات محظورة.'
        '400':
          description: BAD_REQUEST — تفاصيل عامة دون محتوى خاص
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: UNAUTHENTICATED — تفاصيل عامة دون محتوى خاص
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: FORBIDDEN — تفاصيل عامة دون محتوى خاص
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: NOT_FOUND — تفاصيل عامة دون محتوى خاص
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
