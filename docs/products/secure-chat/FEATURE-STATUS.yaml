status_taxonomy:
  WORKING: السلوك مثبت بتشغيل فعلي في بيئة وإصدار محددين وبدليل، لا يُستنتج من الكود فقط
  PLANNED: متطلب مستهدف أو تصميم غير مثبت التشغيل
  UNAVAILABLE: أُثبت أنه غير مدعوم في النسخة/البيئة محل المراجعة أو مستبعد من النطاق؛ يحدد السبب
  CANCELLED: إلغاء اعتمده المالك رسميًا، ولا تُعد الميزة ملغاة لمجرد غيابها
  NOT_VERIFIED: حالة تحقق إثبات منفصلة؛ لا تعني تشغيلًا ولا إثبات غياب شامل
