components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque/JWT per approved IAM profile
      description: Illustrative mechanism only. Not a declaration that a production issuer exists.
  parameters:
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: معرف الأصل داخل المستأجر
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
      description: Unique per tenant + operation; prevents repeated mutations or double metering
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: Expected version/ETag for concurrency control
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
      description: Opaque trace identifier; no PII
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
      description: Maximum subject to approved tenant limits
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Not authorized for this tenant, scope or operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No accessible record; do not leak existence across tenants
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State/version conflict or duplicate request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: Invalid or stale If-Match
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Policy, methodology, evidence or SoD validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    QuotaExceeded:
      description: Trial or license usage quota exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: Required policy/model/identity dependency unavailable; never silently approve
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    RiskAssetCreate:
      type: object
      additionalProperties: false
      properties:
        external_reference:
          type: string
          description: معرّف العميل الاختياري؛ لا يُستخدم لتجاوز حدود المستأجر
        name:
          type: string
          description: اسم أصل عام لا يتضمن PII
        owner_reference:
          type: string
          description: معرف مالك لدى نظام هوية المستأجر
        purpose:
          type: string
          description: الغرض المؤسسي المصرح به
        use_case:
          type: string
          description: حالة الاستخدام المختصرة
        model_reference:
          type: string
          description: اسم/معرف نموذج داخل سجل معتمد؛ لا بيانات اعتماد
        model_version:
          type: string
          description: إصدار موثق عند توافره
        data_categories:
          type: array
          items:
            type: string
        affected_parties:
          type: array
          items:
            type: string
        controls:
          type: array
          items:
            type: string
        environment:
          type: string
          description: بيئة نشر معتمدة في مؤسسة العميل
      required:
      - name
      - owner_reference
      - purpose
      - use_case
      - data_categories
    RiskAsset:
      type: object
      additionalProperties: false
      properties:
        asset_id:
          type: string
          format: uuid
        tenant_id:
          type: string
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        state:
          type: string
          enum:
          - DRAFT
          - IN_REVIEW
          - ACTIVE
          - RETIRED
        details:
          $ref: '#/components/schemas/RiskAssetCreate'
      required:
      - asset_id
      - tenant_id
      - version
      - state
      - details
    RiskAssetPatch:
      type: object
      additionalProperties: false
      properties:
        owner_reference:
          type: string
        purpose:
          type: string
        use_case:
          type: string
        model_reference:
          type: string
        model_version:
          type: string
        data_categories:
          type: array
          items:
            type: string
        affected_parties:
          type: array
          items:
            type: string
        controls:
          type: array
          items:
            type: string
        environment:
          type: string
      description: Patch لا يغير tenant_id أو هوية الأصل؛ يستلزم If-Match.
    SourceEvidence:
      type: object
      additionalProperties: false
      properties:
        reference:
          type: string
          description: مرجع داخلي مصرح به وليس البيانات الخام
        type:
          type: string
          enum:
          - RULE
          - DOCUMENT
          - OWNER_INPUT
          - APPROVED_MODEL
          - REVIEW
        version:
          type: string
        note:
          type: string
      required:
      - reference
      - type
    RiskContext:
      type: object
      additionalProperties: false
      properties:
        impact_domains:
          type: array
          items:
            type: string
            description: مفاهيم ضرر وفق منهج المؤسسة
        threats:
          type: array
          items:
            type: string
        controls_in_effect:
          type: array
          items:
            type: string
        likelihood_evidence:
          type: array
          items:
            $ref: '#/components/schemas/SourceEvidence'
        impact_evidence:
          type: array
          items:
            $ref: '#/components/schemas/SourceEvidence'
        additional_factors:
          type: array
          items:
            $ref: '#/components/schemas/SourceEvidence'
      required:
      - impact_domains
      - likelihood_evidence
      - impact_evidence
    AssessmentCreate:
      type: object
      additionalProperties: false
      properties:
        asset_id:
          type: string
          format: uuid
        asset_version:
          type: integer
          minimum: 1
        methodology_version:
          type: string
          description: نسخة منهج مؤسسي مُعتمد
        policy_version:
          type: string
          description: السياسة النافذة؛ لا يجوز تمرير نسخة أقدم لتجاوزها
        analysis_mode:
          type: string
          enum:
          - RULES_ONLY
          - HYBRID_APPROVED
        context:
          $ref: '#/components/schemas/RiskContext'
        reason:
          type: string
      required:
      - asset_id
      - asset_version
      - methodology_version
      - analysis_mode
      - context
    RiskFinding:
      type: object
      additionalProperties: false
      properties:
        finding_id:
          type: string
          format: uuid
        category:
          type: string
        description:
          type: string
        conclusion_basis:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceEvidence'
        rule_id:
          type: string
        mitigation:
          type: string
        uncertainty_note:
          type: string
      required:
      - finding_id
      - category
      - description
      - sources
    Assessment:
      type: object
      additionalProperties: false
      properties:
        assessment_id:
          type: string
          format: uuid
        tenant_id:
          type: string
        asset_id:
          type: string
          format: uuid
        asset_version:
          type: integer
        status:
          type: string
          enum:
          - DRAFT
          - PENDING_EVALUATION
          - INCOMPLETE
          - REVIEW_REQUIRED
          - UNDER_REVIEW
          - APPROVED
          - REJECTED
          - SUPERSEDED
          - FAILED
        methodology_version:
          type: string
        policy_version:
          type: string
        analysis_mode_requested:
          type: string
          enum:
          - RULES_ONLY
          - HYBRID_APPROVED
        analysis_mode_performed:
          type: string
          enum:
          - RULES_ONLY
          - HYBRID_APPROVED
          - NOT_COMPLETED
        qualitative_classification:
          type:
