x-error-codes:
  TENANT_SCOPE_DENIED: 403 or 404 without information disclosure
  POLICY_HIERARCHY_VIOLATION: 422 on impermissible rule weakening
  METHOD_NOT_APPROVED: 422 when methodology or numeric grading is unapproved
  MODEL_NOT_APPROVED: 422/503 when provider is not authorized or unavailable
  MISSING_EVIDENCE: 422 or incomplete assessment; never silent approval
  SELF_APPROVAL_DENIED: 403/422 when SoD is violated
  ASSESSMENT_STALE: 409/412 on mismatched asset/policy version
  TRIAL_EXPIRED: 403 or 429 under signed license policy; no auto billing
  RATE_LIMITED: 429 with Retry-After when applicable
  IDEMPOTENCY_CONFLICT: 409 when same key re-used for different payload
x-implementation-acceptance:
  requirements:
  - Tenant isolation and unauthorized 404/403 behavior
  - Immutability/lineage of assessment history
  - Role-aware reviews and SoD
  - Strict policy hierarchy
  - Rules-only safe behavior when model fails
  - No real data in synthetic trial by default
  - Air-gapped fully local auth and license checking
  - Evidence/version/correlation trace
  - Customer consent, privacy and retention approved before real data
  reference: ACCEPTANCE-AND-EVIDENCE.md
