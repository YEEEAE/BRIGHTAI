# Local foundation APIs /app/api/risk-engine/ (assets, assessments, revisions) are documented in docs/RISK-ENGINE-DEVELOPMENT.md.
# The /v1/risk/ paths below remain future proposals.
# AIGAS Risk Engine — Proposed OpenAPI Contract. NO ENDPOINT IS VERIFIED OR DEPLOYED.
# example.invalid is intentionally non-routable; values null mean owner decision required.
openapi: 3.1.0
info:
  title: AIGAS Risk Engine API — Proposed Contract
  version: 0.1.0-draft
  description: Target API design only. None of these paths is verified to exist or be available at brightai.live.
    Tenant identity, authorization issuer, deployment base URLs, limits, pricing, scoring methodology and provider
    selection require approval.
  x-document-id: AIGAS-RE-API-001
  x-canonical-path: docs/products/risk-engine/API-CONTRACT.yaml
  x-date: '2026-11-01'
  x-product: AIGAS-RE
  x-requirement-trace:
  - RE-01
  - RE-02
  - RE-03
  - RE-04
  - RE-05
  x-runtime-availability: NOT_VERIFIED
  x-review-status: DESIGN_PROPOSAL_NOT_DEPLOYED
servers:
- url: https://risk-api.example.invalid
  description: Documentation-only non-routable example; NOT a live endpoint
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
tags:
- name: Assets
  description: RE-01 asset inventory
- name: Assessments
  description: RE-02 evaluation and RE-04 reassessment
- name: Reviews
  description: RE-02 and RE-05 review and challenge
- name: Changes
  description: RE-04 lifecycle changes
- name: Policies
  description: RE-03 hierarchy
- name: Evidence
  description: Minimum product/Kernel audit
x-contract-boundaries:
  status: PROPOSED_ONLY
  authenticated_tenant_context: Derived from verified Kernel identity; never trust tenant_id sent by client
  auth_profile: Example HTTP Bearer; final SSO/MFA, service identity and token issuer are architecture decisions
  security_and_privacy:
  - No customer data used to train or improve models
  - No provider fallback to unapproved model or region
  - No missing-context automatic approval
  - No self-approval where segregation of duties is required
  - No enforce/block claims for unintegrated services
  deployment_modes:
  - SAAS
  - ON_PREMISE
  - AIR_GAPPED
  ai_provider_selection: Must be approved and reachable only within the authorized deployment boundary
  numeric_risk_scale: null
  risk_scoring_methodology: null
  endpoints_live: false
  rate_limit: null
  trial_quotas: null
  retention_days: null
  business_support_terms: null
  idempotent_mutations: true
  eventual_consistency: Any asynchronous result must retain a pending state, correlated job/assessment ID and status
    retrieval
security:
- BearerAuth: []
