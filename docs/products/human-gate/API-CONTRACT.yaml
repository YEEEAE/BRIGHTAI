  version: 0.1.0-draft
  description: Design-only authorization/enforcement API, not a deployed service. Request & response shapes require
    review against platform architecture. No URL, issuer, numeric timeouts or quotas have been approved.
  x-document-id: AIGAS-HG-API-001
  x-canonical-path: docs/products/human-gate/API-CONTRACT.yaml
  x-date: '2026-11-01'
  x-product: AIGAS-HG
  x-requirement-trace:
  - HG-01
  - HG-02
  - HG-03
  - HG-04
  - HG-05
  x-runtime-availability: NOT_VERIFIED
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
- url: https://human-gate.example.invalid
  description: Explicit non-routable contract placeholder, NOT a real deployed endpoint
tags:
- name: Approvals
  description: Create, list and read requests
- name: Decisions
  description: Human decision and escalation with SoD
- name: Delegations
  description: Scoped time-bound delegation
- name: Enforcement
  description: Trusted integration grants consumed atomically
- name: Evidence
  description: Basic audit without Ledger dependency
- name: Policies
  description: Read-only policy revision context
x-security-contract:
  approval_is_not_execution: true
  no_override_mandatory_deny: true
  no_self_approval_when_sod_required: true
  timeout_default: DENY_OR_SAFE_STOP
  authorization_at_enforcement: MUST be checked by trusted application at actual side-effect boundary, not only
    via UI
  no_unapproved_provider_fallback: true
  tenant_from_verified_principal: true
  do_not_train_on_customer_data: true
  audit_without_ledger_license: true
  kernel_fee_separate: false
  optional_integrations:
  - AIGAS-FW
  - AIGAS-RE
  - AIGAS-LD
  deployment_modes:
  - SAAS
  - ON_PREMISE
  - AIR_GAPPED
  mfa_and_sso: Policy driven; issuer to be selected
  retention_days: null
  stage_quorum_default: null
  approval_timeout_default: null
  grant_ttl_seconds: null
  rate_limit: null
  trial_quota: null
  client_sdk_releases: null
  public_api_url: null
  error_policy: 403/409/410/412/423/503 must NOT release pending protected operations
  atomicity_note: The consume operation must be atomic; authorize-and-execute boundary requires service-level idempotency
    and exactly-once effect management where feasible
  important: This contract documents intended behavior; no API path here is evidence of product availability
