source_evidence:
  - id: SRC-FW-001
    path: src/pages/products/[product].astro
    finding: توجد صفحة /products/firewall/ وتصرّح أن المنتج تصور غير متحقق تشغيليًا.
    evidence_level: SOURCE_PRESENT
  - id: SRC-FW-002
    path: src/components/ProductExperience.astro
    finding: أمثلة خمس قرارات تعليمية مع أزرار وسيناريوهات؛ لا تتصل بمحرك كشف/إنفاذ.
    evidence_level: SOURCE_PRESENT
  - id: SRC-FW-003
    path: src/components/DecisionCircuit.astro
    finding: مخطط SVG لحركة الطلب وقراراته، لا يرسل طلبًا تشغيليًا.
    evidence_level: SOURCE_PRESENT
  - id: SRC-FW-004
    path: src/scripts/interior-motion.ts
    finding: معالجة تفاعل بصري عند اختيار القرارات وتحريك packet، وليست سجل قرار أمني.
    evidence_level: SOURCE_PRESENT
  - id: SRC-FW-005
    path: kernel/README.md
    finding: وصف تاريخي لخدمات Chat/Kernel لا تؤكده المسارات الحالية في src/pages؛ غير معتمد دليل تشغيل.
    evidence_level: SPECIFIED_ONLY
  - id: SRC-FW-006
    path: src/pages/api/
    finding: مجلد مسارات Firewall API غير ظاهر في شجرة المستودع المفحوصة؛ لا نثبت وجود endpoint.
    evidence_level: NOT_VERIFIED
