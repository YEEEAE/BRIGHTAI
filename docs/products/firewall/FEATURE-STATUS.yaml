  arabic_labels:
    WORKING: تعمل
    PLANNED: مخطط لها
    UNAVAILABLE: غير متاحة
    CANCELLED: ألغيت
  operational_working_rule_ar: لا تصنف وظيفة Firewall تشغيلية كـWORKING إلا بدليل تنفيذ حقيقي على مسار تكامل تحت سيطرة المنتج وإثبات سلوك المنع والتدقيق والأمان.
  ui_working_rule_ar: يمكن تصنيف واجهة تعليمية فقط WORKING إذا أثبتها الكود، لكن لا تحوّلها إلى حالة منتج تشغيلي أو API عامة.
  planned_rule_ar: خاصية أو قدرة معتمدة في المرجع تستهدف مرحلة قادمة لكنها لم تثبت تشغيليًا.
  unavailable_rule_ar: خاصية خارج تغطية/نطاق العرض الحالي أو ما لا يدعمه الإصدار، ولا تعني أنها مرفوضة دائمًا.
  cancelled_rule_ar: تستخدم فقط لميزة أُلغي اعتمادها صراحة بقرار مالك موثق، لا لعدم ظهورها في الشفرة.
  evidence_levels:
    - SPECIFIED_ONLY
    - SOURCE_PRESENT
    - LOCAL_VERIFIED
    - INTEGRATION_VERIFIED
    - PRODUCTION_VERIFIED
  evidence_missing_default: NOT_VERIFIED
  no_assumed_release_from_legacy_readme: true
