validation_and_maintenance:
  pre_publish_steps:
  - Generate routes locally from Astro and compare count to this registry
  - Confirm canonical and robots for each actual response
  - Compare sitemap-index.xml and child sitemaps against only intended indexable URLs
  - Resolve any route canonical or indexability mismatch
  - Check no broken links and no links to future_content_backlog
  - Verify H1 and meta title/description and Article structured data only when supported
  - Check accurate product-availability statements and no fabricated commercial claims
  - Check layout RTL/mobile accessibility and motion preferences
  - Review legal and privacy source accuracy before official publication
  - Record observed production evidence and timestamp before changing browser_observation
  change_control: Update page_routes when an Astro source route is added/removed or its intended indexing changes; keep proposed
    routes separate.
  future_page_activation: Move backlog entry to page_routes only after source exists and owner approves; do not automatically
    create URLs.
  github_operations_allowed: READ_ONLY_FOR_THIS_REQUEST
  repo_write_operations_performed: false
  production_site_modified: false
  unchecked_items:
  - Production HTTP statuses and sitemap XML inaccessible through current direct fetch
  - GSC click/impression data and live rankings not retrieved
  - GA4 account reporting, configuration, consent implementation and actual event collection not independently verified
  - Product backend and pricing availability not independently verified
