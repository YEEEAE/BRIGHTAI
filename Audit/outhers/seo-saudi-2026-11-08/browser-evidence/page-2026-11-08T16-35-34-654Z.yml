                  - strong [ref=f1e130]: نظام حماية البيانات الشخصية (PDPL)
                  - text: هو النظام السعودي الذي ينظم جمع البيانات الشخصية ومعالجتها والإفصاح عنها ونقلها، ويحدد حقوق صاحب البيانات وواجبات جهة التحكم وجهة المعالجة. وهو ينطبق على معالجة البيانات الشخصية التي تتم في المملكة، وعلى معالجة بيانات الأفراد المقيمين فيها ولو جرت من جهة خارج المملكة.
              - generic [ref=f1e132]:
                - generic [ref=f1e133]:
                  - generic [ref=f1e134]:
                    - generic [aria-hidden] [ref=f1e135]: "01"
                    - 'heading "الزبدة: متى ينطبق PDPL على استخدامك للذكاء الاصطناعي؟" [level=2] [ref=f1e136]'
                  - paragraph [ref=f1e137]: ينطبق النظام عندما تعالج بيانات شخصية في سياق مهني، وأنت أو منشأتك تحدد الغرض وطريقة المعالجة أو تعالجها نيابة عن غيرك، وكانت المعالجة في المملكة أو تخص أفراداً مقيمين فيها. نوع الأداة لا يغير القاعدة.
                  - paragraph [ref=f1e138]: "خلنا نفكها على أربع بوابات: هل البيانات شخصية؟ هل الإدخال معالجة؟ هل السياق مهني؟ وهل لك موقع من الأدوار؟ إذا نعم، فأنت داخل النطاق، ويبقى تحديد دورك: متحكم يحدد الغرض، أو معالج ينفذ لحساب غيره."
                  - paragraph [ref=f1e139]:
                    - text: "المادة الثانية من النظام واضحة: يُطبق على أي معالجة بيانات شخصية تتعلق بالأفراد تتم في المملكة بأي وسيلة، بما في ذلك معالجة بيانات المقيمين فيها من أي جهة خارج المملكة. يعني «الأداة أجنبية» لا تعني الخروج من النطاق؛ تعني سؤال نقل بيانات. وإذا كان عندك شك في حدود الالتزام، راجع"
                    - link "الفرق بين الأنظمة الملزمة ووثائق سدايا الإرشادية" [ref=f1e140] [cursor=pointer]:
                      - /url: /knowledge/saudi-ai-law-binding-vs-guidance/
                    - text: قبل ما تعتمد الاستنتاج.
                  - paragraph [ref=f1e141]: الاستثناء الوحيد في هذه الحدود هو الاستخدام الشخصي أو العائلي بشرط عدم النشر أو الإفصاح للغير. واللائحة توضح أن الاستخدام المهني أو التجاري أو غير الربحي لا يدخل في الاستثناء، فمحادثة الموظف مع أداة في سياق شغله ليست استخداماً شخصياً لمجرد أنها من جواله.
                  - paragraph [ref=f1e142]:
                    - text: عشان كذا السؤال الأول مو «هل نسمح بالأداة؟»، بل «وش نوع البيانات، وليش نعالجها، ومين يتحكم فيها؟».
                    - link "قائمة قرار حماية البيانات عند استخدام ChatGPT" [ref=f1e143] [cursor=pointer]:
                      - /url: /knowledge/protect-company-data-chatgpt/
                    - text: تعطيك الأسئلة تنفيذياً، وتصنيف البيانات للذكاء الاصطناعي يحدد ما يدخل وما يتوقف. و
                    - link "ركن الخصوصية في BRIGHTAI" [ref=f1e144] [cursor=pointer]:
                      - /url: /pillars/privacy/
                    - text: "يجمع الأسئلة الثلاثة قبل الإدخال: النوع، والغرض، والقناة."
                - generic [ref=f1e145]:
                  - generic [ref=f1e146]:
                    - generic [aria-hidden] [ref=f1e147]: "02"
                    - heading "ما هي «البيانات الشخصية» وما «المعالجة» بمفهوم النظام؟" [level=2] [ref=f1e148]
                  - paragraph [ref=f1e149]: "«البيانات الشخصية» كل بيان يمكن أن يؤدي إلى معرفة فرد بعينه أو يجعل التعرف عليه ممكناً مباشرة أو بصورة غير مباشرة. و«المعالجة» أي عملية تُجرى على تلك البيانات يدوياً أو آلياً: جمع، حفظ، ترتيب، استرجاع، استعمال، إفصاح، نقل، مسح، أو إتلاف."
                  - blockquote [ref=f1e150]:
                    - paragraph [ref=f1e151]: "«البيانات الشخصية: كل بيان -مهما كان مصدره أو شكله- من شأنه أن يؤدي إلى معرفة الفرد على وجه التحديد، أو يجعل التعرف عليه ممكنًا بصفة مباشرة أو غير مباشرة، ومن ذلك: الاسم، ورقم الهوية الشخصية، والعناوين، وأرقام التواصل، وأرقام الرُّخص والسجلات والممتلكات الشخصية، وأرقام الحسابات البنكية والبطاقات الائتمانية، وصور الفرد الثابتة أو المتحركة، وغير ذلك من البيانات ذات الطابع الشخصي.»"
                    - generic [ref=f1e152]: المادة الأولى من نظام حماية البيانات الشخصية، النص المنشور على منصة حوكمة البيانات الوطنية.
                  - paragraph [ref=f1e153]: "التعريف ما يقول «بيانات العملاء» فقط؛ يقول «كل بيان»: اسم موظف، أو بريد متقدم، أو رقم جوال في تذكرة. المعيار مو مكان البيانات، بل قابليتها للربط بفرد حتى لو كان الربط غير مباشر."
                  - paragraph [ref=f1e154]: "والمعالجة عريضة بشكل مقصود: الإدخال جمع وتسجيل، وظهور النص في السجل حفظ، وتوليد الملخص استعمال، ومشاركة المخرجات إفصاح، والحذف إتلاف. لهذا جواب «هل نعالج؟» غالباً نعم بمجرد أن تكتب في الأداة."
                  - paragraph [ref=f1e155]: "وفيه تعريف ثالث: البيانات الحساسة، ومنها الصحية والوراثية والسمات الحيوية والأمنية والجنائية وما يتعلق بالمعتقد أو الأصل. اللائحة تشترط لها موافقة صريحة في حالات محددة، فإدخال بيانات صحية أو ائتمانية يحتاج وقفة أطول من نص تسويقي."
                  - paragraph [ref=f1e156]: "وهنا فرق يجب تثبيته: الترميز يحوّل المعرف إلى رمز مع الاحتفاظ بمفتاح منفصل، فتبقى البيانات شخصية. أما إخفاء الهوية فهو إزالة المعرفات المباشرة وغير المباشرة نهائياً بحيث يتعذر التعرف، واللائحة تقول إن البيانات المخفاة بهذا المعنى لا تُعد شخصية، لكنها تفرض تقييماً لفعالية الإخفاء. «شلنا الأسماء» وحده لا يكفي."
                  - paragraph [ref=f1e157]: لذلك ابدأ بتقليل الحقول قبل الإدخال لا بعد الحفظ، وإذا اعتمدت على «بيانات مجهولة» فوثّق اختبار إعادة التعريف. تصنيف البيانات للذكاء الاصطناعي يعطيك طريقة فرز عملية بين العام والداخلي والشخصي والحساس.
                - generic [ref=f1e158]:
                  - generic [ref=f1e159]:
                    - generic [aria-hidden] [ref=f1e160]: "03"
                    - 'heading "المتحكم والمعالج: أين موقعك وموقع مزود الأداة؟" [level=2] [ref=f1e161]'
                  - paragraph [ref=f1e162]: جهة التحكم تحدد الغرض من المعالجة وكيفيتها، سواء باشرتها أو بوساطة جهة معالجة. وجهة المعالجة تعالج البيانات لمصلحة جهة التحكم ونيابةً عنها. في الاستخدام المؤسسي منشأتك جهة تحكم، والمورد جهة معالجة في حدود الخدمة، وهذا يحتاج تحققاً من العقد والإعدادات.
                  - blockquote [ref=f1e163]:
                    - paragraph [ref=f1e164]: "«جهة التحكم: أي جهة عامة، وأي شخصية ذات صفة طبيعية أو اعتبارية خاصة؛ تحدد الغرض من معالجة البيانات الشخصية وكيفية ذلك؛ سواء أباشرت معالجة البيانات بوساطتها أم بوساطة جهة المعالجة.»"
                    - paragraph [ref=f1e165]: "«جهة المعالجة: أي جهة عامة، وأي شخصية ذات صفة طبيعية أو اعتبارية خاصة؛ تعالج البيانات الشخصية لمصلحة جهة التحكم ونيابةً عنها.»"
                    - generic [ref=f1e166]: المادة الأولى من نظام حماية البيانات الشخصية.
                  - paragraph [ref=f1e167]: "الفرق ليس شكلياً: جهة التحكم تجيب على «ليش نعالج؟» و«من يستفيد؟»، وجهة المعالجة على «كيف ننفذ؟» و«من يصل؟». وإذا اختلط الدور، ضاع الإفصاح والمساءلة: من يوافق على غرض جديد؟ من يرد على طلب وصول أو إتلاف؟"
                  - paragraph [ref=f1e168]: مرّر الجدول أفقياً لعرض بقية الأعمدة.
