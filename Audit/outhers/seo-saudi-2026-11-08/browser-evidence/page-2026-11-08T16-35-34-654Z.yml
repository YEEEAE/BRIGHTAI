                - generic [ref=f1e371]:
                  - generic [ref=f1e372]:
                    - generic [aria-hidden] [ref=f1e373]: "09"
                    - heading "الأسئلة الشائعة والمراجع" [level=2] [ref=f1e374]
                  - generic [ref=f1e375]:
                    - article [ref=f1e376]:
                      - heading "هل إدخال بيانات عميل في ChatGPT مخالفة؟" [level=3] [ref=f1e377]
                      - paragraph [ref=f1e378]: "ليس مخالفة بذاته، والنظام لا يحظر أداة بعينها. المسألة أن الإدخال معالجة لبيانات شخصية: تحتاج مسوغاً نظامياً وغرضاً محدداً وحداً أدنى من البيانات، وحساباً وإعدادات مناسبة، وتقييم نقل إن كانت المعالجة خارج المملكة. إذا دخلت بيانات بلا أساس ولا ضوابط، فالمشكلة في المعالجة لا في اسم الأداة. راجع المختص قبل الحكم على واقعة محددة."
                    - article [ref=f1e379]:
                      - heading "هل البيانات المجهولة تخضع للنظام؟" [level=3] [ref=f1e380]
                      - paragraph [ref=f1e381]: البيانات التي أُخفيت هويتها إخفاءً نهائياً لا يمكن معه إعادة التعريف لا تُعد بيانات شخصية وفق اللائحة التنفيذية. أما الترميز أو إزالة الاسم فقط فتبقى بيانات شخصية، لأن إعادة الربط ممكنة. لا تعتمد على «حذف الأسماء» كإخفاء هوية؛ تحقق من إمكانية إعادة التعريف ووثّق التقييم.
                    - article [ref=f1e382]:
                      - heading "من المسؤول إذا أخطأ المورد؟" [level=3] [ref=f1e383]
                      - paragraph [ref=f1e384]: جهة التحكم تبقى مسؤولة تجاه صاحب البيانات والجهة المختصة عند اختيارها جهة معالجة، وعليها التحقق من التزامها. المورد قد يتحمل مسؤولية تعاقدية أو نظامية بحسب دوره وفعله، لكن ذلك لا ينقل عنك مسؤولية الاختيار والغرض والضوابط.
                    - article [ref=f1e385]:
                      - heading "هل أحتاج موافقة صريحة؟" [level=3] [ref=f1e386]
                      - paragraph [ref=f1e387]: الأصل موافقة صاحب البيانات، مع حالات لا تُشترط فيها الموافقة. والموافقة الصريحة مطلوبة في اللائحة التنفيذية عند معالجة بيانات حساسة أو ائتمانية أو اتخاذ قرارات مبنية كلياً على المعالجة الآلية. الموافقة يجب أن تكون محددة الغرض وقابلة للإثبات وقابلة للعدول.
                    - article [ref=f1e388]:
                      - heading "هل النظام يحدد أدوات معينة؟" [level=3] [ref=f1e389]
                      - paragraph [ref=f1e390]: لا. النظام محايد تقنياً، وينطبق على المعالجة بغض النظر عن الأداة أو الوسيلة. ما يحدد الالتزام هو نوع البيانات والغرض والدور والنقل والأثر، لا اسم المنتج أو كونه سحابياً أو محلياً.
