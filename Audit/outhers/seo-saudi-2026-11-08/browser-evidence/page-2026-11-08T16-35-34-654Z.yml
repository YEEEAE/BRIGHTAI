                  - paragraph [ref=f1e282]: "النقاط الست طبقات متداخلة: نوع البيانات، ثم الحساب والصلاحيات، ثم العقد والنقل، ثم المخرجات. إذا ضبطت نقطة وتركت الثانية، صار عندك وهم ضابط."
                  - paragraph [ref=f1e283]: "وفيه سؤال خامس شبه غائب: «من يملك إيقاف المسار؟». هل فيه شخص يوقف الاستخدام اليوم ويطلب الحذف؟ وإذا وقع تسرب، المادة 20 تُلزم بإشعار الجهة المختصة عند العلم، وبإشعار صاحب البيانات عند احتمال الضرر. راجع الإبلاغ عن تسرب بيانات في استخدامات الذكاء الاصطناعي."
                  - paragraph [ref=f1e284]: "وقبل التوسع، دليل تقييم أثر الذكاء الاصطناعي يربط النقاط بمن يتأثر: صاحب البيانات، والموظف، والعميل، والطرف الثالث في المخرجات."
