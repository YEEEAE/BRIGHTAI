                  - paragraph [ref=f1e204]: قلنا «قد يكون متحكماً مستقلاً» لأن الدور يتحدد بالعقد والغرض لا باسم الخدمة. المادة الثامنة تُلزمك باختيار معالج يوفر الضمانات والتحقق منه، ولا تُسقط مسؤوليتك. توقيع العقد يثبت أنك راجعت، لكنه ما ينقل المسؤولية.
                  - paragraph [ref=f1e205]: "وثلاثة أسئلة تكشف الدور: هل يعالج لأغراضه مثل التدريب؟ هل يحدد الاحتفاظ بنفسه؟ هل يشاركها بصفته متحكماً؟ إذا نعم في واحدة، فالدور مختلط ويحتاج تقييماً وعقداً أوضح. تقييم موردي الذكاء الاصطناعي يجمع الأسئلة، وبنود عقود الذكاء الاصطناعي تترجمها إلى التزامات."
