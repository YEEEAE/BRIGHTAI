                    - heading "الأساس النظامي للمعالجة والموافقة" [level=2] [ref=f1e303]
                  - paragraph [ref=f1e304]: الأصل أن معالجة البيانات أو تغيير غرضها لا تجوز إلا بموافقة صاحبها، إلا في الحالات التي يستثنيها النظام. والموافقة يجب أن تكون واضحة الغرض، قابلة للإثبات والعدول، وصريحة في حالات محددة أهمها البيانات الحساسة والائتمانية والقرارات الآلية بالكامل.
                  - paragraph [ref=f1e305]: المادة 5 تنص على الموافقة كأصل، والمادة 6 تعدد حالات لا تُشترط فيها، منها المصلحة المتحققة عند تعذر الاتصال، والتنفيذ بمقتضى نظام أو اتفاق سابق، والأغراض الأمنية أو القضائية، والمصالح المشروعة بشرط عدم الإخلال بالحقوق وألا تكون البيانات حساسة. والمادة 7 تمنع جعل الموافقة شرطاً لخدمة إلا إذا كانت مرتبطة بالمعالجة.
                  - paragraph [ref=f1e306]: إذاً «وقّع الموظف على نموذج» ليس نهاية القصة. الموافقة لازم تكون محددة الغرض، مفهومة، موثقة بوقت ووسيلة، وقابلة للعدول بسهولة مماثلة. واللائحة تشترط موافقة مستقلة لكل غرض، وصريحة عند البيانات الحساسة أو الائتمانية أو القرارات المبنية كلياً على المعالجة الآلية.
                  - paragraph [ref=f1e307]: وفي العمل، موافقة الموظف ليست دائماً أساساً مريحاً، لأن العلاقة قد تجعل الاختيار غير حر فعلياً. النظام يشترط إرادة حرة وألا تُستخدم طرق مضللة. إذا كان الاستخدام إلزامياً بحكم العمل، فالأفضل تحديد الأساس الآخر المناسب بدل توقيع شكلي، راجع المختص.
                  - paragraph [ref=f1e308]: "والمادة 13 تلزم بالإفصاح عند الجمع: المسوغ والغرض، والجهات التي ستُفصح لها البيانات، وما إذا كانت ستنقل أو تُعالج خارج المملكة. والمادة 12 تلزم بسياسة خصوصية، والمادة 11 بالحد الأدنى من البيانات. الإفصاح في سياسة داخلية لا يكفي إذا لم يصل لصاحب البيانات مفهوماً."
                  - paragraph [ref=f1e309]:
                    - text: وأخيراً، المادة الثانية والعشرون تطلب تقويم أثر للمعالجة على المنتجات والخدمات المقدمة للعموم بحسب النشاط. في الذكاء الاصطناعي يشمل ذلك الاستخدامات التي تؤثر في قرار أو خدمة أو تصنيف أشخاص.
                    - link "سياسة استخدام الذكاء الاصطناعي للموظفين" [ref=f1e310] [cursor=pointer]:
                      - /url: /knowledge/ai-use-policy-employees/
                    - text: تربط القواعد بقرار يومي، و
                    - link "إرشادات الذكاء الاصطناعي التوليدي" [ref=f1e311] [cursor=pointer]:
                      - /url: /knowledge/sdaia-generative-ai-guidelines/
                    - text: تضيف ضوابط للاستخدام التوليدي.
                - generic [ref=f1e312]:
                  - generic [ref=f1e313]:
                    - generic [aria-hidden] [ref=f1e314]: "06"
                    - heading "النقل خارج المملكة وأثره على اختيار الأداة" [level=2] [ref=f1e315]
                  - paragraph [ref=f1e316]: النقل خارج المملكة ليس ممنوعاً بالمطلق، لكنه مشروط. المادة التاسعة والعشرون تسمح به لغرض مشروع، بشرط ألا يمس الأمن الوطني أو المصالح الحيوية، وأن يتوافر مستوى حماية مناسب لا يقل عن مستوى النظام، وأن يقتصر على الحد الأدنى من البيانات.
                  - paragraph [ref=f1e317]: "الأغراض تشمل التزاماً باتفاقية تكون المملكة طرفاً فيها، أو خدمة مصالح المملكة، أو التزاماً يكون صاحب البيانات طرفاً فيه، أو أغراضاً تحددها اللائحة: العمليات التشغيلية المركزية، وتقديم خدمة، والبحوث العلمية. وجود الغرض لا يكفي؛ لازم تتحقق الشروط الثلاثة الأخرى."
                  - paragraph [ref=f1e318]: "ولائحة النقل تضيف طبقة عملية: الجهة المختصة تنشر قائمة الدول أو المنظمات التي توفر حماية مناسبة وتراجعها كل أربع سنوات. وإذا لم تكن الجهة على القائمة أو دخلت في إعفاء، يكون النقل مقيداً بضمانات مثل البنود التعاقدية القياسية أو القواعد الملزمة أو شهادة اعتماد. وتفرض اللائحة تقويم مخاطر قبل النقل عند الإعفاء، وعند نقل بيانات حساسة بشكل مستمر."
                  - paragraph [ref=f1e319]: "عملياً لا تسأل «هل بياناتنا في السعودية؟» فقط. اسأل: وين الخادم والنسخ الاحتياطي؟ هل الدعم من دولة أخرى؟ هل هناك معالجون فرعيون؟ وهل العقد يلزم المورد بإشعارك قبل تغيير الموقع؟ هذه الأسئلة تكشف النقل الخفي."
                  - paragraph [ref=f1e320]:
                    - text: والاستضافة المحلية لا تعني أن كل المعالجة محلية؛ قد يكون الخادم في المملكة وفريق الدعم أو المراقبة خارجها. دليل موقع البيانات والاستضافة في السعودية يربط السؤال التقني بالنظامي، وبنود عقود الذكاء الاصطناعي تعطيك صياغات للموقع والإشعار. وإذا كنت تقارن موردين،
                    - link "مركز الثقة في BRIGHTAI" [ref=f1e321] [cursor=pointer]:
                      - /url: /trust/
                    - text: يوضح الفرق بين التصور المنشور والدليل التشغيلي؛ استخدم نفس المعيار مع أي مورد.
                - generic [ref=f1e322]:
                  - generic [ref=f1e323]:
                    - generic [aria-hidden] [ref=f1e324]: "07"
                    - heading "حقوق أصحاب البيانات وكيف تنعكس على أنظمة الذكاء الاصطناعي؟" [level=2] [ref=f1e325]
                  - paragraph [ref=f1e326]: النظام يمنح صاحب البيانات حق العلم، والوصول، والحصول على نسخة، والتصحيح أو الإتمام أو التحديث، وطلب الإتلاف لما انتهت الحاجة إليه. واللائحة تحدد استجابة لا تتجاوز ثلاثين يوماً قابلة للتمديد ثلاثين أخرى بشرط الإشعار. هذه الحقوق تمس السجلات والمخرجات والمراجعة البشرية.
                  - paragraph [ref=f1e327]: «حق العلم» يعني أن يعرف الشخص أن بياناته ستُعالج، وليش، ومين سيشوفها، وهل ستنتقل خارج المملكة. و«الوصول» يشمل غالباً سجل المحادثة أو الملف. و«التصحيح» يمنع بقاء الخطأ مؤثراً في قرار آلي. و«الإتلاف» حذف ما انتهى غرضه مع مراعاة التزامات الاحتفاظ.
                  - paragraph [ref=f1e328]: "وهذا يفرض أسئلة تصميم: هل السجل قابل للبحث والتصدير؟ هل يمكن حذف محادثة دون كسر السجل؟ هل النسخ الاحتياطية تدخل في الحذف؟ هل المخرجات تحتوي بيانات طرف ثالث لم يوافق؟ هل تقدر تشرح القرار الآلي بلغة مفهومة؟ إذا كانت الإجابات غير واضحة، فالحق موجود على الورق وغير قابل للتنفيذ."
                  - paragraph [ref=f1e329]: "وفي القرارات الآلية، تشترط اللائحة موافقة صريحة عندما يكون القرار مبنياً بالكامل على المعالجة الآلية، وتلزم أحياناً بإبلاغ صاحب البيانات. وليس كل استخدام قراراً آلياً؛ التلخيص والترجمة واقتراح النص ليست بالضرورة قراراً. المعيار: هل المخرج يؤثر في حق أو خدمة، وهل الإنسان يراجع فعلاً."
                  - paragraph [ref=f1e330]:
                    - text: وإذا وقع تسرب، المادة 20 تفرض إشعار الجهة المختصة عند العلم، وإشعار صاحب البيانات عند احتمال الضرر. راجع دليل الإبلاغ عن تسرب بيانات الذكاء الاصطناعي. وإذا كان عندك تصور لمنتج فحص، صفحة
                    - link "AIGAS Firewall" [ref=f1e331] [cursor=pointer]:
                      - /url: /products/firewall/
                    - text: تصف كيف يمكن فحص المدخلات والمخرجات وفق سياسة المنشأة، وهي تصور غير متحقق التشغيلياً.
                  - paragraph [ref=f1e332]: وحقوق الأفراد ليست ملفاً منفصلاً عن حوكمة البيانات؛ الفرق بين حوكمة البيانات وحوكمة الذكاء الاصطناعي يوضح أن الأولى تحكم دورة حياة البيانات، والثانية تضيف المخاطر والنماذج. لكن الحق يبقى واحداً أمام الشخص، ولا يصح أن يضيع بين إدارتين.
