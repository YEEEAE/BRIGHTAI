            - heading "لا تخلط مسارات الإخطار" [level=2] [ref=e106]
            - paragraph [ref=e107]: تفرّق المادة 24 بين إخطار الجهة المختصة وإخطار صاحب البيانات، وتتناول استكمال المعلومات الناقصة مع مبرر التأخير، ولا تلغي التزامات الإبلاغ الأخرى المنطبقة. راجع النص الرسمي للمحتوى والشروط والمواعيد الخاصة بكل مسار، بدل إرسال إشعار موحد للجميع.
            - paragraph [ref=e108]: "بعد الاحتواء، حلّل سبب الواقعة: غموض السياسة أو حساب غير مناسب أو صلاحية أداة أو ضعف تدريب. اربط الإجراء التصحيحي بمالك واختبار، واحفظ سجل القرار دون ادعاء انتهاء الخطر لأن المورد أغلق الحساب أو لأن النص حُذف من الواجهة."
          - generic [ref=e109]:
            - heading "مثال تطبيقي افتراضي" [level=2] [ref=e110]
            - blockquote [ref=e111]:
              - paragraph [ref=e112]: "مثال افتراضي: يرفع موظف كشف عملاء إلى خدمة تلخيص. تبلغ الجهة المختصة داخليًا فورًا، وتتحقق من البيانات والمستلمين والإعدادات والأثر والتوقيت، ثم تقرر مسارات الإشعار المنطبقة. لا يُحسب بدء المهلة تلقائيًا من وقت إغلاق التحقيق النهائي."
