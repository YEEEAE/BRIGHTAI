            - generic [ref=e122]:
              - heading "هل كل إدخال خاطئ في AI يستلزم بلاغ 72 ساعة؟" [level=3] [ref=e123]
              - paragraph [ref=e124]: ليس تلقائيًا. الحكم يتطلب تقييم طبيعة الواقعة والبيانات وشروط المادة 24 والالتزامات الأخرى المنطبقة.
