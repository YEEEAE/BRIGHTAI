            - 'heading "تسرّب بيانات عبر AI: متى تبدأ مهلة 72 ساعة؟" [level=1] [ref=e64]'
            - paragraph [ref=e65]: بحسب المادة 24 من اللائحة التنفيذية، على جهة التحكم إشعار الجهة المختصة خلال مدة لا تتجاوز 72 ساعة من وقت علمها بحادثة تسرب بيانات شخصية إذا تحققت شروط الضرر أو التعارض مع الحقوق أو المصالح الواردة بالمادة. ليست المهلة قاعدة لكل خطأ AI، وليست إذنًا للانتظار قبل الاحتواء والتقييم.
            - paragraph [ref=e66]:
              - text: إعداد
              - link "مؤسسة مُشرقة BRIGHT AI" [ref=e67] [cursor=pointer]:
                - /url: /about/
              - text: . دليل تعليمي؛ الأمثلة افتراضية والنماذج الإجرائية مقترحة وليست نماذج تنظيمية معتمدة. راجع النص الرسمي والمختص المخول قبل تطبيق قرار نظامي أو صحي أو مالي.
          - region [ref=e68]:
            - heading "فرّق بين البلاغ الداخلي والعلم والقرار النظامي" [level=2] [ref=e69]
            - paragraph [ref=e70]: عندما يبلغ موظف أنه أدخل ملفًا في أداة غير معتمدة، افتح مسار التقييم فورًا. وثّق الوقائع والوقت ومصدر المعلومات، وافصل ما هو مؤكد عما يجري التحقق منه. لا تصف كل اشتباه بأنه تسرب مؤكد، ولا تؤخر التصعيد لأن التحقيق لم يكتمل.
            - paragraph [ref=e71]: تحديد العلم وانطباق شروط الإشعار في واقعة محددة يحتاج جهة مختصة داخل المنشأة ومراجعة الوقائع. اجعل وسيلة الإبلاغ معروفة وبديل المسؤول متاحًا، لأن بقاء البلاغ في بريد غير مراقب يضر سرعة المعالجة ولا يصلح إجراءً لإدارة الالتزام.
          - region [ref=e72]:
            - heading "احفظ ما يساعد على فهم الواقعة" [level=2] [ref=e73]
            - paragraph [ref=e74]: القائمة التالية ترتيب عملي مقترح للتحقيق، وليست نموذج بلاغ رسميًا. اجمع أقل دليل يسمح بفهم ما دخل الأداة ومن استلمه وما إذا كان الوصول مستمرًا، مع حصر الاطلاع على المخولين. لا تنسخ الملف المتسرب إلى مجموعات عمل جديدة أثناء طلب المساعدة.
            - paragraph [ref=e75]: نسّق احتواء التكامل أو الحساب مع الأمن ومالك العمل، وتجنب إتلاف الدليل الضروري أو تشغيل حذف غير مأذون. سجّل الإجراءات ومن نفذها ووقتها، واطلب من المورد معلومات محددة بدل الاكتفاء برد «تم إغلاق التذكرة».
