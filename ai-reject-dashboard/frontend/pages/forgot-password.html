<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استعادة الحساب — BrightAI Password Reset</title>
  <link rel="stylesheet" href="/assets/css/design-system.css">
  <style>
    body {
      background: var(--color-background);
      color: var(--color-text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      margin: 0;
      padding: var(--spacing-md);
    }
    
    .forgot-box {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--spacing-2xl);
      max-width: 420px;
      width: 100%;
      box-shadow: var(--shadow-lg);
    }
    
    .forgot-box h1 {
      font-size: var(--font-size-md);
      font-weight: 800;
      color: var(--color-primary);
      margin-bottom: var(--spacing-xs);
    }
    
    .forgot-box .sub {
      font-size: var(--font-size-xs);
      color: var(--color-text-secondary);
      margin-bottom: var(--spacing-lg);
      line-height: 1.5;
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-xs);
      margin-bottom: var(--spacing-md);
    }
    
    .form-group label {
      font-size: var(--font-size-xs);
      font-weight: 600;
      color: var(--color-text);
    }
    
    .form-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      background: var(--color-background);
      color: var(--color-text);
      transition: all 0.2s;
    }
    
    .form-input:focus {
      outline: none;
      border-color: var(--color-secondary);
      box-shadow: 0 0 0 3px rgba(0, 166, 166, 0.15);
    }
    
    .btn-submit {
      width: 100%;
      padding: 12px;
      font-size: var(--font-size-sm);
      font-weight: 700;
    }
    
    .alert {
      padding: var(--spacing-sm) var(--spacing-md);
      border-radius: var(--radius-md);
      font-size: var(--font-size-xs);
      margin-bottom: var(--spacing-md);
      line-height: 1.5;
      display: none;
    }
    
    .alert-success {
      background: rgba(42, 157, 143, 0.1);
      border: 1px solid var(--color-success);
      color: var(--color-success);
    }
    
    .alert-danger {
      background: rgba(231, 111, 81, 0.1);
      border: 1px solid var(--color-danger);
      color: var(--color-danger);
    }
    
    .back-link {
      display: block;
      text-align: center;
      font-size: var(--font-size-xs);
      color: var(--color-secondary);
      text-decoration: none;
      margin-top: var(--spacing-md);
      font-weight: 600;
    }
    
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="forgot-box">
    <h1>استعادة كلمة المرور</h1>
    <div class="sub">أدخل بريدك الإلكتروني المؤسسي وسيقوم النظام بتوليد رابط استعادة آمن وتوثيقه في سجلات الخادم.</div>

    <div id="alert-box" class="alert"></div>

    <form id="forgot-form" onsubmit="return false;">
      <div class="form-group">
        <label for="email-input">البريد الإلكتروني المؤسسي</label>
        <input type="email" id="email-input" class="form-input" placeholder="yazeed@brightai.site" required autofocus>
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary btn-submit">إرسال رابط الاستعادة</button>
    </form>

    <a href="/pages/login.html" class="back-link">⬅️ عودة لصفحة تسجيل الدخول</a>
  </div>

  <script>
    document.getElementById('forgot-form').addEventListener('submit', async () => {
      const email = document.getElementById('email-input').value.trim();
      const btn = document.getElementById('submit-btn');
      const alertBox = document.getElementById('alert-box');

      if (!email) return;

      btn.disabled = true;
      btn.textContent = 'جاري المعالجة...';
      alertBox.style.display = 'none';

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await res.json();

        if (res.ok) {
          alertBox.className = 'alert alert-success';
          alertBox.textContent = data.message;
          alertBox.style.display = 'block';
          
          // في حال المحاكاة، إظهار الرابط في الكونسول وربما نقله تلقائياً بعد ثوانٍ لتسهيل الاختبار
          if (data.resetToken) {
            console.log('💡 Reset Token retrieved for simulation:', data.resetToken);
            setTimeout(() => {
              window.location.href = `/pages/reset-password.html?token=${data.resetToken}`;
            }, 3000);
          }
        } else {
          throw new Error(data.message || 'Failed to request reset');
        }
      } catch (e) {
        alertBox.className = 'alert alert-danger';
        alertBox.textContent = e.message;
        alertBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'إرسال رابط الاستعادة';
      }
    });
  </script>
</body>
</html>
