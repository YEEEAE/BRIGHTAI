<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تعيين كلمة المرور — BrightAI Password Reset</title>
  <link rel="stylesheet" href="/ai-reject-dashboard/frontend/assets/css/design-system.css">
  <style>
    body {
      background: var(--color-background);
      color: var(--color-text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      margin: 0;
      padding: var(--spacing-md);
    }
    
    .reset-box {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--spacing-2xl);
      max-width: 420px;
      width: 100%;
      box-shadow: var(--shadow-lg);
    }
    
    .reset-box h1 {
      font-size: var(--font-size-md);
      font-weight: 800;
      color: var(--color-primary);
      margin-bottom: var(--spacing-xs);
    }
    
    .reset-box .sub {
      font-size: var(--font-size-xs);
      color: var(--color-text-secondary);
      margin-bottom: var(--spacing-lg);
      line-height: 1.5;
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-xs);
      margin-bottom: var(--spacing-md);
    }
    
    .form-group label {
      font-size: var(--font-size-xs);
      font-weight: 600;
      color: var(--color-text);
    }
    
    .form-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      background: var(--color-background);
      color: var(--color-text);
      transition: all 0.2s;
    }
    
    .form-input:focus {
      outline: none;
      border-color: var(--color-secondary);
      box-shadow: 0 0 0 3px rgba(0, 166, 166, 0.15);
    }
    
    .btn-submit {
      width: 100%;
      padding: 12px;
      font-size: var(--font-size-sm);
      font-weight: 700;
    }
    
    .alert {
      padding: var(--spacing-sm) var(--spacing-md);
      border-radius: var(--radius-md);
      font-size: var(--font-size-xs);
      margin-bottom: var(--spacing-md);
      line-height: 1.5;
      display: none;
    }
    
    .alert-success {
      background: rgba(42, 157, 143, 0.1);
      border: 1px solid var(--color-success);
      color: var(--color-success);
    }
    
    .alert-danger {
      background: rgba(231, 111, 81, 0.1);
      border: 1px solid var(--color-danger);
      color: var(--color-danger);
    }
    
    .policy-list {
      font-size: 11px;
      color: var(--color-text-secondary);
      margin-top: 6px;
      padding-right: 14px;
      line-height: 1.5;
    }
  </style>
    <link rel="stylesheet" href="../../../assets/css/sitewide-modernization.css">
</head>
<body class="bright-page--dashboard" data-bright-page-type="dashboard">
<a class="skip-link" href="#main-content">تجاوز إلى المحتوى الرئيسي</a>

  <div id="main-content" tabindex="-1" aria-hidden="true"></div>
<div class="reset-box">
    <h1>تعيين كلمة المرور الجديدة</h1>
    <div class="sub">أدخل كلمة المرور الجديدة وتأكد من مطابقتها لسياسة الأمان الصارمة المعتمدة في المنشأة.</div>

    <div id="alert-box" class="alert"></div>

    <form id="reset-form" onsubmit="return false;">
      <div class="form-group">
        <label for="password-input">كلمة المرور الجديدة</label>
        <input type="password" id="password-input" class="form-input" placeholder="••••••••••••" required autofocus>
        
        <ul class="policy-list">
          <li>12 حرفاً على الأقل.</li>
          <li>أحرف كبيرة وصغيرة (A-z).</li>
          <li>أرقام (0-9) ورموز خاصة مثل (@، $، !).</li>
        </ul>
      </div>

      <div class="form-group">
        <label for="confirm-input">تأكيد كلمة المرور</label>
        <input type="password" id="confirm-input" class="form-input" placeholder="••••••••••••" required>
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary btn-submit">حفظ كلمة المرور</button>
    </form>
  </div>

  <!-- Page logic — extracted to external file (CSP-compliant) -->
  <script src="/ai-reject-dashboard/frontend/assets/js/pages/reset-password.js"></script>
  <!-- dummy marker reset start
    const token = new URLSearchParams(window.location.search).get('token');

    document.getElementById('reset-form').addEventListener('submit', async () => {
      const pass = document.getElementById('password-input').value;
      const confirm = document.getElementById('confirm-input').value;
      const btn = document.getElementById('submit-btn');
      const alertBox = document.getElementById('alert-box');

      if (!token) {
        alertBox.className = 'alert alert-danger';
        alertBox.textContent = 'رمز استعادة كلمة المرور مفقود أو غير صحيح.';
        alertBox.style.display = 'block';
        return;
      }

      if (pass !== confirm) {
        alertBox.className = 'alert alert-danger';
        alertBox.textContent = 'كلمتا المرور غير متطابقتين.';
        alertBox.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'جاري الحفظ...';
      alertBox.style.display = 'none';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: pass })
        });

        const data = await res.json();

        if (res.ok) {
          alertBox.className = 'alert alert-success';
          alertBox.textContent = 'تم حفظ وتغيير كلمة المرور بنجاح! جاري التوجيه لصفحة تسجيل الدخول...';
          alertBox.style.display = 'block';
          
          setTimeout(() => {
            window.location.href = '/pages/login';
          }, 3000);
        } else {
          throw new Error(data.message || 'Failed to reset password');
        }
      } catch (e) {
        alertBox.className = 'alert alert-danger';
        alertBox.textContent = e.message;
        alertBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'حفظ كلمة المرور';
      }
    });
  </script>
    <script defer src="../../../assets/js/sitewide-modernization.js"></script>
</body>
</html>
