<!DOCTYPE html>
<html lang="ar" dir="rtl" class="js-focus-visible">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Reject Analytics — Quality QMS Dashboard</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="نظام إدارة الجودة الاستراتيجي لـ BrightAI - ممتثل لمعايير هيئة الغذاء والدواء السعودية ومتطلبات ISO 13485.">
  <link rel="canonical" href="https://brightai.site/ai-reject-dashboard/">
  
  <!-- Central Design System and Components Bundle -->
  <link rel="stylesheet" href="/assets/css/design-system.css">
  <link rel="stylesheet" href="/assets/css/notifications.css">
  
  <!-- Bespoke Page Styling for Premium Veeva Vault & MasterControl QMS Aesthetics -->
  <style>
    body {
      display: flex;
      background-color: var(--color-background);
      overflow-x: hidden;
      min-height: 100vh;
    }
    
    .app-wrapper {
      display: flex;
      width: 100%;
      min-height: 100vh;
      position: relative;
    }

    .main-viewport {
      flex-grow: 1;
      margin-inline-start: 260px;
      transition: var(--transition-normal);
      min-width: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .sidebar-collapsed + .main-viewport {
      margin-inline-start: 72px;
    }

    .content-container {
      padding: var(--spacing-xl);
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--spacing-xl);
      flex-grow: 1;
    }

    /* QMS Kanban Board */
    .kanban-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--spacing-md);
      width: 100%;
    }

    .kanban-column {
      background-color: var(--gray-50);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--spacing-md);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
      min-height: 280px;
    }

    .kanban-column-title {
      font-size: var(--font-size-sm);
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: var(--spacing-xs);
      margin-bottom: var(--spacing-xs);
    }

    .kanban-card {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--spacing-sm) var(--spacing-md);
      cursor: pointer;
      transition: var(--transition-fast);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-xs);
    }

    .kanban-card:hover {
      border-color: var(--color-border-hover);
      box-shadow: var(--shadow-1);
    }

    /* Ishikawa Fishbone Diagram Style */
    .fishbone-container {
      display: flex;
      flex-direction: column;
      position: relative;
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      padding: var(--spacing-xl);
      border-radius: var(--radius-lg);
      overflow-x: auto;
    }

    .fishbone-spine {
      height: 4px;
      background-color: var(--color-primary);
      width: 100%;
      margin: var(--spacing-xl) 0;
      position: relative;
      align-self: center;
    }

    .fishbone-head {
      position: absolute;
      inset-inline-end: 0;
      top: 50%;
      transform: translateY(-50%);
      background-color: var(--color-danger);
      color: var(--text-on-primary);
      padding: var(--spacing-sm) var(--spacing-md);
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: var(--font-size-sm);
    }
    
    [dir="rtl"] .fishbone-head {
      inset-inline-end: auto;
      inset-inline-start: 0;
    }

    .fishbone-branches {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--spacing-xl);
    }

    .fishbone-branch {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-xs);
      border-bottom: 2px solid var(--color-border);
      padding-bottom: var(--spacing-sm);
      transition: var(--transition-fast);
      cursor: pointer;
    }

    .fishbone-branch:hover {
      border-color: var(--color-primary);
    }

    .fishbone-branch-title {
      font-weight: 600;
      font-size: var(--font-size-sm);
      color: var(--color-primary);
    }

    .fishbone-branch-defect {
      font-size: var(--font-size-xs);
      color: var(--text-secondary);
      background-color: var(--gray-50);
      padding: 4px var(--spacing-sm);
      border-radius: var(--radius-sm);
    }

    .quality-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-xl);
    }

    @media (max-width: 1024px) {
      .main-viewport {
        margin-inline-start: 0 !important;
      }
      .quality-grid-2, .kanban-board, .fishbone-branches {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <!-- Libraries CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/locale/ar.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="qualityApp()" :class="{ 'sidebar-collapsed': sidebarCollapsed }" :dir="lang === 'ar' ? 'rtl' : 'ltr'">

  <div class="app-wrapper">

    <!-- SIDEBAR -->
    <aside class="sidebar" :class="{ 'sidebar-collapsed': sidebarCollapsed }">
      <div class="sidebar-header">
        <a href="index.html" class="sidebar-logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
          <span style="white-space: nowrap;">BrightAI Analytics</span>
        </a>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="sidebar-link">
          <span class="sidebar-icon">📊</span>
          <span>لوحة القيادة الرئيسية</span>
        </a>
        <a href="executive.html" class="sidebar-link">
          <span class="sidebar-icon">🏢</span>
          <span>المنظور التنفيذي</span>
        </a>
        <a href="finance.html" class="sidebar-link">
          <span class="sidebar-icon">💰</span>
          <span>المنظور المالي</span>
        </a>
        <a href="quality.html" class="sidebar-link is-active">
          <span class="sidebar-icon">🔬</span>
          <span>الجودة وإجراءات CAPA</span>
        </a>
        <a href="production.html" class="sidebar-link">
          <span class="sidebar-icon">⚙️</span>
          <span>الإنتاج والعمليات</span>
        </a>
        <a href="workflow.html" class="sidebar-link">
          <span class="sidebar-icon">🔄</span>
          <span>حوكمة الموافقات</span>
        </a>
        <a href="technical.html" class="sidebar-link">
          <span class="sidebar-icon">🛠️</span>
          <span>المنظور الفني والربط</span>
        </a>
        <a href="reports.html" class="sidebar-link">
          <span class="sidebar-icon">📄</span>
          <span>مركز التقارير الفاخر</span>
        </a>
        
        <div class="sidebar-title">تغيير اللغة / Lang</div>
        <button class="sidebar-link" @click="toggleLanguage()" style="width:100%; border:none; background:none;">
          <span class="sidebar-icon">🌐</span>
          <span x-text="lang === 'ar' ? 'English (EN)' : 'العربية (AR)'"></span>
        </button>
      </nav>
    </aside>

    <!-- MAIN VIEWPORT CONTAINER -->
    <div class="main-viewport">

      <!-- TOP BAR -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="topbar-btn" @click="toggleSidebar()" aria-label="Toggle Sidebar" style="margin-inline-end: var(--spacing-sm);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          
          <div class="page-title-area">
            <h2 x-text="lang === 'ar' ? 'منظور إدارة الجودة والامتثال (QMS Dashboard)' : 'QMS Quality & Compliance View'"></h2>
            <div class="breadcrumb" style="margin-bottom:0;" x-text="lang === 'ar' ? 'متابعة الـ CAPA، رصد عدم المطابقة، والجاهزية لتدقيق الغذاء والدواء SFDA' : 'CAPA Kanban, Root Cause Analysis & SFDA readiness metrics'"></div>
          </div>
        </div>

        <div class="topbar-right">
          <!-- Dark Mode Toggle Button -->
          <button class="topbar-btn" @click="toggleDarkMode()">
            <span x-show="!darkMode">🌙</span>
            <span x-show="darkMode">☀️</span>
          </button>

          <!-- Export Options Dropdown -->
          <button class="btn btn-sm btn-primary" @click="exportQMSReport()">
            <span>📤</span>
            <span x-text="lang === 'ar' ? 'تصدير تقرير الجودة' : 'Export QMS Report'"></span>
          </button>
        </div>
      </header>

      <!-- MAIN PAGE CONTENT CONTAINER -->
      <main class="content-container">

        <!-- BREADCRUMBS -->
        <nav class="breadcrumb">
          <li class="breadcrumb-item"><a href="index.html" class="breadcrumb-link" x-text="lang === 'ar' ? 'لوحة القيادة' : 'Dashboard'"></a></li>
          <span class="breadcrumb-separator">/</span>
          <li class="breadcrumb-item is-active" x-text="lang === 'ar' ? 'إدارة الجودة والـ CAPA' : 'Quality QMS'"></li>
        </nav>

        <!-- 1. QUALITY HERO SECTION (Quality score gauge, Non-conformance & GMP Compliance) -->
        <section class="grid grid-cols-3">
          <!-- Radial Gauge for Quality Score -->
          <div class="card card-outlined" style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:180px; padding:var(--spacing-md);">
            <div style="font-weight:600; font-size:var(--font-size-sm); color:var(--text-secondary);" x-text="lang === 'ar' ? 'مؤشر جودة الجودة الإجمالي' : 'Overall Quality Compliance'"></div>
            <div style="font-weight:700; font-size:var(--font-size-2xl); color:var(--color-success); margin-top:var(--spacing-sm);" x-text="kpis.qualityScore + '%'"></div>
            <div style="font-size:11px; color:var(--text-muted); margin-top:2px;" x-text="lang === 'ar' ? 'الحد المعتمد GMP: 85%' : 'GMP limit cap: 85%'"></div>
          </div>

          <!-- Non-Conformance Rate Card -->
          <div class="card card-elevated card-stat" style="height:180px;">
            <div class="card-header" style="border-bottom:none; padding-bottom:0;">
              <span class="card-title" x-text="lang === 'ar' ? 'معدل عدم المطابقة (NCR Rate)' : 'Non-Conformance Rate (NCR)'"></span>
              <span class="badge badge-warning">NCR</span>
            </div>
            <div class="card-stat-value" style="color:var(--color-warning);" x-text="kpis.ncrRate + '%'"></div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span class="card-subtitle" x-text="lang === 'ar' ? 'نسبة الانحراف عن المعايير' : 'SOP standard deviation rate'"></span>
            </div>
          </div>

          <!-- ISO 13485 Score Card -->
          <div class="card card-elevated card-stat" style="height:180px;">
            <div class="card-header" style="border-bottom:none; padding-bottom:0;">
              <span class="card-title" x-text="lang === 'ar' ? 'مؤشر جاهزية تدقيق ISO 13485' : 'ISO 13485 Readiness Index'"></span>
              <span class="badge badge-success">ISO</span>
            </div>
            <div class="card-stat-value" style="color:var(--color-success);" x-text="kpis.isoScore + '%'"></div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span class="card-subtitle" x-text="lang === 'ar' ? 'تطابق معايير الأجهزة الطبية' : 'Medical device specification compliance'"></span>
            </div>
          </div>
        </section>

        <!-- 2. KANBAN BOARD FOR CAPA MANAGEMENT SYSTEM (Open, In Progress, Verification, Closed) -->
        <section class="card card-outlined" style="display:flex; flex-direction:column; gap:var(--spacing-md);">
          <div class="card-header">
            <h3 class="card-title" x-text="lang === 'ar' ? 'لوحة كانبان بصرية لإجراءات الـ CAPA المعتمدة' : 'Visual CAPA Management Kanban Board'"></h3>
            <span class="badge badge-solid badge-primary" x-text="lang === 'ar' ? 'نقاط إجراءات نشطة' : 'Active Vouchers'"></span>
          </div>

          <div class="kanban-board">
            <!-- Column 1: Open -->
            <div class="kanban-column">
              <div class="kanban-column-title">
                <span x-text="lang === 'ar' ? 'مفتوح (Open)' : 'Open'"></span>
                <span class="badge badge-neutral" x-text="kanban.open.length"></span>
              </div>
              <template x-for="card in kanban.open" :key="card.id">
                <div class="kanban-card" @click="moveKanbanCard(card.id, 'progress')">
                  <div style="font-weight:600; font-size:var(--font-size-xs); color:var(--text-primary);" x-text="card.title"></div>
                  <div style="font-size:10px; color:var(--text-secondary);" x-text="card.owner"></div>
                  <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
                    <span class="badge badge-danger" style="font-size:8px; padding:2px 4px;" x-text="card.priority"></span>
                    <span style="font-size:9px; color:var(--text-muted);" x-text="card.age"></span>
                  </div>
                </div>
              </template>
            </div>

            <!-- Column 2: In Progress -->
            <div class="kanban-column">
              <div class="kanban-column-title">
                <span x-text="lang === 'ar' ? 'قيد العمل (In Progress)' : 'In Progress'"></span>
                <span class="badge badge-primary" x-text="kanban.progress.length"></span>
              </div>
              <template x-for="card in kanban.progress" :key="card.id">
                <div class="kanban-card" @click="moveKanbanCard(card.id, 'verify')">
                  <div style="font-weight:600; font-size:var(--font-size-xs); color:var(--text-primary);" x-text="card.title"></div>
                  <div style="font-size:10px; color:var(--text-secondary);" x-text="card.owner"></div>
                  <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
                    <span class="badge badge-warning" style="font-size:8px; padding:2px 4px;" x-text="card.priority"></span>
                    <span style="font-size:9px; color:var(--text-muted);" x-text="card.age"></span>
                  </div>
                </div>
              </template>
            </div>

            <!-- Column 3: Pending Verification -->
            <div class="kanban-column">
              <div class="kanban-column-title">
                <span x-text="lang === 'ar' ? 'انتظار التحقق (Pending Verification)' : 'Pending Verification'"></span>
                <span class="badge badge-warning" x-text="kanban.verify.length"></span>
              </div>
              <template x-for="card in kanban.verify" :key="card.id">
                <div class="kanban-card" @click="moveKanbanCard(card.id, 'closed')">
                  <div style="font-weight:600; font-size:var(--font-size-xs); color:var(--text-primary);" x-text="card.title"></div>
                  <div style="font-size:10px; color:var(--text-secondary);" x-text="card.owner"></div>
                  <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
                    <span class="badge badge-success" style="font-size:8px; padding:2px 4px;" x-text="card.priority"></span>
                    <span style="font-size:9px; color:var(--text-muted);" x-text="card.age"></span>
                  </div>
                </div>
              </template>
            </div>

            <!-- Column 4: Closed -->
            <div class="kanban-column">
              <div class="kanban-column-title">
                <span x-text="lang === 'ar' ? 'مغلق (Closed)' : 'Closed'"></span>
                <span class="badge badge-success" x-text="kanban.closed.length"></span>
              </div>
              <template x-for="card in kanban.closed" :key="card.id">
                <div class="kanban-card">
                  <div style="font-weight:600; font-size:var(--font-size-xs); color:var(--text-muted);" x-text="card.title"></div>
                  <div style="font-size:10px; color:var(--text-muted);" x-text="card.owner"></div>
                  <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
                    <span class="badge badge-neutral" style="font-size:8px; padding:2px 4px;" x-text="card.priority"></span>
                    <span style="font-size:9px; color:var(--text-muted);" x-text="card.age"></span>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </section>

        <!-- 3. ROOT CAUSE ANALYSIS TOOL (Fishbone Ishikawa & 5 Whys interactive Tool) -->
        <section class="card card-outlined" style="display:flex; flex-direction:column; gap:var(--spacing-md);">
          <div class="card-header">
            <h3 class="card-title" x-text="lang === 'ar' ? 'أداة تحليل الأسباب الجذرية الاستباقية (هيكل السمكة - Ishikawa)' : 'Interactive Root Cause Ishikawa Fishbone Diagram'"></h3>
            <span class="badge badge-solid badge-danger" x-text="lang === 'ar' ? 'توجيهات الذكاء الاصطناعي' : 'AI-suggested Root Causes'"></span>
          </div>

          <div class="fishbone-container">
            <div class="fishbone-branches">
              <!-- Branch 1: People -->
              <div class="fishbone-branch" @click="triggerIshikawaInfo('people')">
                <span class="fishbone-branch-title" x-text="lang === 'ar' ? 'الأفراد والعمالة (People)' : 'People / Operators'"></span>
                <span class="fishbone-branch-defect" x-text="lang === 'ar' ? 'انحراف مهارة المشغل للماكينة 4' : 'Extruder operator skill drift'"></span>
                <span class="fishbone-branch-defect" x-text="lang === 'ar' ? 'تأخر مناولي المستودع في الجرد' : 'Warehouse handling lag'"></span>
              </div>

              <!-- Branch 2: Machinery -->
              <div class="fishbone-branch" @click="triggerIshikawaInfo('machinery')">
                <span class="fishbone-branch-title" x-text="lang === 'ar' ? 'الآلات والمعدات (Machinery)' : 'Machinery / Tools'"></span>
                <span class="fishbone-branch-defect" x-text="lang === 'ar' ? 'انحراف معايرة مكبس التبريد 2' : 'Molding press calibration drift'"></span>
                <span class="fishbone-branch-defect" x-text="lang === 'ar' ? 'تآكل ميكانيكي لسن الصب' : 'Mold core mechanical wear'"></span>
              </div>

              <!-- Branch 3: Materials -->
              <div class="fishbone-branch" @click="triggerIshikawaInfo('materials')">
                <span class="fishbone-branch-title" x-text="lang === 'ar' ? 'المواد الخام (Materials)' : 'Materials / Compound'"></span>
                <span class="fishbone-branch-defect" x-text="lang === 'ar' ? 'رطوبة عالية في حبيبات PVC المستلمة' : 'High humidity in raw PVC bags'"></span>
                <span class="fishbone-branch-defect" x-text="lang === 'ar' ? 'شحنة شريط إسفنجي منتهية الصلاحية' : 'Expired Lot: Sponge Tape 20mm'"></span>
              </div>
            </div>

            <!-- Central Spine -->
            <div class="fishbone-spine">
              <div class="fishbone-head" x-text="lang === 'ar' ? 'تلف المرفوضات الطبي' : 'Reject Waste'"></div>
            </div>

            <div class="fishbone-branches">
              <!-- Branch 4: Methods -->
              <div class="fishbone-branch" @click="triggerIshikawaInfo('methods')">
                <span class="fishbone-branch-title" x-text="lang === 'ar' ? 'الأساليب والعمليات (Methods)' : 'Methods / SOPs'"></span>
                <span class="fishbone-branch-defect" x-text="lang === 'ar' ? 'تخزين مواد حساسة دون قياس رطوبة' : 'Storage without continuous monitoring'"></span>
                <span class="fishbone-branch-defect" x-text="lang === 'ar' ? 'عدم الالتزام بـ SOP لتغذية الماكينة' : 'Extrusion feed rate bypass'"></span>
              </div>

              <!-- Branch 5: Environment -->
              <div class="fishbone-branch" @click="triggerIshikawaInfo('environment')">
                <span class="fishbone-branch-title" x-text="lang === 'ar' ? 'بيئة العمل والظروف (Environment)' : 'Environment / Humidity'"></span>
                <span class="fishbone-branch-defect" x-text="lang === 'ar' ? 'رطوبة مرتفعة بمستودع 2 (> 65%)' : 'Moisture spikes in WH2 > 65%'"></span >
                <span class="fishbone-branch-defect" x-text="lang === 'ar' ? 'تذبذب الحرارة أثناء النقل' : 'Temperature excursion in transit'"></span>
              </div>

              <!-- Branch 6: Measurements -->
              <div class="fishbone-branch" @click="triggerIshikawaInfo('measurements')">
                <span class="fishbone-branch-title" x-text="lang === 'ar' ? 'القياسات والتدقيق (Measurements)' : 'Measurements / Calibration'"></span>
                <span class="fishbone-branch-defect" x-text="lang === 'ar' ? 'تأخر صيانة ومعايرة المقاييس المخبرية' : 'Lab calibration delay exceeding 12d'"></span>
              </div>
            </div>
          </div>
        </section>

        <!-- 4. INTERACTIVE 5 WHYS INVESTIGATION TOOL & SFDA AUDIT READINESS -->
        <section class="quality-grid-2">
          <!-- Interactive 5 Whys -->
          <div class="card card-outlined" style="display:flex; flex-direction:column; justify-content:space-between; height:410px; padding:var(--spacing-lg);">
            <div class="card-header" style="padding-bottom:var(--spacing-xs); margin-bottom:var(--spacing-xs);">
              <div class="card-title" style="display:flex; align-items:center; gap:var(--spacing-sm);">
                <span>🔬</span>
                <span x-text="lang === 'ar' ? 'أداة التحقيق الخمس الاستقصائية (5 Whys Tool)' : 'Interactive Quality 5 Whys Tool'"></span>
              </div>
            </div>
            
            <div style="display:flex; flex-direction:column; gap:var(--spacing-xs); flex-grow:1; overflow-y:auto; justify-content:center;">
              <template x-for="step in whysSteps">
                <div style="display:flex; gap:var(--spacing-sm); align-items:center;">
                  <span class="badge badge-primary" style="min-width:32px;" x-text="'Why ' + step.id"></span>
                  <div style="font-size:var(--font-size-xs); color:var(--text-primary); font-weight:600;" x-text="step.text"></div>
                </div>
              </template>
            </div>
            
            <div style="display:flex; gap:var(--spacing-sm); margin-top:var(--spacing-sm);">
              <button class="btn btn-outline" style="flex-grow:1;" @click="generateNextWhy()" x-text="lang === 'ar' ? 'توليد السؤال التالي' : 'Ask Next Why'"></button>
              <button class="btn btn-primary" @click="saveWhysInvestigation()" x-text="lang === 'ar' ? 'حفظ وإرسال التحقيق' : 'Save Investigation'"></button>
            </div>
          </div>

          <!-- SFDA & ISO Audit Readiness Checklist -->
          <div class="card card-outlined" style="height:410px; padding:var(--spacing-lg); display:flex; flex-direction:column; justify-content:space-between;">
            <div class="card-header" style="padding-bottom:var(--spacing-xs); margin-bottom:var(--spacing-xs);">
              <div class="card-title" style="display:flex; align-items:center; gap:var(--spacing-sm);">
                <span>📋</span>
                <span x-text="lang === 'ar' ? 'مؤشر جاهزية تدقيق الغذاء والدواء SFDA' : 'SFDA & ISO Audit Readiness Scorecard'"></span>
              </div>
              <span class="badge badge-success" x-text="kpis.auditReadiness + '% Ready'"></span>
            </div>

            <div style="display:flex; flex-direction:column; gap:var(--spacing-sm); flex-grow:1; justify-content:center; overflow-y:auto; padding-bottom:var(--spacing-sm);">
              <label class="form-check">
                <input type="checkbox" class="form-check-input" x-model="checklist.ncr">
                <span style="font-size:var(--font-size-xs);" x-text="lang === 'ar' ? 'إصدار تقرير عدم المطابقة (NCR) لكافة الحالات المرتفعة' : 'NCR generated for high-value cases'"></span>
              </label>
              <label class="form-check">
                <input type="checkbox" class="form-check-input" x-model="checklist.oos">
                <span style="font-size:var(--font-size-xs);" x-text="lang === 'ar' ? 'استقصاء ومراجعة سجلات الـ OOS والامتثال المخبري' : 'OOS laboratory investigations updated'"></span>
              </label>
              <label class="form-check">
                <input type="checkbox" class="form-check-input" x-model="checklist.calibration">
                <span style="font-size:var(--font-size-xs);" x-text="lang === 'ar' ? 'تحديث ومعايرة مقاييس وموازين المستودعات' : 'Storage scales calibrated & documented'"></span>
              </label>
              <label class="form-check">
                <input type="checkbox" class="form-check-input" x-model="checklist.sop">
                <span style="font-size:var(--font-size-xs);" x-text="lang === 'ar' ? 'ربط إجراءات الـ CAPA المفتوحة بالسجلات المعلقة' : 'CAPA linked to open reject vouchers'"></span>
              </label>
            </div>
            
            <p style="font-size:10px; color:var(--text-muted); line-height:1.5;" x-text="lang === 'ar' ? 'ملاحظة: مؤشرات الجاهزية تدعم الرصد المسبق لمتطلبات التدقيق للبلدية وهيئة الغذاء والدواء السعودية SFDA.' : 'Advisory score mapped to regulatory audit readiness frameworks for Saudi SFDA inspections.'"></p>
          </div>
        </section>

      </main>
    </div>

  </div>

  <!-- Embedded Script to Coordinate Local State, ApexCharts & Board Calculations -->
  <script>
    function qualityApp() {
      return {
        // UI Layout
        sidebarCollapsed: false,
        darkMode: false,
        lang: 'ar',
        
        // QMS metrics
        kpis: {
          qualityScore: 88.5,
          ncrRate: 2.4,
          isoScore: 92,
          auditReadiness: 75
        },

        // Checklist states
        checklist: {
          ncr: true,
          oos: false,
          calibration: true,
          sop: false
        },

        // CAPA Kanban Columns
        kanban: {
          open: [
            { id: 1, title: 'عزل رطوبة المستودع الثاني لـ Sponge Tape', owner: 'إبراهيم علوان', priority: 'Critical', age: 'منذ 3 أيام' },
            { id: 2, title: 'إرسال مطالبة مالية لمورد الكرتون Mais', owner: 'رائد الشهري', priority: 'High', age: 'منذ 5 أيام' }
          ],
          progress: [
            { id: 3, title: 'معايرة وإصلاح الملقب لـ Extruder-4', owner: 'محمد العتيبي', priority: 'High', age: 'قيد العمل' }
          ],
          verify: [
            { id: 4, title: 'فحص حبيبات الـ PVC الدوائية الملوثة', owner: 'أحمد القرني', priority: 'Medium', age: 'انتظار التحقق' }
          ],
          closed: [
            { id: 5, title: 'أرشفة وثائق إتلاف Lot C10 مع البلدية', owner: 'خالد السديري', priority: 'Low', age: 'تم الإغلاق' }
          ]
        },

        // Whys investigation steps
        whysSteps: [
          { id: 1, text: 'لماذا حدث تلف في شريط إسفنجي Lot 2026-98؟' },
          { id: 2, text: 'بسبب تدهور الصمغ والتصاق المواد ببعضها.' },
          { id: 3, text: 'لماذا تدهور الصمغ والتصق؟' },
          { id: 4, text: 'بسبب ارتفاع مستويات الرطوبة في المستودع الثاني لـ 68%.' }
        ],

        // Core Functions
        init() {
          this.initThemeAndLang();
          this.calculateReadiness();
          
          // Watch for checklist changes to dynamically recalculate audit score
          this.$watch('checklist', () => this.calculateReadiness());
        },

        initThemeAndLang() {
          this.darkMode = localStorage.getItem('darkMode') === 'true';
          this.lang = localStorage.getItem('lang') || 'ar';
          
          document.documentElement.setAttribute('data-theme', this.darkMode ? 'dark' : 'light');
          document.documentElement.setAttribute('dir', this.lang === 'ar' ? 'rtl' : 'ltr');
          
          if (this.darkMode) {
            document.body.classList.add('dark');
          }
        },

        toggleSidebar() {
          this.sidebarCollapsed = !this.sidebarCollapsed;
        },

        toggleDarkMode() {
          this.darkMode = !this.darkMode;
          localStorage.setItem('darkMode', this.darkMode);
          document.documentElement.setAttribute('data-theme', this.darkMode ? 'dark' : 'light');
        },

        toggleLanguage() {
          this.lang = this.lang === 'ar' ? 'en' : 'ar';
          localStorage.setItem('lang', this.lang);
          document.documentElement.setAttribute('dir', this.lang === 'ar' ? 'rtl' : 'ltr');
          
          if (this.lang === 'ar') {
            this.whysSteps = [
              { id: 1, text: 'لماذا حدث تلف في شريط إسفنجي Lot 2026-98؟' },
              { id: 2, text: 'بسبب تدهور الصمغ والتصاق المواد ببعضها.' },
              { id: 3, text: 'لماذا تدهور الصمغ والتصق؟' },
              { id: 4, text: 'بسبب ارتفاع مستويات الرطوبة في المستودع الثاني لـ 68%.' }
            ];
          } else {
            this.whysSteps = [
              { id: 1, text: 'Why did Sponge Tape Lot 2026-98 fail?' },
              { id: 2, text: 'Because of adhesive degradation and fusion.' },
              { id: 3, text: 'Why did the adhesive degrade?' },
              { id: 4, text: 'Because humidity levels in Warehouse 2 exceeded 68%.' }
            ];
          }
        },

        calculateReadiness() {
          const totalChecks = Object.keys(this.checklist).length;
          const checkedCount = Object.values(this.checklist).filter(v => v === true).length;
          this.kpis.auditReadiness = Math.round((checkedCount / totalChecks) * 100);
        },

        // Kanban Card Mover (Simple reactive states)
        moveKanbanCard(cardId, nextStage) {
          let cardToMove = null;
          
          // Locate and isolate card
          Object.keys(this.kanban).forEach(col => {
            const found = this.kanban[col].find(c => c.id === cardId);
            if (found) {
              cardToMove = found;
              this.kanban[col] = this.kanban[col].filter(c => c.id !== cardId);
            }
          });

          if (cardToMove) {
            cardToMove.age = this.lang === 'ar' ? 'تم النقل الآن' : 'Just moved';
            this.kanban[nextStage].push(cardToMove);
            
            // Dispatch dynamic socket notifications or alerts
            alert(this.lang === 'ar' ? `تم نقل بطاقة CAPA بنجاح للحالة التالية: ${nextStage}` : `CAPA card dispatched to: ${nextStage}`);
          }
        },

        triggerIshikawaInfo(category) {
          const info = {
            people: this.lang === 'ar' ? 'توصية الأفراد: إعادة تأهيل وتدريب فني لمشغلي ماكينات البثق لـ Extruder-4.' : 'People Recommendation: Implement formal mechanical training for extruder operators.',
            machinery: this.lang === 'ar' ? 'توصية الآلات: جدولة صيانة ومعايرة ميكانيكية عاجلة لمكبس التبريد رقم 2.' : 'Machinery Recommendation: Schedule urgent press calibration for mold press 2.',
            materials: this.lang === 'ar' ? 'توصية المواد: رفض شحنات PVC الملوثة ومطالبة المورد بالتعويض المالي.' : 'Materials Recommendation: Reject contaminated polymers and request supplier credit.',
            methods: this.lang === 'ar' ? 'توصية الأساليب: تفعيل مستشعرات الرطوبة والإنذارات الفورية في المستودعات.' : 'Methods Recommendation: Enforce digital tracking and humidity limits.',
            environment: this.lang === 'ar' ? 'توصية البيئة: عزل غرف المستودع لـ Sponge Tape لدرجة حرارة 20 ورطوبة < 45%.' : 'Environment Recommendation: Isolate Storage room 2 for sensitive tapes.',
            measurements: this.lang === 'ar' ? 'توصية القياسات: ربط مقاييس الجودة مخبرياً بنظام المعايرة الآلي الأسبوعي.' : 'Measurements Recommendation: Connect lab scales to automated calibration logs.'
          };

          alert(info[category]);
        },

        generateNextWhy() {
          if (this.whysSteps.length >= 5) {
            alert(this.lang === 'ar' ? 'تم اكتمال الخطوات الخمس الاستقصائية (5 Whys) للتحقيق بنجاح.' : 'Five Whys audit path is fully generated.');
            return;
          }

          if (this.whysSteps.length === 4) {
            const step5 = this.lang === 'ar' 
              ? { id: 5, text: 'بسبب عدم تفعيل مستشعر الرطوبة الذكي في المستودع لـ SOP (السبب الجذري النهائي).' }
              : { id: 5, text: 'Due to missing digital humidity alarms in storage according to SOP (Root Cause).' };
            
            this.whysSteps.push(step5);
          }
        },

        saveWhysInvestigation() {
          alert(this.lang === 'ar' ? 'تم حفظ وإرسال التحقيق الفني لـ QCM وإرفاقه بالوثيقة NCR بنجاح!' : 'Root cause 5 Whys investigation filed and dispatched to Quality Manager!');
        },

        exportQMSReport() {
          alert(this.lang === 'ar' ? 'جاري تصدير وثيقة الجودة والجاهزية لتدقيق الغذاء والدواء SFDA بصيغة PDF...' : 'Generating and downloading SFDA / ISO 13485 audit readiness document...');
        }
      };
    }
  </script>
  <!-- Global AI Assistant Chatbot -->
  <script src="../assets/js/ai-assistant.js"></script>
  <!-- Enterprise Notifications System -->
  <script src="/assets/js/notifications.js"></script>
</body>
</html>
